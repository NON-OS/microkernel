[package]
name = "embed-zk-proof"
version = "0.2.0"
edition = "2021"
publish = false
authors = ["eK <team@nonos.systems>"]
description = "Generate and embed transparent ZK attestation proofs into signed NONOS kernel binaries"
license = "AGPL-3.0"

[workspace]

[dependencies]
anyhow = "1.0"
clap = { version = "4.0", features = ["derive"] }
blake3 = "1.5"
hex = "0.4"
curve25519-dalek = "4.1.3"
nonos-attestation-circuit = { path = "../nonos-attestation-circuit" }

[dev-dependencies]
nonos-stark = { path = "../../../stark-attest/crates/stark-core" }
