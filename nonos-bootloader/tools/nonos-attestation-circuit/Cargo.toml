[package]
name = "nonos-attestation-circuit"
version = "1.0.0"
edition = "2021"
publish = false
license = "AGPL-3.0"
authors = ["NONOS Team by eK <team@nonos.systems>"]
description = "Attestation circuit for NONOS capsule integrity and hardware measurements"

# Standalone - not part of parent workspace
[workspace]

[lib]
name = "nonos_attestation_circuit"
path = "src/lib.rs"

[[bin]]
name = "generate-keys"
path = "src/bin/generate_keys.rs"

[[bin]]
name = "generate-proof"
path = "src/bin/generate_proof.rs"

[[bin]]
name = "capture-provenance"
path = "src/bin/capture_provenance.rs"

[[bin]]
name = "verify-proof"
path = "src/bin/verify_proof.rs"

[[bin]]
name = "policy-root"
path = "src/bin/policy_root.rs"

[[bin]]
name = "capsule-attest-proof"
path = "src/bin/capsule_attest_demo.rs"

[[bin]]
name = "capsule-attest-fleet"
path = "src/bin/capsule_attest_fleet.rs"

[[bin]]
name = "nox-zk-receipt"
path = "src/bin/nox_zk_receipt.rs"

[[bin]]
name = "nox-work-receipt"
path = "src/bin/nox_work_receipt.rs"

[[bin]]
name = "nox-receipt-verify"
path = "src/bin/nox_receipt_verify.rs"

[[bin]]
name = "nox-merkle"
path = "src/bin/nox_merkle.rs"

[[bin]]
name = "nox-circuit-registry"
path = "src/bin/nox_circuit_registry.rs"

[dependencies]
# Arkworks with std for the key generator binary
ark-std             = { version = "0.5" }
ark-ff              = { version = "0.5" }
ark-ec              = { version = "0.5" }
ark-serialize       = { version = "0.5" }
ark-bls12-381       = { version = "0.5", features = ["curve"] }
ark-groth16         = { version = "0.5" }
ark-relations       = { version = "0.5" }
ark-r1cs-std        = { version = "0.5" }
ark-crypto-primitives = { version = "0.5", features = ["crh", "r1cs"] }

# Common utils
blake3 = { version = "1.5" }
sha2   = { version = "0.10" }
sha3   = { version = "0.10" }

# Std-only crates for the binary
serde = { version = "1.0", features = ["derive"] }
clap  = { version = "4.5", features = ["derive"] }
hex   = { version = "0.4" }
rand  = { version = "0.8", features = ["std"] }

# SNARK trait for setup utilities
ark-snark = { version = "0.5" }

# Additional dependencies for the key generator binary
serde_json = "1.0"
chrono = "0.4"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
tar = "0.4"
flate2 = "1.0"
