[package]
name = "nonos-attestation-circuit"
version = "1.1.0"
edition = "2021"
publish = false
license = "AGPL-3.0"
authors = ["NONOS Team by eK <team@nonos.systems>"]
description = "Transparent enrolled-secret attestation tooling for NONOS"

# Standalone - not part of parent workspace
[workspace]

[lib]
name = "nonos_attestation_circuit"
path = "src/lib.rs"

[[bin]]
name = "transparent-enroll"
path = "src/bin/transparent_enroll.rs"

[[bin]]
name = "transparent-prove"
path = "src/bin/transparent_prove.rs"

[[bin]]
name = "transparent-verify"
path = "src/bin/transparent_verify.rs"

[[bin]]
name = "capsule-attest-proof"
path = "src/bin/capsule_attest_proof.rs"

[dependencies]
blake3 = { version = "1.5" }
clap  = { version = "4.5", features = ["derive"] }
hex   = { version = "0.4" }
curve25519-dalek = { version = "4.1.3", features = ["rand_core"] }
