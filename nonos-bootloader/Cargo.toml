[package]
name = "nonos_boot"
version = "1.1.0"
edition = "2021"
publish = false
authors = ["eK <team@nonos.systems>"]
description = "NONOS Bootloader UEFI stage-0 loader for zero-trust capsule execution"
license = "AGPL-3.0"
repository = "https://github.com/NON-OS/nonos-micro-kernel/tree/main/nonos-bootloader"
readme = "README.md"
documentation = "https://nonos.software"
keywords = ["bootloader", "uefi", "zk", "os", "capsule"]
categories = ["embedded", "no-std", "cryptography", "os"]

# Modern feature resolution across workspace
resolver = "2"

[[bin]]
name = "nonos_boot"
path = "src/main.rs"

[dependencies]
# The attestation path check, shared with the kernel, and the STARK lane's gate
# verifier. The kernel is admitted only when its path and its STARK proof over
# the same slot both check. Pinned by rev.
nonos-attest-path = { path = "../nonos-attest-path" }
nonos-boot-measure = { path = "../nonos-boot-measure" }
nox_verify = { git = "https://github.com/NON-OS/STARKs.git", branch = "main" }
# UEFI stack
uefi = { version = "0.23", features = ["alloc"] }
uefi-services = "0.20"
r-efi = "4.0.0"

# Logging (firmware-safe; actual sink is internal)
log = "0.4"

# ELF parsing and zero-copy helpers
xmas-elf = "0.10"
zerocopy = "0.6"

# Measurements / hashing
# force-soft disables SIMD intrinsics that cause LLVM errors on UEFI target
sha2 = { version = "0.10", default-features = false, features = ["force-soft"] }
blake3 = { version = "1.5", default-features = false, features = ["pure"] }

# Anti-aliased monospace font glyphs (OFL Noto Sans Mono, pure data, no_std)
noto-sans-mono-bitmap = { version = "0.3", default-features = false, features = ["regular", "size_16", "size_20", "size_24", "size_32", "unicode-basic-latin", "unicode-specials"] }

# Misc utilities
bitflags = "2.4"
uuid = { version = "1.6", default-features = false, features = ["macro-diagnostics"] }
bootloader_api = { version = "0.11", default-features = false }
heapless = { version = "0.8", default-features = false }
spin = "0.9"
goblin = { version = "0.7", default-features = false, features = ["elf32", "elf64", "alloc", "endian_fd"] }

# Signature stack (ed25519-dalek v2, uses sha2 0.10 with force-soft for UEFI)
ed25519-dalek = { version = "2.1.1", default-features = false, features = ["alloc", "zeroize"] }
# Explicitly pin curve25519-dalek to patched version (RUSTSEC-2024-0344)
curve25519-dalek = { version = "4.1.3", default-features = false, features = ["alloc", "zeroize"] }

[features]
default = ["logging"]

logging = []
standard = []
hardened = ["standard"]
dev-mode = []
# The gates take a path-only trailer, without the STARK proof, from a
# development image (src/kernel_verify/self_attest.rs). Never with standard.
dev-attest = []
dev-qemu = ["dev-mode", "dev-attest"]
standard-qemu = ["standard"]
production = ["hardened"]
hardened-production = ["production"]
efi-rng = []
nonos-syscall-msr = []
nonos-cet = []

[build-dependencies]
cc = "1.0"
embed-manifest = "1.4.0"
sha2 = "0.10"
blake3 = "1.5"
ed25519-dalek = { version = "2.1", default-features = false, features = ["alloc"] }

[profile.release]
codegen-units = 1
