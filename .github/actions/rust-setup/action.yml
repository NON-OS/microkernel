name: rust-setup
description: >-
  The Rust toolchain rust-toolchain.toml pins, through rustup, for the jobs
  that run cargo outside the flake's shell, with any extra targets.

inputs:
  targets:
    description: "Space-separated targets to add to the toolchain."
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Install the pinned toolchain
      shell: bash
      env:
        TARGETS: ${{ inputs.targets }}
      run: |
        set -euo pipefail
        channel="$(sed -nE 's/^channel *= *"([^"]+)".*/\1/p' rust-toolchain.toml)"
        args=(--profile minimal)
        for t in ${TARGETS}; do args+=(--target "${t}"); done
        rustup toolchain install "${channel}" "${args[@]}"
