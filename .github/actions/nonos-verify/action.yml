name: nonos-verify
description: >-
  One module of the nonos-verify engine, run in the flake's shell, and the
  reports it wrote kept as an artifact whether it passed or not. The
  attestation job fuses the ci-reports-* artifacts into one verdict.

inputs:
  module:
    description: "The nonos-verify subcommand (build, trust-chain, adversarial ...)."
    required: true
  report-name:
    description: "Artifact name; ci-reports-<module> when empty."
    required: false
    default: ""
  report-path:
    description: "What to keep."
    required: false
    default: ci-reports/
  retention-days:
    description: "How long the artifact is kept."
    required: false
    default: "14"

runs:
  using: composite
  steps:
    - name: nonos-verify ${{ inputs.module }}
      shell: bash
      env:
        MODULE: ${{ inputs.module }}
      run: nix develop --command cargo run --release --manifest-path nonos-verify/Cargo.toml -- "${MODULE}"

    - name: Keep the ${{ inputs.module }} reports
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ inputs.report-name || format('ci-reports-{0}', inputs.module) }}
        path: ${{ inputs.report-path }}
        retention-days: ${{ inputs.retention-days }}
        if-no-files-found: error
