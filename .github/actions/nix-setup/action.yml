name: nix-setup
description: >-
  Nix with flakes and the project's binary cache, the one setup every nix
  job shares, so a CI job and a developer's `nix develop` run the same tools
  from flake.lock. The cache is the Cachix cache the repository variable
  NONOS_CACHIX names. It is written only outside pull requests, so no pull
  request's code can put a store path into the cache others read.

inputs:
  cache:
    description: "The Cachix cache to read (vars.NONOS_CACHIX); empty reads none."
    required: false
    default: ""
  cachix-token:
    description: "CACHIX_AUTH_TOKEN; used to write the cache on pushes, schedules and dispatches only."
    required: false
    default: ""
  use-cache:
    description: "'false' for a build that must take nothing from anyone else's outputs (ci-reproducible)."
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Install Nix
      uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      with:
        extra_nix_config: |
          experimental-features = nix-command flakes
          sandbox = true
          max-jobs = auto

    - name: Binary cache
      if: inputs.use-cache == 'true' && inputs.cache != ''
      uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
      with:
        name: ${{ inputs.cache }}
        authToken: ${{ !startsWith(github.event_name, 'pull_request') && inputs.cachix-token || '' }}

    - name: The commit's time, for every timestamp a job writes
      shell: bash
      run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"
