name: ci-boot-smoke

# The blocking boot gate: one cell, one boot. q35-up is the machine every image
# is expected to come up on, so a change that stops the kernel booting at all
# cannot reach main. The breadth lives in ci-boot-matrix.yml, which is
# scheduled and does not gate merges, because the SMP cells are known red. The
# runner has to offer KVM: under TCG this boot is minutes long and a timeout
# would say nothing about the kernel, so the lane refuses to run rather than
# pass in silence.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  boot-smoke:
    runs-on: ubuntu-latest
    # One cell, but two STARK enrolments: a measured end-to-end run is 27-37
    # minutes, so 90 leaves headroom for a cold cache without hiding a wedge.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.2.2
        with:
          submodules: recursive
          persist-credentials: false
      - uses: ./.github/actions/nonos-setup
        with:
          targets: x86_64-nonos,x86_64-unknown-uefi
          qemu: "true"
          module: boot-matrix
      # Kernel bugs here are vendor-specific: #524 reproduced only on
      # AuthenticAMD, so a green cell is only readable next to the host CPU.
      - name: Host CPU
        run: |
          set -euo pipefail
          awk -F: '/^vendor_id|^model name|^cpu family|^model[[:space:]]/ {print $1": "$2; }' /proc/cpuinfo | sort -u
      - name: Hardware virtualisation for the runner user
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -w /dev/kvm || { echo "::error::this runner offers no KVM; the boot gate needs it"; exit 1; }
      - name: Provision scratch trust material
        run: |
          set -euo pipefail
          bash nonos-ci/setup-signing-key.sh
          echo "NONOS_DEV=1" >> "$GITHUB_ENV"
          bash nonos-ci/scratch-trust-bootstrap.sh
      - name: Boot the smoke cell
        run: |
          set -euo pipefail
          make QEMU_NET_MODE=off BOOT_MATRIX_REPEAT=1 \
            BOOT_MATRIX_CELLS=q35-up nonos-mk-boot-matrix
      - name: Upload serial logs and the verdict
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: boot-smoke
          path: |
            target/boot-matrix/*.log
            target/boot-matrix/*.qemu-stderr
            target/boot-matrix/boot-matrix.json
          retention-days: 14
          if-no-files-found: error
