# Guards the boot: the qemu profile sealed with scratch keys made on this runner, booted headless with a software TPM from its image and from a USB stick (nonos-ci/boot-smoke.sh).
# Runs when called by pr and main, or by hand to force the TCG path; ci-boot-matrix holds the breadth.
name: ci-boot-smoke

on:
  workflow_call:
    secrets:
      CACHIX_AUTH_TOKEN:
        required: false
  workflow_dispatch:
    inputs:
      force-tcg:
        description: "Boot under TCG even if the runner offers KVM"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  boot-smoke:
    name: boot-smoke
    runs-on: ubuntu-latest
    # Two STARK enrollments and a cold image build when the cache misses.
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The seal keeps the committed enrollment only when git shows no
          # capsule source changed since the commit it was proved at, which a
          # one-commit clone cannot answer.
          fetch-depth: 0
      - uses: ./.github/actions/nix-setup
        with:
          cache: ${{ vars.NONOS_CACHIX }}
          cachix-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Host CPU and hardware virtualisation
        env:
          NONOS_FORCE_TCG: ${{ inputs.force-tcg || false }}
        run: bash nonos-ci/enable-kvm.sh --allow-tcg
      - name: Scratch keys, for this runner only
        run: bash nonos-ci/boot-smoke.sh keys
      - name: Seal the qemu profile
        run: bash nonos-ci/boot-smoke.sh seal
      - name: Boot it
        run: bash nonos-ci/boot-smoke.sh boot
      - name: Boot it from a USB stick
        run: bash nonos-ci/boot-smoke.sh usb
      - name: Keep the serial logs and the seal's record
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: boot-smoke
          path: |
            target/qemu/serial.log
            target/qemu/serial-usb.log
            target/release/*/nonos-release.json
            target/release/*/logs/
          retention-days: 14
          if-no-files-found: error
