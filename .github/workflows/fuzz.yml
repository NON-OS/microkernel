name: fuzz

# Nightly fuzz runs over the parsers of untrusted input. A crash fails the run
# and its input is kept as an artifact, to become a regression test. The
# corpus is cached between nights, so each run resumes where the last one
# stopped. A night gives each target 30 minutes: thirteen targets at hosted
# runner prices. The 12 h release campaigns run on the build machine with the
# same targets; a longer hosted run is a manual dispatch, at most 5.5 h.

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:
    inputs:
      seconds:
        description: "Run length per target, in seconds"
        required: false
        default: "1800"

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fuzz:
    name: fuzz ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        include:
          - crate: nonos-attest-path
            target: v4_parse
            seed: true
          - crate: nonos-attest-path
            target: v3_path
          - crate: userland/tls_proofs
            target: tls_cert
            seed: true
          - crate: userland/tls_proofs
            target: tls_record
          - crate: userland/kernel_proofs
            target: elf_header
          - crate: userland/net_proofs
            target: dns
          - crate: userland/net_proofs
            target: net_packets
          - crate: userland/admission_proofs
            target: manifest
            seed: true
          - crate: userland/admission_proofs
            target: id_cert
            seed: true
          - crate: userland/capsule_linux_proofs
            target: linux_inputs
          - crate: userland/driver_proofs
            target: ipc_decoders
    env:
      SECONDS_PER_TARGET: ${{ inputs.seconds || '1800' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
        with:
          persist-credentials: false
      - name: Toolchain and cargo-fuzz
        run: |
          channel="$(sed -nE 's/^channel *= *"([^"]+)".*/\1/p' rust-toolchain.toml)"
          rustup toolchain install "${channel}" --profile minimal
          cargo install --locked cargo-fuzz --version 0.13.2
      - name: Restore the corpus
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ matrix.crate }}/fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-
      - name: Seed
        working-directory: ${{ matrix.crate }}/fuzz
        run: |
          if [ "${{ matrix.seed }}" = true ]; then python3 seed.py --out "corpus/${{ matrix.target }}"; fi
      - name: Run
        working-directory: ${{ matrix.crate }}/fuzz
        run: |
          cargo fuzz run "${{ matrix.target }}" "corpus/${{ matrix.target }}" -- \
            -max_total_time="${SECONDS_PER_TARGET}" -print_final_stats=1 \
            2>&1 | tee "fuzz-${{ matrix.target }}.log"
      - name: Keep the log and any crash
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-${{ matrix.target }}
          path: |
            ${{ matrix.crate }}/fuzz/fuzz-${{ matrix.target }}.log
            ${{ matrix.crate }}/fuzz/artifacts/
          if-no-files-found: warn
