# Guards the build as a contributor runs it: nix build on Linux and macOS, make in WSL2 on Windows, the devcontainer, and nonos-verify build.
# Runs when called by pr, main, nightly and release; production mode checks the committed trust set.
name: ci-build

on:
  workflow_call:
    inputs:
      trust-mode:
        description: "scratch for pull requests and branches, production for the release gates"
        required: false
        type: string
        default: scratch
      platforms:
        description: "run the platform builds; the trust mode changes only nonos-verify build"
        required: false
        type: boolean
        default: true
      from-source:
        description: "build the Windows and devcontainer jobs without the binary cache"
        required: false
        type: boolean
        default: false
    secrets:
      SIGNING_KEY_BASE64:
        required: false
      CACHIX_AUTH_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  platforms:
    name: nix build (${{ matrix.name }})
    if: inputs.platforms
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64, runner: ubuntu-latest }
          - { name: macos-aarch64, runner: macos-latest }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/nix-setup
        with:
          cache: ${{ vars.NONOS_CACHIX }}
          cachix-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: nix build
        run: nix build .#default -L --keep-going
      - name: Collect the build manifest
        if: always()
        run: |
          mkdir -p ci-reports/build
          cp result/nonos-build.json "ci-reports/build/nonos-build-${{ matrix.name }}.json" 2>/dev/null || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: nonos-build-${{ matrix.name }}
          path: ci-reports/build/
          retention-days: 14
          if-no-files-found: ignore

  # The same make commands inside WSL2, from a checkout whose line endings Git
  # left alone, so the source is byte for byte the one Linux sees.
  windows:
    name: make build, make check (windows, WSL2)
    if: inputs.platforms
    runs-on: windows-latest
    timeout-minutes: 240
    defaults:
      run:
        shell: wsl-bash {0}
    steps:
      - name: Keep line endings as committed
        shell: pwsh
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Reclaim runner disk space
        shell: pwsh
        run: ./nonos-ci/windows-reclaim-disk.ps1
      - uses: Vampire/setup-wsl@4c48163d9f981914dd8caa0fc335fe19cca5bff4 # v7.2.0
        with:
          distribution: Ubuntu-24.04
          additional-packages: curl xz-utils git make ca-certificates
      - name: Install Nix in WSL2
        run: bash nonos-ci/wsl-nix.sh install "${{ !inputs.from-source && vars.NONOS_CACHIX || '' }}"
      - name: Copy the checkout into the Linux filesystem
        run: bash nonos-ci/wsl-nix.sh clone
      - name: make build
        run: bash nonos-ci/wsl-nix.sh make doctor build
      - name: make check
        run: bash nonos-ci/wsl-nix.sh make check

  container:
    name: nix build (devcontainer)
    if: inputs.platforms
    runs-on: ubuntu-latest
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the devcontainer image
        run: docker build -t nonos-dev .devcontainer
      - name: nix build inside it
        env:
          CACHE: ${{ !inputs.from-source && vars.NONOS_CACHIX || '' }}
        run: |
          NIX_CONFIG="$(bash nonos-ci/nix-cache-config.sh "${CACHE}")"
          docker run --rm --privileged -e NIX_CONFIG="${NIX_CONFIG}" \
            -v "$PWD:/workspaces/microkernel" -w /workspaces/microkernel nonos-dev \
            bash -lc 'git config --global --add safe.directory "$PWD" && nix build .#default -L --keep-going --no-link'

  verify:
    name: nonos-verify build
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/nix-setup
        with:
          cache: ${{ vars.NONOS_CACHIX }}
          cachix-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Provision ${{ inputs.trust-mode }} trust material
        env:
          SIGNING_KEY_BASE64: ${{ secrets.SIGNING_KEY_BASE64 }}
        run: nix develop --command bash nonos-ci/provision-trust.sh "${{ inputs.trust-mode }}"
      - uses: ./.github/actions/nonos-verify
        with:
          module: build
