name: ci-build

# The build, as a contributor runs it, on every platform NONOS supports.
#
#   platforms  `nix build` of the reproducible artifacts on Linux x86_64, Linux
#              aarch64 and macOS, and inside the devcontainer, the Windows
#              path for anyone without WSL2. A platform that cannot build
#              fails this workflow.
#   windows    `make build` and `make check` inside WSL2 on a Windows runner.
#   verify     the `nonos-verify build` lane: clippy, the capsule kernel, its
#              section sizes and the symbol scan, run in the flake's shell.

on:
  workflow_call:
    inputs:
      trust-mode:
        description: "scratch for PR/dev CI, production for release gates"
        required: false
        type: string
        default: "scratch"
    secrets:
      SIGNING_KEY_BASE64:
        required: false
      CACHIX_AUTH_TOKEN:
        required: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ci-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  platforms:
    name: nix build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64, runner: ubuntu-latest }
          - { name: macos-aarch64, runner: macos-latest }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/nix-setup
        with:
          cache: ${{ vars.NONOS_CACHIX }}
          # Written only by pushes to this repository, never by a pull request's
          # code, so no PR can put a store path into the cache others read.
          cachix-token: ${{ github.event_name == 'push' && secrets.CACHIX_AUTH_TOKEN || '' }}
      - name: nix build
        run: nix build .#default -L --keep-going
      - name: The build manifest
        if: always()
        run: |
          mkdir -p ci-reports/build
          cp result/nonos-build.json "ci-reports/build/nonos-build-${{ matrix.name }}.json" 2>/dev/null || true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: nonos-build-${{ matrix.name }}
          path: ci-reports/build/
          retention-days: 14
          if-no-files-found: ignore

  # Windows builds in WSL2, the way a Windows contributor does: the same two
  # make commands inside a Linux distribution, from a checkout whose line
  # endings Git left alone, so the source is byte for byte the one Linux sees.
  windows:
    name: make build, make check (windows, WSL2)
    runs-on: windows-latest
    timeout-minutes: 360
    defaults:
      run:
        shell: wsl-bash {0}
    steps:
      - name: Keep line endings as committed
        shell: pwsh
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: Vampire/setup-wsl@d1da7f2c0322a5ee4f24975344f67fc0f5baf364 # v7.0.0
        with:
          distribution: Ubuntu-24.04
          additional-packages: curl xz-utils git make ca-certificates
      # setup-wsl has no install-location input, so the distro's ext4.vhdx
      # lands on C:, which make check fills until the guest sees EIO and a
      # read-only root. Move it to the workspace drive when that drive has more
      # room, under the same name, which the wsl-bash wrapper and the root
      # default user both rely on.
      - name: Move the WSL2 disk to the workspace drive
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $distro = 'Ubuntu-24.04'
          $drive = Split-Path -Qualifier $env:GITHUB_WORKSPACE
          $target = Join-Path $drive "wsl\$distro"
          Get-PSDrive C, $drive.TrimEnd(':') | Format-Table Name,Used,Free
          $freeC = (Get-PSDrive C).Free
          $freeW = (Get-PSDrive $drive.TrimEnd(':')).Free
          if ($drive -eq 'C:' -or $freeW -le $freeC) {
            Write-Output "$drive has no more room than C: ($freeW vs $freeC bytes free), the disk stays on C:"
            exit 0
          }
          wsl --shutdown
          wsl --manage $distro --move $target
          if ($LASTEXITCODE -ne 0) {
            Write-Output "wsl --manage --move exited $LASTEXITCODE, exporting and importing in place instead"
            New-Item -ItemType Directory -Force -Path $target | Out-Null
            $vhd = Join-Path $target 'ext4.vhdx'
            Remove-Item -Force -ErrorAction SilentlyContinue -LiteralPath $vhd
            wsl --export $distro $vhd --vhd
            if ($LASTEXITCODE -ne 0) { throw "wsl --export exited $LASTEXITCODE" }
            wsl --unregister $distro
            if ($LASTEXITCODE -ne 0) { throw "wsl --unregister exited $LASTEXITCODE" }
            wsl --import-in-place $distro $vhd
            if ($LASTEXITCODE -ne 0) { throw "wsl --import-in-place exited $LASTEXITCODE" }
            wsl --set-default $distro
            if ($LASTEXITCODE -ne 0) { throw "wsl --set-default exited $LASTEXITCODE" }
          }
          $base = (Get-ChildItem HKCU:\Software\Microsoft\Windows\CurrentVersion\Lxss |
            Where-Object { $_.GetValue('DistributionName') -eq $distro }).GetValue('BasePath')
          Write-Output "$distro BasePath: $base"
          if ($base -notlike "*$drive\*") { throw "$distro is still at $base, not on $drive" }
          $user = (wsl --distribution $distro whoami | Out-String).Trim()
          if ($user -ne 'root') { throw "$distro default user is '$user', not root" }
      - name: Install Nix in WSL2
        run: |
          set -euo pipefail
          # The WSL shell runs as root, and Nix run as root builds as the
          # nixbld users: the single-user installer stops when the group is
          # missing, so make it and its build users first.
          if ! getent group nixbld >/dev/null; then
            groupadd --system nixbld
            for i in $(seq 1 8); do
              useradd --system --no-create-home --home-dir /var/empty \
                --shell /usr/sbin/nologin --gid nixbld --groups nixbld "nixbld$i"
            done
          fi
          curl -fsSL https://nixos.org/nix/install | sh -s -- --no-daemon --yes
          mkdir -p ~/.config/nix
          echo "experimental-features = nix-command flakes" > ~/.config/nix/nix.conf
      - name: Copy the checkout into the Linux filesystem
        run: |
          set -euo pipefail
          git config --global --add safe.directory '*'
          git clone -q --no-hardlinks . ~/nonos
      - name: make build
        run: |
          set -euo pipefail
          . ~/.nix-profile/etc/profile.d/nix.sh
          cd ~/nonos && make doctor && make build
      - name: Disk space before make check
        shell: pwsh
        run: Get-PSDrive C,D -ErrorAction SilentlyContinue | Format-Table Name,Used,Free
      - name: make check
        run: |
          set -euo pipefail
          . ~/.nix-profile/etc/profile.d/nix.sh
          cd ~/nonos && make check
      - name: Disk space after make check
        if: always()
        shell: pwsh
        run: Get-PSDrive C,D -ErrorAction SilentlyContinue | Format-Table Name,Used,Free

  container:
    name: nix build (devcontainer)
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Build the devcontainer image
        run: docker build -t nonos-dev .devcontainer
      - name: nix build inside it
        run: |
          docker run --rm --privileged -v "$PWD:/workspaces/microkernel" -w /workspaces/microkernel nonos-dev \
            bash -lc 'git config --global --add safe.directory "$PWD" && nix build .#default -L --keep-going --no-link'

  verify:
    name: nonos-verify build
    runs-on: ubuntu-latest
    # Provisioning enrolls 115 capsules under one STARK policy root, about
    # 1.85 minutes each, 2 at a time (run 37846808267), before the build.
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/nix-setup
        with:
          cache: ${{ vars.NONOS_CACHIX }}
      - name: Provision CI trust material
        env:
          NONOS_CI_TRUST_MODE: ${{ inputs.trust-mode }}
          SIGNING_KEY_BASE64: ${{ secrets.SIGNING_KEY_BASE64 }}
        run: |
          set -euo pipefail
          case "${NONOS_CI_TRUST_MODE}" in
            scratch)
              bash nonos-ci/setup-signing-key.sh
              nix develop --command bash nonos-ci/scratch-trust-bootstrap.sh
              ;;
            production)
              bash nonos-ci/setup-signing-key.sh
              make nonos-mk-check-trust-manifest
              echo "NONOS_TRUST_REUSE=1" >> "$GITHUB_ENV"
              # The committed trust set signs the flake's capsules (the seal
              # enrolls what nix builds), so the make lane checks it against
              # those bytes, not against a cargo build of its own whose paths
              # differ (nonos-mk/capsule.mk, NONOS_CAPSULE_BINS).
              echo "NONOS_CAPSULE_BINS=$(nix build .#capsules --no-link --print-out-paths)" >> "$GITHUB_ENV"
              ;;
            *)
              echo "::error::unknown trust-mode '${NONOS_CI_TRUST_MODE}'"
              exit 1
              ;;
          esac
      - name: nonos-verify build
        run: nix develop --command cargo run --release --manifest-path nonos-verify/Cargo.toml -- build
      - name: Upload build reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ inputs.trust-mode == 'production' && 'ci-reports-build-production' || 'ci-reports-build' }}
          path: ci-reports/
          retention-days: 14
          if-no-files-found: error
