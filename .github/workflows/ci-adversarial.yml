name: ci-adversarial

# Reusable adversarial proof. `nonos-verify adversarial` takes a genuinely valid
# signed capsule, tampers it the way an attacker would (cert/manifest/policy
# bit-flips, expired and premature windows, truncation, cross-binding), and
# asserts nonos_capsule_sign rejects every one. A tampered artifact that
# verifies is a real vulnerability and fails this job.

on:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-adversarial-${{ github.ref }}
  cancel-in-progress: false

jobs:
  adversarial:
    name: adversarial
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4  # TODO: pin to commit SHA
        with:
          submodules: recursive
      - uses: ./.github/actions/nonos-setup
        with:
          module: adversarial
      - name: nonos-verify adversarial
        run: cargo run --release --manifest-path nonos-verify/Cargo.toml -- adversarial
      - name: Upload adversarial artifacts
        if: always()
        uses: actions/upload-artifact@v4  # TODO: pin to commit SHA
        with:
          name: ci-reports-adversarial
          path: ci-reports/
          retention-days: 14
