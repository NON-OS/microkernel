# Guards the enrollment input: the complete verified capsule set from `nix build .#capsules`, published with a BLAKE3 manifest; it signs nothing and holds nothing.
# Runs by hand; the set is downloaded, verified and enrolled where the keys live (tools/nonos-enroll --from, or nix run .#seal).
name: build-for-enrollment

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-for-enrollment-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: capsule set
    runs-on: ubuntu-latest
    timeout-minutes: 240
    defaults:
      run:
        shell: nix develop --command bash --noprofile --norc -eo pipefail {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/nix-setup
        with:
          cache: ${{ vars.NONOS_CACHIX }}
      - name: Build the verified capsule set
        run: nix build .#capsules -L --keep-going
      - name: Package with a measurement manifest
        run: bash nonos-ci/enrollment-set.sh enrollment-build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: enrollment-build
          path: enrollment-build/
          retention-days: 30
          if-no-files-found: error
