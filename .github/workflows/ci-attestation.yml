name: ci-attestation

# Reusable aggregator. Downloads every module's report, then `nonos-verify
# attest` fuses them into one ci-attestation.json + a GitHub job summary and
# fails if any blocking module failed. This is the single reviewable proof for
# the commit.

on:
  workflow_call:
    inputs:
      required-modules:
        description: "CSV list of module reports that must be present"
        required: false
        type: string
        default: "build,supply-chain,trust-chain,adversarial,evidence"

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ci-attestation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  attestation:
    name: attestation
    runs-on: ubuntu-latest
    defaults:
      run:
        # every step after the setup runs in `nix develop`, the shell a
        # developer gets, so CI and a contributor run the same tools
        shell: nix develop --command bash --noprofile --norc -eo pipefail {0}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: ./.github/actions/nix-setup
        with:
          cache: ${{ vars.NONOS_CACHIX }}
      - name: Download all module reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: ci-reports-*
          merge-multiple: true
          path: ci-reports
      - name: nonos-verify attest
        env:
          NONOS_VERIFY_REQUIRED_MODULES: ${{ inputs.required-modules }}
        run: cargo run --release --manifest-path nonos-verify/Cargo.toml -- attest
      - name: Upload attestation
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ci-attestation
          path: ci-reports/attest/
          retention-days: 30
          if-no-files-found: error
