name: ci-attestation

# Reusable aggregator. Downloads every module's report, then `nonos-verify
# attest` fuses them into one ci-attestation.json + a GitHub job summary and
# fails if any blocking module failed. This is the single reviewable proof for
# the commit.

on:
  workflow_call:
    inputs:
      required-modules:
        description: "CSV list of module reports that must be present"
        required: false
        type: string
        default: "build,supply-chain,trust-chain,adversarial,evidence"

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ci-attestation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  attestation:
    name: attestation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: ./.github/actions/nonos-setup
        with:
          module: attest
      - name: Download all module reports
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: ci-reports-*
          merge-multiple: true
          path: ci-reports
      - name: nonos-verify attest
        env:
          NONOS_VERIFY_REQUIRED_MODULES: ${{ inputs.required-modules }}
        run: cargo run --release --manifest-path nonos-verify/Cargo.toml -- attest
      - name: Upload attestation
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ci-attestation
          path: ci-reports/attest/
          retention-days: 30
          if-no-files-found: error
