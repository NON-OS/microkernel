# Guards the run as a whole: nonos-verify attest fuses every module's report into one ci-attestation.json and fails if a required module failed or is missing.
# Runs when called by pr, main, nightly and release, after the modules it fuses.
name: ci-attestation

on:
  workflow_call:
    inputs:
      required-modules:
        description: "Comma-separated module reports that must be present"
        required: false
        type: string
        default: "build,supply-chain,trust-chain,adversarial,evidence"

permissions:
  contents: read

jobs:
  attestation:
    name: attestation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: ./.github/actions/nix-setup
        with:
          cache: ${{ vars.NONOS_CACHIX }}
      - name: Download every module's reports
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ci-reports-*
          merge-multiple: true
          path: ci-reports
      - uses: ./.github/actions/nonos-verify
        env:
          NONOS_VERIFY_REQUIRED_MODULES: ${{ inputs.required-modules }}
        with:
          module: attest
          report-name: ci-attestation
          report-path: ci-reports/attest/
          retention-days: "30"
