# Guards the kernel at run time in QEMU: nonos-verify runtime boots ramfs, keyring and desktop-gui, holds each readiness marker, and runs the subsystem round-trips.
# Runs when called by nightly and release, with scratch keys made on the runner.
name: ci-runtime

on:
  workflow_call:
    secrets:
      SIGNING_KEY_BASE64:
        required: false
      CACHIX_AUTH_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  runtime:
    name: runtime
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: ./.github/actions/nix-setup
        with:
          cache: ${{ vars.NONOS_CACHIX }}
          cachix-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Provision scratch trust material
        env:
          SIGNING_KEY_BASE64: ${{ secrets.SIGNING_KEY_BASE64 }}
        run: nix develop --command bash nonos-ci/provision-trust.sh scratch
      - uses: ./.github/actions/nonos-verify
        with:
          module: runtime
