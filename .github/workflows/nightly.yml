# Guards main overnight: the module set from source with the QEMU runtime job, the benchmark with three boots, half an hour of fuzzing per target and the boot matrix.
# Runs daily at 02:00 UTC, or by hand; its benchmark and fuzz records go to the bench-results branch.
name: nightly

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/ci-build.yml
    secrets: inherit
    with:
      from-source: true

  trust-chain:
    uses: ./.github/workflows/ci-trust-chain.yml
    secrets: inherit

  adversarial:
    uses: ./.github/workflows/ci-adversarial.yml
    secrets: inherit

  supply-chain:
    uses: ./.github/workflows/ci-supply-chain.yml
    secrets: inherit

  evidence:
    uses: ./.github/workflows/ci-evidence.yml
    secrets: inherit

  runtime:
    needs: build
    uses: ./.github/workflows/ci-runtime.yml
    secrets: inherit

  reproducible:
    uses: ./.github/workflows/ci-reproducible.yml

  attestation:
    needs: [build, trust-chain, adversarial, supply-chain, evidence, runtime, reproducible]
    if: always()
    uses: ./.github/workflows/ci-attestation.yml
    with:
      required-modules: build,trust-chain,adversarial,supply-chain,evidence,runtime,reproducible

  benchmark:
    uses: ./.github/workflows/ci-benchmark.yml
    secrets: inherit
    with:
      boot-runs: "3"

  fuzz:
    uses: ./.github/workflows/ci-fuzz.yml
    with:
      minutes: 30
      save-corpus: true

  boot-matrix:
    uses: ./.github/workflows/ci-boot-matrix.yml
    secrets: inherit

  publish-results:
    needs: [benchmark, fuzz]
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/ci-publish-results.yml
    permissions:
      contents: write

  summary:
    name: summary
    needs: [build, trust-chain, adversarial, supply-chain, evidence, runtime, reproducible, attestation, benchmark, fuzz, boot-matrix]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: One verdict for the night
        env:
          NEEDS: ${{ toJSON(needs) }}
          REPORT_ONLY: '["boot-matrix"]'
        run: python3 nonos-ci/ci_summary.py nightly
