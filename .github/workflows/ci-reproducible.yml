# Guards reproducibility: Linux x86_64 and macOS build the artifacts from source with no shared cache, and `nonos-verify reproducible` fails unless both name the same bytes.
# Runs when called by pr, main, nightly and release, or by hand.
name: ci-reproducible

# The boundary is the compiled artifacts (kernel, capsules, Linux userland,
# loader). Enrollment and signing draw fresh randomness and need keys no CI
# holds, so the sealed image is never compared, by design (tools/nix/README.md).

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64, runner: ubuntu-latest }
          - { name: macos-aarch64, runner: macos-latest }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 200
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/nix-setup
        with:
          use-cache: "false"
      - name: nix build, from source
        run: nix build .#default -L --keep-going
      - name: Collect the build manifest
        run: |
          mkdir -p manifests
          cp result/nonos-build.json "manifests/${{ matrix.name }}.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: repro-${{ matrix.name }}
          path: manifests/
          retention-days: 14
          if-no-files-found: error

  compare:
    name: compare
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/nix-setup
        with:
          cache: ${{ vars.NONOS_CACHIX }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: repro-*
          path: manifests
          merge-multiple: true
      - name: Name the manifests to compare
        run: echo "NONOS_REPRO_MANIFESTS=$(find manifests -name '*.json' | LC_ALL=C sort | tr '\n' ' ')" >> "$GITHUB_ENV"
      - uses: ./.github/actions/nonos-verify
        with:
          module: reproducible
