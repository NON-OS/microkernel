name: ci-reproducible

# The reproducibility proof. Three machines (Linux x86_64, Linux aarch64,
# macOS on Apple silicon) each build the artifacts from the same commit with
# nothing shared: no binary cache, so none can take another's output. Each
# hands over the nonos-build.json it wrote, every artifact by sha256, and
# `nonos-verify reproducible` fails unless all three name the same bytes.
#
# The boundary is the compiled artifacts: the kernel, every capsule, the Linux
# userland and the bootloader. Enrollment and signing come after them, draw
# fresh randomness and need keys no CI holds, so the sealed image is never
# compared, by design (tools/nix/README.md).

on:
  workflow_call:
    inputs:
      trust-mode:
        description: "kept for the callers; the reproducible build needs no trust material"
        required: false
        type: string
        default: "scratch"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ci-reproducible-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64, runner: ubuntu-latest }
          - { name: macos-aarch64, runner: macos-latest }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/nix-setup
        with:
          use-cache: "false"
      - name: nix build, from source
        run: nix build .#default -L --keep-going
      - name: The build manifest
        run: |
          mkdir -p manifests
          cp result/nonos-build.json "manifests/${{ matrix.name }}.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: repro-${{ matrix.name }}
          path: manifests/
          retention-days: 14
          if-no-files-found: error

  compare:
    name: compare
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/nix-setup
        with:
          cache: ${{ vars.NONOS_CACHIX }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: repro-*
          path: manifests
          merge-multiple: true
      - name: nonos-verify reproducible
        run: |
          NONOS_REPRO_MANIFESTS="$(ls manifests/*.json | tr '\n' ' ')" \
            nix develop --command cargo run --release --manifest-path nonos-verify/Cargo.toml -- reproducible
      - name: Upload reproducibility report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ci-reports-reproducible
          path: ci-reports/
          retention-days: 14
          if-no-files-found: error
