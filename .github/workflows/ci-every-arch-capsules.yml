# Guards every capsule on every port: each one make knows, built for aarch64 and riscv64 through make's own rule with its ELF machine checked, and every excused capsule still failing.
# Runs when called by pr and main; nonos-ci/arch-reach/capsules.txt names each excuse and why.
name: ci-every-arch-capsules

on:
  workflow_call:
    secrets:
      CACHIX_AUTH_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  capsules:
    name: capsules (${{ matrix.target }}, ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: nix develop --command bash --noprofile --norc -eo pipefail {0}
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-nonos-user, riscv64-nonos-user]
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: ./.github/actions/nix-setup
        with:
          cache: ${{ vars.NONOS_CACHIX }}
          cachix-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Build this shard's capsules
        run: bash nonos-ci/build-every-capsule.sh ${{ matrix.target }} ${{ matrix.shard }}/4
      # Runs even when the shard's build failed: a stale excuse is its own finding.
      - name: The excused capsules still do not build
        if: ${{ !cancelled() && matrix.shard == 1 }}
        run: bash nonos-ci/build-every-capsule.sh ${{ matrix.target }} 1/1 --recheck
