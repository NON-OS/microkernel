# Guards main and develop with the full gate (ci.yml), fills the binary cache, and keeps the benchmark and fuzz records of main on the bench-results branch.
# Runs on each push to main or develop, or by hand; a newer push cancels the run it supersedes.
name: main

on:
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: main-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      pull-requests: read
    secrets: inherit
    with:
      save-corpus: true

  publish-results:
    needs: ci
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
    uses: ./.github/workflows/ci-publish-results.yml
    permissions:
      contents: write
