# Guards the trust path pin: when STARKs main moves, the starks input and every Cargo.lock follow it, nix flake check runs, and a pull request is opened; it never merges.
# Runs daily at 05:17 UTC, or by hand. A pull request opened with the workflow's token starts no workflow; pushing to it or re-running starts pr.yml.
name: starks-bump

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: starks-bump
  cancel-in-progress: false

jobs:
  bump:
    name: bump
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: write
      pull-requests: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/nix-setup
        with:
          cache: ${{ vars.NONOS_CACHIX }}
      - name: Move the starks input to STARKs main
        id: move
        run: bash nonos-ci/starks-bump.sh move
      - name: Write the commit into every lock, then nix flake check
        id: check
        if: steps.move.outputs.moved == 'true'
        run: bash nonos-ci/starks-bump.sh check
      - name: Open the pull request
        if: steps.move.outputs.moved == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          OLD: ${{ steps.move.outputs.old }}
          NEW: ${{ steps.move.outputs.new }}
          VERDICT: ${{ steps.check.outputs.verdict }}
        run: bash nonos-ci/starks-bump.sh pr
