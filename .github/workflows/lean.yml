# NONOS Operating System
# Copyright (C) 2026 NONOS Contributors
#
# Verifies the Lean 4 specification proofs. `lake build` reports 0 errors only
# when every theorem checks. elan reads verification/lean/lean-toolchain to pick
# the pinned Lean version, and lake generates its manifest on first build.
#
# A green run also publishes evidence, the same convention as the benchmark
# and evidence workflows: the theorem inventory, the axiom closure of every
# flagship theorem as printed by Lean itself, and the toolchain and commit it
# was checked against. The axiom profile is also a gate: a `sorry` anywhere in
# a profiled theorem's closure would surface as `sorryAx` and fail the run.
name: lean
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: lean-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
      - name: Install elan
        run: |
          set -euo pipefail
          curl -fsSL https://elan.lean-lang.org/elan-init.sh -o elan-init.sh
          bash elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Verify theorems (lake build)
        run: lake build
        working-directory: verification/lean
      - name: Axiom profile and evidence
        working-directory: verification/lean
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/lean-evidence"
          lake env lean AxiomProfile.lean | tee "$GITHUB_WORKSPACE/lean-evidence/axioms.txt"
          if grep -q sorryAx "$GITHUB_WORKSPACE/lean-evidence/axioms.txt"; then
            echo "::error::a flagship theorem depends on sorryAx"
            exit 1
          fi
          grep -rn '^theorem ' Nonos/ > "$GITHUB_WORKSPACE/lean-evidence/theorems.txt"
          {
            echo "commit: $GITHUB_SHA"
            echo "toolchain: $(cat lean-toolchain)"
            echo "theorems: $(grep -rc '^theorem ' Nonos/ --include='*.lean' -h | paste -sd+ - | bc)"
            echo "escape hatches:"
            grep -rEn '\bsorry\b|\badmit\b|^axiom ' Nonos.lean Nonos/ \
              | grep -v 'no sorry anywhere' || echo "  none"
          } > "$GITHUB_WORKSPACE/lean-evidence/summary.txt"
          cat "$GITHUB_WORKSPACE/lean-evidence/summary.txt"
      - name: Proof inventory and manifest
        working-directory: verification/lean
        run: |
          set -euo pipefail
          EV="$GITHUB_WORKSPACE/lean-evidence"
          thms=$({ grep -rh '^theorem ' Nonos --include='*.lean' || true; } | wc -l | tr -d ' ')
          lemmas=$({ grep -rh '^lemma ' Nonos --include='*.lean' || true; } | wc -l | tr -d ' ')
          mods=$(find Nonos -name '*.lean' | wc -l | tr -d ' ')
          loc=$(find Nonos -name '*.lean' -exec cat {} + | wc -l | tr -d ' ')
          hatches=$(grep -rEn '\bsorry\b|\badmit\b|^axiom ' Nonos --include='*.lean' \
            | grep -vc 'no sorry anywhere' || true)
          {
            echo "# NONOS Lean proof inventory"
            echo
            echo "commit \`$GITHUB_SHA\`, toolchain \`$(cat lean-toolchain)\`"
            echo
            echo "$thms theorems, $lemmas lemmas across $mods modules, $loc lines of proof, $hatches escape hatches."
            echo
            for f in $(find Nonos -name '*.lean' | sort); do
              n=$(grep -c -e '^theorem ' -e '^lemma ' "$f" || true)
              echo "## $f ($n)"
              grep -hoE '^(theorem|lemma) [^ :({]+' "$f" | sed 's/^/  - /' || true
              echo
            done
          } > "$EV/inventory.md"
          jq -n \
            --arg commit "$GITHUB_SHA" \
            --arg toolchain "$(cat lean-toolchain)" \
            --argjson theorems "$thms" \
            --argjson lemmas "$lemmas" \
            --argjson modules "$mods" \
            --argjson proof_loc "$loc" \
            --argjson escape_hatches "${hatches:-0}" \
            '{commit:$commit, toolchain:$toolchain, theorems:$theorems, lemmas:$lemmas, modules:$modules, proof_loc:$proof_loc, escape_hatches:$escape_hatches}' \
            > "$EV/manifest.json"
          cat "$EV/manifest.json"
      - name: Upload lean evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lean-proofs-${{ github.run_id }}-${{ github.run_attempt }}
          path: lean-evidence/
          retention-days: 30
          if-no-files-found: error
