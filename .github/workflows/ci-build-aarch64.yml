# Guards the aarch64 and riscv64 ports at compile time: the aarch64 kernel as a loadable ELF, every driver capsule for aarch64, and the riscv64 kernel booted as far as its port goes.
# Runs when called by pr and main; ci-boot-aarch64 boots the aarch64 image.
name: ci-build-aarch64

on:
  workflow_call:
    secrets:
      CACHIX_AUTH_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  build-aarch64:
    name: build-aarch64
    runs-on: ubuntu-latest
    timeout-minutes: 75
    defaults:
      run:
        shell: nix develop --command bash --noprofile --norc -eo pipefail {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: ./.github/actions/nix-setup
        with:
          cache: ${{ vars.NONOS_CACHIX }}
          cachix-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Provision a scratch signing key
        run: bash nonos-ci/setup-signing-key.sh
      - name: Build the aarch64 kernel (microkernel-core + nonos-arch-preview)
        run: make nonos-mk-arm SIGNING_KEY=.keys/signing_key_v1.bin
      - name: Check the image is a loadable AArch64 kernel
        run: python3 scripts/check_kernel_elf.py --arch aarch64 --elf target/aarch64-nonos/release/nonos-kernel
      - name: Build every driver capsule for aarch64-nonos-user
        run: bash nonos-ci/build-driver-capsules.sh aarch64-nonos-user
      - name: Build the riscv64 kernel and boot it as far as its port goes
        run: make nonos-mk-riscv-boot-check SIGNING_KEY=.keys/signing_key_v1.bin
