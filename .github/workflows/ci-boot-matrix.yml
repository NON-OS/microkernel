# Guards boot compatibility: every machine cell of scripts/bootmatrix/cells.py for the single-CPU and SMP images, several boots each; the SMP cells are known red, so it reports and does not gate.
# Runs when called by nightly, or by hand for chosen cells; refuses to run without KVM rather than pass a thinner matrix.
name: ci-boot-matrix

on:
  workflow_call:
    secrets:
      SIGNING_KEY_BASE64:
        required: false
      CACHIX_AUTH_TOKEN:
        required: false
  workflow_dispatch:
    inputs:
      repeat:
        description: "Boots per cell"
        required: false
        default: "1"
      timeout:
        description: "Seconds a single boot may take before the cell is called timed out"
        required: false
        default: "300"
      cells:
        description: "Cells to boot, space separated, or all"
        required: false
        default: "q35-up"

permissions:
  contents: read

jobs:
  boot-matrix:
    name: boot-matrix
    runs-on: ubuntu-latest
    timeout-minutes: 240
    defaults:
      run:
        shell: nix develop --command bash --noprofile --norc -eo pipefail {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: ./.github/actions/nix-setup
        with:
          cache: ${{ vars.NONOS_CACHIX }}
          cachix-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Host CPU and hardware virtualisation
        run: bash nonos-ci/enable-kvm.sh --require
      # The flake's capsules from the binary cache, signed with scratch keys:
      # a cargo build of each in turn used most of the job's time.
      - name: Provision scratch trust material
        env:
          SIGNING_KEY_BASE64: ${{ secrets.SIGNING_KEY_BASE64 }}
        run: bash nonos-ci/provision-trust.sh scratch
      - name: Boot the matrix
        env:
          BOOT_MATRIX_REPEAT: ${{ inputs.repeat || '5' }}
          BOOT_MATRIX_CELLS: ${{ inputs.cells || 'all' }}
          BOOT_MATRIX_TIMEOUT: ${{ inputs.timeout || '300' }}
        run: |
          case "${BOOT_MATRIX_TIMEOUT}${BOOT_MATRIX_REPEAT}" in
            ''|*[!0-9]*) echo "::error::timeout and repeat must be digits only"; exit 1 ;;
          esac
          if [ "${BOOT_MATRIX_CELLS}" = all ]; then BOOT_MATRIX_CELLS=""; fi
          make QEMU_NET_MODE=off BOOT_MATRIX_REPEAT="${BOOT_MATRIX_REPEAT}" \
            BOOT_MATRIX_TIMEOUT="${BOOT_MATRIX_TIMEOUT}" \
            BOOT_MATRIX_CELLS="${BOOT_MATRIX_CELLS}" nonos-mk-boot-matrix
      - name: Keep the serial logs and the verdict
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: boot-matrix
          path: |
            target/boot-matrix/*.log
            target/boot-matrix/*.qemu-stderr
            target/boot-matrix/boot-matrix.json
          retention-days: 30
          if-no-files-found: error
