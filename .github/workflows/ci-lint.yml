# Guards the pipelines themselves: YAML, actionlint (with shellcheck over inline scripts), shellcheck over nonos-ci/, SHA-pinned actions and the fuzz target list.
# Runs when called by pr and main on any change under .github/, nonos-ci/ or fuzz/.
name: ci-lint

on:
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    name: lint pipelines
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/nix-setup
        with:
          cache: ${{ vars.NONOS_CACHIX }}
      - name: actionlint, shellcheck and the pins
        run: nix shell --inputs-from . nixpkgs#actionlint nixpkgs#shellcheck nixpkgs#yq-go --command bash nonos-ci/lint-ci.sh
