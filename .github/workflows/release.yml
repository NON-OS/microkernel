# Guards a release: every blocking job in production mode, the release bundle and one attestation, then a pre-release with signed build provenance; a tag that fails any gate publishes nothing.
# Runs on a v* tag, or when cut-release dispatches it; never cancelled. The sealed image is uploaded to the same release from the machine with the keys.
name: release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/ci-build.yml
    secrets: inherit
    with:
      trust-mode: production
      from-source: true

  trust-chain:
    uses: ./.github/workflows/ci-trust-chain.yml
    secrets: inherit

  adversarial:
    uses: ./.github/workflows/ci-adversarial.yml
    secrets: inherit

  supply-chain:
    uses: ./.github/workflows/ci-supply-chain.yml
    secrets: inherit

  evidence:
    uses: ./.github/workflows/ci-evidence.yml
    secrets: inherit

  reproducible:
    uses: ./.github/workflows/ci-reproducible.yml

  # Scratch keys: the boot it proves is a kernel this runner builds and signs.
  # The committed trust set is held to the sealed bytes by build and reproducible.
  runtime:
    needs: build
    uses: ./.github/workflows/ci-runtime.yml
    secrets: inherit

  release-artifacts:
    needs: [build, trust-chain, adversarial, supply-chain, evidence]
    uses: ./.github/workflows/ci-release-artifacts.yml
    secrets: inherit

  attestation:
    needs: [build, trust-chain, adversarial, supply-chain, evidence, reproducible, runtime, release-artifacts]
    if: always()
    uses: ./.github/workflows/ci-attestation.yml
    with:
      required-modules: build,trust-chain,adversarial,supply-chain,evidence,reproducible,runtime,release

  # The release's benchmark is recorded, not gated: publish does not wait on it.
  benchmark:
    uses: ./.github/workflows/ci-benchmark.yml
    secrets: inherit
    with:
      boot-runs: "3"
      strict: false

  publish-results:
    needs: benchmark
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/ci-publish-results.yml
    permissions:
      contents: write

  # The only irreversible step, so it runs last and only when every job passed.
  publish:
    name: publish
    needs: [build, trust-chain, adversarial, supply-chain, evidence, reproducible, runtime, release-artifacts, attestation]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write
    defaults:
      run:
        shell: bash
    steps:
      # The release body is read from the tree.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nonos-image
          path: release
      - name: Check the image arrived intact
        working-directory: release
        run: |
          sha256sum -c SHA256SUMS
          ls -l
      # A signed SLSA statement binding every asset to this commit and run;
      # `gh attestation verify <file> --repo NON-OS/microkernel` checks it.
      - name: Sign build provenance for the release assets
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/*
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: release/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          prerelease: true
          body_path: .github/RELEASE_NOTES.md

  summary:
    name: summary
    needs: [build, trust-chain, adversarial, supply-chain, evidence, reproducible, runtime, release-artifacts, attestation, benchmark, publish]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: One verdict for the release
        env:
          NEEDS: ${{ toJSON(needs) }}
          REPORT_ONLY: '["benchmark"]'
        run: python3 nonos-ci/ci_summary.py release
