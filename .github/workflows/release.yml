name: release

# Release-candidate pipeline. Runs the blocking build, trust-chain,
# supply-chain, evidence, runtime, reproducibility, and release-artifact lanes
# before fusing one attestation for the tag.

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/ci-build.yml
    with:
      trust-mode: production
    secrets: inherit

  trust-chain:
    uses: ./.github/workflows/ci-trust-chain.yml

  adversarial:
    uses: ./.github/workflows/ci-adversarial.yml

  supply-chain:
    uses: ./.github/workflows/ci-supply-chain.yml

  evidence:
    uses: ./.github/workflows/ci-evidence.yml

  reproducible:
    uses: ./.github/workflows/ci-reproducible.yml
    with:
      trust-mode: production
    secrets: inherit

  runtime:
    needs: build
    uses: ./.github/workflows/ci-runtime.yml
    with:
      trust-mode: production
    secrets: inherit

  release-artifacts:
    needs: [build, trust-chain, adversarial, supply-chain, evidence]
    uses: ./.github/workflows/ci-release-artifacts.yml
    secrets: inherit

  attestation:
    needs: [build, trust-chain, adversarial, supply-chain, evidence, reproducible, runtime, release-artifacts]
    if: always()
    uses: ./.github/workflows/ci-attestation.yml
    with:
      required-modules: build,trust-chain,adversarial,supply-chain,evidence,reproducible,runtime,release

  # Publishing is the only irreversible step, so it runs last and only when
  # every lane above has passed. A tag that fails any gate produces no release,
  # which is the whole point of gating it.
  publish:
    name: publish
    needs: [build, trust-chain, adversarial, supply-chain, evidence, reproducible, runtime, release-artifacts, attestation]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: nonos-image
          path: release

      - name: Check the image arrived intact
        run: |
          set -euo pipefail
          cd release
          sha256sum -c SHA256SUMS
          ls -l

      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228
        with:
          files: release/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          body: |
            Signed, STARK-attested ZeroState image.

            The kernel carries its own attestation trailer, every capsule is
            enrolled under the policy root published beside it, and the trust
            chain was verified on this artifact before it was uploaded. A tag
            that fails any gate publishes nothing.

            Check what you downloaded against `SHA256SUMS`, and check the
            policy roots here against the ones your running image reports.
