name: release

# Release-candidate pipeline. Runs the blocking build, trust-chain,
# supply-chain, evidence, runtime, reproducibility, and release-artifact lanes
# before fusing one attestation for the tag, then publishes the unsigned,
# reproducible bundle with signed build provenance. The sealed image is ek's:
# `nix run .#seal -- --release` on the machine with the keys, then
# `gh release upload <tag> target/release/<profile>/nonos.img ...`.

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/ci-build.yml
    secrets: inherit
    with:
      trust-mode: production

  trust-chain:
    uses: ./.github/workflows/ci-trust-chain.yml
    secrets: inherit

  adversarial:
    uses: ./.github/workflows/ci-adversarial.yml
    secrets: inherit

  supply-chain:
    uses: ./.github/workflows/ci-supply-chain.yml
    secrets: inherit

  evidence:
    uses: ./.github/workflows/ci-evidence.yml
    secrets: inherit

  reproducible:
    uses: ./.github/workflows/ci-reproducible.yml
    secrets: inherit
    with:
      trust-mode: production

  runtime:
    needs: build
    uses: ./.github/workflows/ci-runtime.yml
    secrets: inherit
    with:
      trust-mode: production

  release-artifacts:
    needs: [build, trust-chain, adversarial, supply-chain, evidence]
    uses: ./.github/workflows/ci-release-artifacts.yml
    secrets: inherit

  attestation:
    needs: [build, trust-chain, adversarial, supply-chain, evidence, reproducible, runtime, release-artifacts]
    if: always()
    uses: ./.github/workflows/ci-attestation.yml
    secrets: inherit
    with:
      required-modules: build,trust-chain,adversarial,supply-chain,evidence,reproducible,runtime,release

  # Publishing is the only irreversible step, so it runs last and only when
  # every lane above has passed. A tag that fails any gate produces no release,
  # which is the whole point of gating it.
  publish:
    name: publish
    needs: [build, trust-chain, adversarial, supply-chain, evidence, reproducible, runtime, release-artifacts, attestation]
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release
      id-token: write # sign the build provenance
      attestations: write # record the build provenance
    steps:
      # The release body reads from the tree; without a checkout the job has
      # only the downloaded artifact and body_path dies on ENOENT.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          sparse-checkout: .github
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: nonos-image
          path: release

      - name: Check the image arrived intact
        run: |
          set -euo pipefail
          cd release
          sha256sum -c SHA256SUMS
          ls -l

      # A signed SLSA statement binding every asset to this commit and run;
      # `gh attestation verify <file> --repo NON-OS/nonos-unified` checks it
      # with no key from us.
      - name: Sign build provenance for the release assets
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/*

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64
        with:
          files: release/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          prerelease: true
          body_path: .github/RELEASE_NOTES.md
