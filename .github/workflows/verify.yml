# NONOS Operating System
# Copyright (C) 2026 NONOS Contributors
#
# Verification. `nix flake check` holds every proof crate and static check;
# the model checkers and theorem provers that pin their own toolchains (Kani,
# Verus, Lean, the Charon/Aeneas extraction) keep their jobs here.
name: verify

on:
  # A pull-request branch is covered by the pull_request event alone. Firing on
  # push as well ran every job twice per commit and the concurrency group
  # cancelled one copy, so a green pull request read as dozens of cancelled
  # checks. Push covers the branches that have no pull request.
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

# Cancel superseded runs on the same ref so a fast push does not pile up
# redundant verification passes.
concurrency:
  group: verify-${{ github.head_ref || github.ref_name }}
  # A pull request's older run is moot; a run on main finishes, so every
  # commit there gets a verdict (the newest queued push runs next).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Every proof crate, the static checks, the ABI contracts, the evidence
  # manifest, the attestation attacks and the dark-feature kernel checks:
  # `nix flake check`, as a contributor runs it, on Linux and on macOS. The
  # live TPM suites run against swtpm and fail if a live test was skipped.
  flake-check:
    name: nix flake check (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64, runner: ubuntu-latest }
          - { name: macos-aarch64, runner: macos-latest }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/nix-setup
        with:
          cache: ${{ vars.NONOS_CACHIX }}
          # Written only by pushes to this repository, never by a pull request's
          # code, so no PR can put a store path into the cache others read.
          cachix-token: ${{ github.event_name == 'push' && secrets.CACHIX_AUTH_TOKEN || '' }}
      - name: nix flake check
        run: nix flake check -L --keep-going

  kani:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
        with:
          submodules: recursive
      - uses: model-checking/kani-github-action@2534b7aeb3c6b4b0a5ecc3981bb3e63d47b5b126 # v1
        with:
          kani-version: "0.67.0"
          working-directory: userland/fs_proofs

  verus:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
        with:
          submodules: recursive
      - name: Install Verus
        run: |
          set -euo pipefail
          VERUS_VERSION="0.2026.06.28.1847ab3"
          rustup toolchain install 1.96.0-x86_64-unknown-linux-gnu
          curl --retry 5 --retry-all-errors -fsSL -o verus.zip \
            "https://github.com/verus-lang/verus/releases/download/release/${VERUS_VERSION}/verus-${VERUS_VERSION}-x86-linux.zip"
          unzip -q verus.zip -d "$HOME/verus"
          echo "$HOME/verus/verus-x86-linux" >> "$GITHUB_PATH"
      - name: Verify capability theorems
        run: verus --crate-type=lib src/lib.rs
        working-directory: verification/verus

  proof-crates-kani:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
      - name: Install Kani
        run: |
          cargo install --locked kani-verifier --version 0.67.0
          cargo kani setup
      - name: Kani model checks
        run: |
          set -euo pipefail
          for crate in kernel_proofs net_proofs driver_proofs usb_proofs nvme_proofs \
              usb_msc_proofs virtio_blk_proofs virtio_net_proofs e1000_proofs \
              rtl8139_proofs xhci_proofs sync_proofs mechanism_proofs wallet_proofs \
              arch_paging_proofs; do
            if [ -d "userland/$crate" ]; then
              ( cd "userland/$crate" && cargo kani --output-format terse )
            else
              echo "userland/$crate absent on this ref; skipping"
            fi
          done
          # The trailer parser every gate shares: parse_v4 and the v3 path.
          ( cd nonos-attest-path && cargo kani --output-format terse )
          # The loader's rollback floor read and its rule.
          ( cd nonos-bootloader/boot_proofs && cargo kani --output-format terse )

  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
        with:
          submodules: recursive
      - name: Install elan
        run: |
          curl --retry 5 --retry-all-errors --proto '=https' --tlsv1.2 -sSf https://elan.lean-lang.org/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Specification theorems
        run: |
          if [ -d verification/lean ]; then
            ( cd verification/lean && lake build )
          else
            echo "verification/lean absent on this ref; skipping"
          fi
      - name: Proof-corpus root (no sorry, standard axioms only)
        run: |
          if [ -x verification/lean/proof-corpus-root.sh ]; then
            verification/lean/proof-corpus-root.sh
          else
            echo "proof-corpus-root.sh absent on this ref; skipping"
          fi

  extraction:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
        with:
          submodules: recursive
      - name: Install the extraction toolchain
        run: |
          set -euo pipefail
          if [ ! -d verification/extraction ]; then
            echo "verification/extraction absent on this ref; skipping"
            exit 0
          fi
          rustup toolchain install nightly-2026-06-01 --profile minimal \
            --component rustc-dev,llvm-tools-preview,rust-src
          mkdir -p "$HOME/exttools" && cd "$HOME/exttools"
          curl --retry 5 --retry-all-errors -fsSL -o charon.tar.gz \
            "https://github.com/AeneasVerif/charon/releases/download/nightly-2026.07.02/charon-linux-x86_64.tar.gz"
          tar xzf charon.tar.gz
          curl --retry 5 --retry-all-errors -fsSL -o aeneas.tar.gz \
            "https://github.com/AeneasVerif/aeneas/releases/download/nightly-2026.07.06-45061fa/aeneas-linux-x86_64.tar.gz"
          tar xzf aeneas.tar.gz
          echo "$HOME/exttools" >> "$GITHUB_PATH"
          curl --retry 5 --retry-all-errors --proto '=https' --tlsv1.2 -sSf https://elan.lean-lang.org/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Regenerate every crate and check for drift
        run: |
          set -euo pipefail
          if [ ! -d verification/extraction ]; then exit 0; fi
          python3 tools/extraction/regen.py --repo-root .
      - name: Verify the refinement theorems
        run: |
          set -euo pipefail
          if [ ! -d verification/extraction ]; then exit 0; fi
          cd verification/extraction/lean
          lake exe cache get
          lake build 2>&1 | tee /tmp/extraction-build.log
      - name: Every axiom is stated
        run: |
          set -euo pipefail
          if [ ! -d verification/extraction ]; then exit 0; fi
          python3 tools/ratchets/stated_axioms.py --log /tmp/extraction-build.log --root .
