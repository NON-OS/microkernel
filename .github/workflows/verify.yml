# NONOS Operating System
# Copyright (C) 2026 NONOS Contributors
#
# Verification pipeline for source hygiene, runnable proofs, crypto vectors,
# Kani model checks, and Verus theorems.
name: verify

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

# Cancel superseded runs on the same ref so a fast push does not pile up
# redundant verification passes.
concurrency:
  group: verify-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
      - name: Verification engine clippy
        run: cargo clippy --manifest-path nonos-verify/Cargo.toml --all-targets -- -D warnings
      - name: Production source hygiene
        run: cargo run --manifest-path nonos-verify/Cargo.toml -- hygiene
      - name: No new admissions of unsupported work in shipping code
        run: |
          python3 scripts/check_stubs.py --self-test
          python3 scripts/check_stubs.py
      - name: No new lint switch in the tree
        run: |
          python3 scripts/check_allows.py --self-test
          python3 scripts/check_allows.py
      - name: No new exported function that nothing calls
        run: |
          python3 scripts/check_unreachable.py --self-test
          python3 scripts/check_unreachable.py
      - name: Every driver capsule carries a conformance proof crate
        run: python3 scripts/check_driver_proofs.py
      # A feature no lane enables gates code nothing has compiled since a person
      # last built it by hand. The dark set is held against a baseline that may
      # only shrink.
      - name: Features no build lane enables
        run: |
          python3 scripts/check_dark_features.py --self-test
          python3 scripts/check_dark_features.py

  dark-features-compile:
    # Features no profile enables are still type-checked on every push, so the
    # code behind them cannot rot unseen. Each entry is one cargo check of the
    # kernel with that set on top of microkernel-core; a set that breaks here
    # broke on main, not on the day somebody finally needed it.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        features:
          - mldsa3,mlkem768
          - mldsa2,mlkem512
          - mldsa5,mlkem1024
          - dbg-ring,heap-track
          # Composable with microkernel-core only while core does not also
          # select nonos-production: the two are a trust-posture mutex, held
          # by a compile_error! in src/lib.rs. Do not add production to core.
          - nonos-dev-unverified-capsules
          - crypto-curve25519
          - crypto-ed25519-dalek
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.2.2
        with:
          submodules: recursive
          persist-credentials: false
      - uses: ./.github/actions/nonos-setup
        with:
          targets: x86_64-nonos
          module: dark-features
      - name: Kernel check with ${{ matrix.features }}
        run: |
          cargo check --target x86_64-nonos.json \
            -Zbuild-std=core,alloc -Zbuild-std-features=compiler-builtins-mem \
            --no-default-features --features microkernel-core,${{ matrix.features }}

  abi-contracts:
    # abi/ is what a libc or a foreign toolchain reads to learn how to call
    # this kernel. The checks for it read the tree only and the kernel is
    # authoritative in every one, so they run on every push. Three published
    # syscalls sat unreachable for weeks while nothing ran them.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.2.2
      - name: Published syscall numbers reach a handler
        run: python3 scripts/check_syscall_abi.py
      - name: Published capability bits and groups against the kernel
        run: python3 scripts/check_caps_abi.py
      - name: Capability names the screens print against the kernel bits
        run: python3 scripts/check_userland_caps.py
      - name: Capability bits against the kernel and its mirrors
        run: python3 scripts/check_cap_parity.py
      - name: Service capability constants against the kernel bits
        run: python3 scripts/check_service_caps.py
      - name: Attestation parameters live in one place
        run: python3 scripts/check_attest_params.py

  # The committed verification/evidence/EVIDENCE.json is a machine-readable inventory of
  # everything NONOS proves. Regenerate it from the source tree and fail if it
  # has drifted, so the file in the repo is always an accurate, CI-checked
  # statement of the verification surface.
  evidence-manifest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
        with:
          submodules: recursive
      - name: Regenerate and check for drift
        run: |
          set -euo pipefail
          ./verification/evidence/collect-evidence.sh > /tmp/EVIDENCE.json
          if ! diff -u verification/evidence/EVIDENCE.json /tmp/EVIDENCE.json; then
            echo "::error::verification/evidence/EVIDENCE.json is stale; run ./verification/evidence/collect-evidence.sh > verification/evidence/EVIDENCE.json and commit"
            exit 1
          fi
          jq -e '.proof_systems.lean_specification.sorry_count == 0' /tmp/EVIDENCE.json >/dev/null \
            || { echo "::error::a sorry is present in the Lean corpus"; exit 1; }
      - name: Publish evidence manifest
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: verification-evidence
          path: verification/evidence/EVIDENCE.json
          retention-days: 90
          if-no-files-found: error

  syscall-reach:
    # A syscall the kernel dispatches that no userland code references is a
    # capability written and never wired. Three were dark at once in one day.
    # The count in scripts/baselines may only go down.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.2.2
      - name: Kernel syscalls nothing in userland can reach
        run: python3 scripts/check_syscall_reach.py --baseline scripts/baselines/syscall-unreachable-count.txt

  runnable-proofs:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
      - name: Host proof suite (store, protocol, security, formatting, fuzz)
        run: cargo test --release
        working-directory: userland/fs_proofs
      - name: Host proof clippy
        run: cargo clippy --release -- -D warnings
        working-directory: userland/fs_proofs
      - name: Arch paging descriptor proofs
        run: cargo test --release
        working-directory: userland/arch_paging_proofs
      - name: Arch paging descriptor clippy
        run: cargo clippy --release -- -D warnings
        working-directory: userland/arch_paging_proofs
      - name: Browser engine proofs
        run: cargo test --release
        working-directory: userland/capsule_browser_proofs
      - name: Browser engine clippy
        run: cargo clippy --release -- -D warnings
        working-directory: userland/capsule_browser_proofs
      - name: Script environment proofs
        run: node tests/prelude/run.mjs
        working-directory: userland/nonos_qjs
      - name: Mixnet proxy proofs
        run: cargo test --release
        working-directory: userland/capsule_socks5_proofs
      - name: Mixnet proxy clippy
        run: cargo clippy --release -- -D warnings
        working-directory: userland/capsule_socks5_proofs
      - name: Mixnet route selection proofs
        run: cargo test --release
        working-directory: userland/nym_topology_proofs
      - name: Mixnet route selection clippy
        run: cargo clippy --release -- -D warnings
        working-directory: userland/nym_topology_proofs
      - name: Terminal line editor proofs
        run: cargo test --release
        working-directory: userland/terminal_line_proofs
      - name: Terminal line editor clippy
        run: cargo clippy --release -- -D warnings
        working-directory: userland/terminal_line_proofs
      - name: Attestation document parser proofs
        run: cargo test --release
        working-directory: userland/attest_doc_proofs
      - name: Benchmark summary proofs
        run: cargo test --release
        working-directory: userland/bench_core_proofs
      - name: Benchmark summary clippy
        run: cargo clippy --release -- -D warnings
        working-directory: userland/bench_core_proofs
      - name: Attestation document parser clippy
        run: cargo clippy --release -- -D warnings
        working-directory: userland/attest_doc_proofs

  crypto-proofs:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
      - name: Crypto known-answer proofs
        run: cargo test --release
        working-directory: userland/crypto_proofs
      - name: Crypto proof clippy
        run: cargo clippy --release -- -D warnings
        working-directory: userland/crypto_proofs
      - name: secp256k1 in ring three
        run: cargo test --release
        working-directory: userland/nonos_secp256k1
      - name: ed25519 in ring three
        run: cargo test --release
        working-directory: userland/nonos_ed25519

  kani:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
        with:
          submodules: recursive
      - uses: model-checking/kani-github-action@2534b7aeb3c6b4b0a5ecc3981bb3e63d47b5b126 # v1
        with:
          kani-version: "0.67.0"
          working-directory: userland/fs_proofs

  verus:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
        with:
          submodules: recursive
      - name: Install Verus
        run: |
          set -euo pipefail
          VERUS_VERSION="0.2026.06.28.1847ab3"
          rustup toolchain install 1.96.0-x86_64-unknown-linux-gnu
          curl -fsSL -o verus.zip \
            "https://github.com/verus-lang/verus/releases/download/release/${VERUS_VERSION}/verus-${VERUS_VERSION}-x86-linux.zip"
          unzip -q verus.zip -d "$HOME/verus"
          echo "$HOME/verus/verus-x86-linux" >> "$GITHUB_PATH"
      - name: Verify capability theorems
        run: verus --crate-type=lib src/lib.rs
        working-directory: verification/verus

  boot-proofs:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
      - name: Boot proofs
        run: |
          if [ -d nonos-bootloader/boot_proofs ]; then
            cargo test --release --manifest-path nonos-bootloader/boot_proofs/Cargo.toml
          else
            echo "nonos-bootloader/boot_proofs absent on this ref; skipping"
          fi

  attestation-attack:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
      - name: Kernel self-attestation POC (embed, footer parse, boot verify, attacks)
        run: |
          cargo test --release \
            --manifest-path nonos-bootloader/tools/embed-zk-proof/Cargo.toml \
            --test kernel_self_attest_poc
      - name: Attestation red-team suite (battery and parser fuzz)
        run: bash security/tests/run.sh 50000

  proof-crates:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        crate:
          - kernel_proofs
          - net_proofs
          - driver_proofs
          - usb_proofs
          - nvme_proofs
          - usb_msc_proofs
          - virtio_blk_proofs
          - virtio_net_proofs
          - e1000_proofs
          - rtl8139_proofs
          - iwlwifi_proofs
          - nonos_wifi_core_proofs
          - xhci_proofs
          - stark_proofs
          - sync_proofs
          - mechanism_proofs
          - wallet_proofs
          - bga_proofs
          - hda_proofs
          - i2c_pci_proofs
          - virtio_rng_proofs
          - ps2_input_proofs
          - rtl8169_proofs
          - virtio_gpu_proofs
          - nonos_i2cmodel
          - i2c_transfer_proofs
          - i2c_hid_proofs
          - attest_receipt
          - attest_key_proofs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          components: clippy
      - name: Runnable proofs and clippy
        env:
          RUST_TEST_THREADS: 1
        run: |
          if [ -d "userland/${{ matrix.crate }}" ]; then
            cargo test --release --manifest-path "userland/${{ matrix.crate }}/Cargo.toml"
            cargo clippy --release --all-targets \
              --manifest-path "userland/${{ matrix.crate }}/Cargo.toml" -- -D warnings
          else
            echo "userland/${{ matrix.crate }} absent on this ref; skipping"
          fi

  proof-crates-kani:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
      - name: Install Kani
        run: |
          cargo install --locked kani-verifier --version 0.67.0
          cargo kani setup
      - name: Kani model checks
        run: |
          set -euo pipefail
          for crate in kernel_proofs net_proofs driver_proofs usb_proofs nvme_proofs \
              usb_msc_proofs virtio_blk_proofs virtio_net_proofs e1000_proofs \
              rtl8139_proofs xhci_proofs sync_proofs mechanism_proofs wallet_proofs \
              arch_paging_proofs; do
            if [ -d "userland/$crate" ]; then
              ( cd "userland/$crate" && cargo kani --output-format terse )
            else
              echo "userland/$crate absent on this ref; skipping"
            fi
          done

  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
        with:
          submodules: recursive
      - name: Install elan
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://elan.lean-lang.org/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Specification theorems
        run: |
          if [ -d verification/lean ]; then
            ( cd verification/lean && lake build )
          else
            echo "verification/lean absent on this ref; skipping"
          fi
      - name: Proof-corpus root (no sorry, standard axioms only)
        run: |
          if [ -x verification/lean/proof-corpus-root.sh ]; then
            verification/lean/proof-corpus-root.sh
          else
            echo "proof-corpus-root.sh absent on this ref; skipping"
          fi

  extraction:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
        with:
          submodules: recursive
      - name: Install the extraction toolchain
        run: |
          set -euo pipefail
          if [ ! -d verification/extraction ]; then
            echo "verification/extraction absent on this ref; skipping"
            exit 0
          fi
          rustup toolchain install nightly-2026-06-01 --profile minimal \
            --component rustc-dev,llvm-tools-preview,rust-src
          mkdir -p "$HOME/exttools" && cd "$HOME/exttools"
          curl -fsSL -o charon.tar.gz \
            "https://github.com/AeneasVerif/charon/releases/download/nightly-2026.07.02/charon-linux-x86_64.tar.gz"
          tar xzf charon.tar.gz
          curl -fsSL -o aeneas.tar.gz \
            "https://github.com/AeneasVerif/aeneas/releases/download/nightly-2026.07.06-45061fa/aeneas-linux-x86_64.tar.gz"
          tar xzf aeneas.tar.gz
          echo "$HOME/exttools" >> "$GITHUB_PATH"
          curl --proto '=https' --tlsv1.2 -sSf https://elan.lean-lang.org/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Regenerate and check for drift
        run: |
          set -euo pipefail
          if [ ! -d verification/extraction ]; then exit 0; fi
          cd verification/extraction/caps
          charon cargo --preset=aeneas \
            --start-from 'nonos_caps::capabilities::bits::has_capability' \
            --start-from 'nonos_caps::capabilities::bits::add_capability' \
            --start-from 'nonos_caps::capabilities::bits::remove_capability' \
            --dest-file caps.llbc
          mkdir -p /tmp/regen-caps
          aeneas -backend lean caps.llbc -dest /tmp/regen-caps
          diff -u ../lean/NonosExtraction/Caps.lean /tmp/regen-caps/Caps.lean
          cd ../policy
          charon cargo --preset=aeneas \
            --start-from 'nonos_policy::usercopy::policy::check_range' \
            --start-from 'nonos_policy::to_pte_flags' \
            --start-from 'nonos_policy::is_wx_violation' \
            --dest-file policy.llbc
          mkdir -p /tmp/regen-policy
          aeneas -backend lean -split-files policy.llbc -dest /tmp/regen-policy
          for f in Types.lean Funs.lean FunsExternal_Template.lean; do
            diff -u "../lean/Policy/$f" "/tmp/regen-policy/$f"
          done
          cd ../irq
          charon cargo --preset=aeneas \
            --start-from 'nonos_irq::irq::validate::validate_msix_request' \
            --dest-file irq.llbc
          mkdir -p /tmp/regen-irq
          aeneas -backend lean irq.llbc -dest /tmp/regen-irq
          diff -u ../lean/NonosExtraction/Irq.lean /tmp/regen-irq/Irq.lean
      - name: Verify the refinement theorems
        run: |
          set -euo pipefail
          if [ ! -d verification/extraction ]; then exit 0; fi
          cd verification/extraction/lean
          lake exe cache get
          lake build
