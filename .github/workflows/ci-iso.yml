# NONOS Operating System
# Copyright (C) 2026 NONOS Contributors
#
# Build the production NONOS image: the full ZeroState system, dual-signed
# (Ed25519 + ML-DSA-65), anti-rollback bound into the signature, every capsule
# attested with a transparent post-quantum STARK, and the kernel attesting its
# own STARK measurement to the bootloader before jump. The output is a flashable
# GPT/FAT32 disk image that boots off USB on real hardware and off QEMU.
#
# Privacy is architectural, not a flag: the system is RAM-resident and leaves
# nothing on disk, capsules hold no ambient authority, and no network interface
# is attached unless a run explicitly asks for one.

name: ci-iso

on:
  workflow_dispatch:
    inputs:
      rollback_index:
        description: "Anti-rollback index bound into the kernel signature."
        required: false
        default: "1"
  push:
    tags:
      - "v*"

concurrency:
  group: ci-iso-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  iso:
    name: production image
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      # Both attestation layers on, and the anti-rollback floor.
      NONOS_STARK_KERNEL_ATTEST: "1"
      NONOS_ROLLBACK_INDEX: ${{ github.event.inputs.rollback_index || '1' }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          submodules: recursive

      # Pinned toolchain, the kernel and UEFI targets, and the host tools.
      - uses: ./.github/actions/nonos-setup
        with:
          targets: "x86_64-nonos,x86_64-unknown-uefi"
          module: "iso"

      # Trust material: dev keys and a signed trust bundle for a scratch build,
      # or the release keys from secrets for a production image.
      - name: Provision trust material
        env:
          SIGNING_KEY_BASE64: ${{ secrets.SIGNING_KEY_BASE64 }}
        run: |
          set -euo pipefail
          if [ -n "${SIGNING_KEY_BASE64:-}" ]; then
            mkdir -p nonos-bootloader/keys
            echo "$SIGNING_KEY_BASE64" | base64 -d > nonos-bootloader/keys/signing_key_v1.bin
          fi
          bash nonos-ci/scratch-trust-bootstrap.sh
          make nonos-mk-check-trust-manifest

      # The enrolled ZK device root the bootloader binds (transparent boot path).
      - name: Ensure ZK device root
        run: make nonos-mk-ensure-zk-keys

      # Build the flashable image. This drives, in order: build and sign every
      # capsule, enroll the whole set under one STARK policy root and emit each
      # NZKSTRK1 trailer, build and dual-sign the kernel, enroll the kernel and
      # embed its STARK self-attestation trailer, build the bootloader with the
      # stark-kernel-attest check and the enrolled kernel root, and package the
      # GPT/FAT32 image.
      - name: Build the production ISO
        run: make nonos-mk-usb-img

      # A machine-readable record of what the image attests, next to the image.
      - name: Write attestation manifest
        run: |
          set -euo pipefail
          mkdir -p target/iso
          {
            echo "image: $(ls target/nonos.img)"
            echo "sha256: $(sha256sum target/nonos.img | cut -d' ' -f1)"
            echo "rollback_index: ${NONOS_ROLLBACK_INDEX}"
            echo "kernel_signature: ed25519+mldsa65"
            echo "kernel_self_attestation: stark"
            echo "capsule_attestation: stark"
            echo "capsule_policy_root: $(sha256sum nonos-data/trust/policy/zk_capsule_policy_root.bin 2>/dev/null | cut -d' ' -f1 || echo unavailable)"
            echo "kernel_attest_root: $(sha256sum nonos-data/trust/policy/kernel_attest_root.bin 2>/dev/null | cut -d' ' -f1 || echo unavailable)"
            echo "network: none attached; opt-in only"
            echo "state: RAM-resident, zero-state"
          } > target/iso/attestation-manifest.txt
          cat target/iso/attestation-manifest.txt

      - name: Upload the ISO and manifest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nonos-production-iso
          path: |
            target/nonos.img
            target/iso/attestation-manifest.txt
          if-no-files-found: error
          retention-days: 30
