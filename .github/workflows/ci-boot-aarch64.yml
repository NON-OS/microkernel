# Guards the aarch64 trap paths: each cell builds an image, boots it under QEMU virt (GICv3, -cpu max, TCG) and holds the serial log to that cell's claims (scripts/check_aarch64_boot.py).
# Runs when called by pr and main.
name: ci-boot-aarch64

on:
  workflow_call:
    secrets:
      CACHIX_AUTH_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  boot-aarch64:
    name: boot-aarch64 (${{ matrix.cell }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: nix develop --command bash --noprofile --norc -eo pipefail {0}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { cell: trap-sp0, target: nonos-mk-arm-trap-sp0 }
          - { cell: trap-kernel-abort, target: nonos-mk-arm-trap-kernel-abort }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: ./.github/actions/nix-setup
        with:
          cache: ${{ vars.NONOS_CACHIX }}
          cachix-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Prove the asserter rejects what it must
        run: python3 scripts/check_aarch64_boot.py --self-test
      - name: Provision a scratch signing key
        run: bash nonos-ci/setup-signing-key.sh
      - name: Build the ${{ matrix.cell }} image
        run: make ${{ matrix.target }} SIGNING_KEY=.keys/signing_key_v1.bin
      - name: Check the image is a loadable AArch64 kernel
        run: python3 scripts/check_kernel_elf.py --arch aarch64 --elf target/aarch64-nonos/release/nonos-kernel
      # The log goes under runner.temp, which starts empty in every job, so a
      # log left by an earlier run can never be the one uploaded.
      - name: Boot the ${{ matrix.cell }} cell
        run: |
          mkdir -p "${{ runner.temp }}/boot-aarch64"
          python3 scripts/check_aarch64_boot.py --cell ${{ matrix.cell }} \
            --elf target/aarch64-nonos/release/nonos-kernel \
            --log "${{ runner.temp }}/boot-aarch64/${{ matrix.cell }}.log" --deadline 300
      - name: Keep the serial log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: boot-aarch64-${{ matrix.cell }}
          path: ${{ runner.temp }}/boot-aarch64/${{ matrix.cell }}.log
          retention-days: 14
          if-no-files-found: error
