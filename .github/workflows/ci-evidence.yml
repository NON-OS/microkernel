# Guards the evidence tooling: nonos-verify evidence and the reports it writes.
# Runs when called by pr, main, nightly and release.
name: ci-evidence

on:
  workflow_call:
    secrets:
      CACHIX_AUTH_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  evidence:
    name: evidence tooling
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: ./.github/actions/nix-setup
        with:
          cache: ${{ vars.NONOS_CACHIX }}
          cachix-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - uses: ./.github/actions/nonos-verify
        with:
          module: evidence
