name: ci

# Top-level NONOS verification gate. Composes the reusable modules into one DAG.
# Each module is the `nonos-verify` Rust engine; the attestation job fuses their
# reports and fails the run if any blocking module failed.

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ci-${{ github.head_ref || github.ref_name }}
  # A pull request's older run is moot; a run on main finishes, so every
  # commit there gets a verdict (the newest queued push runs next).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The cache token reaches the build only on a push; see ci-build.yml.
  build:
    uses: ./.github/workflows/ci-build.yml
    secrets: inherit

  build-aarch64:
    uses: ./.github/workflows/ci-build-aarch64.yml

  boot-aarch64:
    uses: ./.github/workflows/ci-boot-aarch64.yml

  # The baked trust ledger must verify on every checkout, not only on a
  # release tag. The keystore re-enrollment shipped with a stale ledger
  # and nothing between merges and the tag ever looked, so the first
  # honest check was the release gate itself. This closes that window.
  trust-ledger:
    name: trust-ledger
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive
          persist-credentials: false
      - name: Verify the baked trust artifact ledger
        run: cd nonos-data/trust && sha256sum -c MANIFEST.sha256

  # Same reasoning for the double-build lane: it only ever ran on tags,
  # so its own defects surfaced as release failures. Scratch mode here;
  # the release keeps running it in production mode.
  reproducible:
    uses: ./.github/workflows/ci-reproducible.yml
    secrets: inherit
    with:
      trust-mode: scratch

  # The exact build a release tag runs: no seeds, the committed trust
  # set verified against every rebuilt capsule. Tag-only gates hid every
  # release failure so far; this one runs here first.
  production-build:
    if: github.actor != 'dependabot[bot]' && github.event.pull_request.user.login != 'dependabot[bot]'
    uses: ./.github/workflows/ci-build.yml
    secrets: inherit
    with:
      trust-mode: production

  supply-chain:
    uses: ./.github/workflows/ci-supply-chain.yml

  trust-chain:
    uses: ./.github/workflows/ci-trust-chain.yml

  adversarial:
    uses: ./.github/workflows/ci-adversarial.yml

  evidence:
    uses: ./.github/workflows/ci-evidence.yml

  benchmark:
    uses: ./.github/workflows/ci-benchmark.yml
    # Inherit secrets so the job receives CACHIX_AUTH_TOKEN: it is the only
    # lane that builds the full zerostate ship image, so it must be allowed to
    # write that build back to the cache, or it rebuilds from zero every run
    # and overruns its provision timeout.
    secrets: inherit

  attestation:
    needs: [build, trust-ledger, reproducible, supply-chain, trust-chain, adversarial, evidence, benchmark]
    if: always()
    uses: ./.github/workflows/ci-attestation.yml
    with:
      required-modules: build,supply-chain,trust-chain,adversarial,evidence,reproducible
