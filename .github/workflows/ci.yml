name: ci

# Top-level NONOS verification gate. Composes the reusable modules into one DAG.
# Each module is the `nonos-verify` Rust engine; the attestation job fuses their
# reports and fails the run if any blocking module failed.

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    uses: ./.github/workflows/ci-build.yml

  # The baked trust ledger must verify on every checkout, not only on a
  # release tag. The keystore re-enrollment shipped with a stale ledger
  # and nothing between merges and the tag ever looked, so the first
  # honest check was the release gate itself. This closes that window.
  trust-ledger:
    name: trust-ledger
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          submodules: recursive
          persist-credentials: false
      - name: Verify the baked trust artifact ledger
        run: cd nonos-data/trust && sha256sum -c MANIFEST.sha256

  # Same reasoning for the double-build lane: it only ever ran on tags,
  # so its own defects surfaced as release failures. Scratch mode here;
  # the release keeps running it in production mode.
  reproducible:
    uses: ./.github/workflows/ci-reproducible.yml
    secrets: inherit
    with:
      trust-mode: scratch

  supply-chain:
    uses: ./.github/workflows/ci-supply-chain.yml

  trust-chain:
    uses: ./.github/workflows/ci-trust-chain.yml

  adversarial:
    uses: ./.github/workflows/ci-adversarial.yml

  evidence:
    uses: ./.github/workflows/ci-evidence.yml

  benchmark:
    uses: ./.github/workflows/ci-benchmark.yml

  attestation:
    needs: [build, trust-ledger, reproducible, supply-chain, trust-chain, adversarial, evidence, benchmark]
    if: always()
    uses: ./.github/workflows/ci-attestation.yml
    with:
      required-modules: build,supply-chain,trust-chain,adversarial,evidence,reproducible
