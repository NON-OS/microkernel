# Guards every proof crate and static check (nix flake check, sharded) and the provers with their own toolchains: Kani, Verus, Lean, the extraction.
# Runs when called by pr and main, on every change including docs-only ones, since the static checks read the docs.
name: ci-verify

on:
  workflow_call:
    secrets:
      CACHIX_AUTH_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  # `nix flake check`, split across machines. Each shard reads the list of
  # checks from the flake and takes every n-th one (nonos-ci/flake-check-shard.sh),
  # so together they build the whole set, and shard 1 evaluates every output.
  flake-check:
    name: nix flake check (${{ matrix.name }}, ${{ matrix.shard }}/${{ matrix.shards }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64, runner: ubuntu-latest, shard: 1, shards: 4 }
          - { name: linux-x86_64, runner: ubuntu-latest, shard: 2, shards: 4 }
          - { name: linux-x86_64, runner: ubuntu-latest, shard: 3, shards: 4 }
          - { name: linux-x86_64, runner: ubuntu-latest, shard: 4, shards: 4 }
          - { name: macos-aarch64, runner: macos-latest, shard: 1, shards: 2 }
          - { name: macos-aarch64, runner: macos-latest, shard: 2, shards: 2 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/nix-setup
        with:
          cache: ${{ vars.NONOS_CACHIX }}
          cachix-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Build this shard's checks
        run: bash nonos-ci/flake-check-shard.sh "${{ matrix.shard }}/${{ matrix.shards }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: flake-check-${{ matrix.name }}-${{ matrix.shard }}-of-${{ matrix.shards }}
          path: ci-reports/flake-check/
          retention-days: 14
          if-no-files-found: ignore

  kani:
    name: kani (fs_proofs)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: model-checking/kani-github-action@69d357bade1eb7b32bc3fc3d5c3d173c5bfa5237 # v1
        with:
          kani-version: "0.67.0"
          working-directory: userland/fs_proofs

  proof-crates-kani:
    name: kani (proof crates)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
      - name: Install Kani
        run: |
          cargo install --locked kani-verifier --version 0.67.0
          cargo kani setup
      - name: Kani model checks
        run: bash nonos-ci/kani-proof-crates.sh

  verus:
    name: verus
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - name: Install Verus
        run: bash nonos-ci/install-verifiers.sh verus
      - name: Verify the capability theorems
        working-directory: verification/verus
        run: verus --crate-type=lib src/lib.rs

  lean:
    name: lean
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install elan
        run: bash nonos-ci/install-verifiers.sh elan
      - name: Specification theorems (lake build)
        working-directory: verification/lean
        run: lake build
      - name: Proof-corpus root (no sorry, standard axioms only)
        run: verification/lean/proof-corpus-root.sh
      - name: Axiom profile, inventory and manifest
        run: bash nonos-ci/lean-evidence.sh lean-evidence
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: lean-proofs-${{ github.run_id }}-${{ github.run_attempt }}
          path: lean-evidence/
          retention-days: 30
          if-no-files-found: error

  extraction:
    name: extraction
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - name: Install Charon, Aeneas and elan
        run: bash nonos-ci/install-verifiers.sh extraction
      # The project's own build only; Mathlib comes from `lake exe cache get`.
      # Lake rebuilds whatever its traces show changed, so a restored build
      # only spares the modules whose inputs are the same.
      - name: Restore the refinement build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: verification/extraction/lean/.lake/build
          key: extraction-${{ hashFiles('verification/extraction/lean/lean-toolchain', 'verification/extraction/lean/lake-manifest.json') }}-${{ hashFiles('verification/extraction/**') }}
          restore-keys: extraction-${{ hashFiles('verification/extraction/lean/lean-toolchain', 'verification/extraction/lean/lake-manifest.json') }}-
      - name: Regenerate every crate and check for drift
        run: python3 tools/extraction/regen.py --repo-root .
      - name: Verify the refinement theorems
        working-directory: verification/extraction/lean
        run: |
          lake exe cache get
          lake build 2>&1 | tee "${RUNNER_TEMP}/extraction-build.log"
      - name: Every axiom is stated
        run: python3 tools/ratchets/stated_axioms.py --log "${RUNNER_TEMP}/extraction-build.log" --root .
