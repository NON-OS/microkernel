name: ci-benchmark

on:
  workflow_call:
    inputs:
      trust-mode:
        description: "scratch for scheduled CI, production for release gates"
        required: false
        type: string
        default: "scratch"
      output-root:
        description: "benchmark artifact directory"
        required: false
        type: string
        default: "benchmarks/runs"
      boot-evidence:
        description: "run QEMU boot evidence benchmark"
        required: false
        type: boolean
        default: true
      strict:
        description: "fail when enabled benchmark records fail"
        required: false
        type: boolean
        default: true
      boot-runs:
        description: "number of QEMU boot evidence runs"
        required: false
        type: string
        default: "1"
    secrets:
      SIGNING_KEY_BASE64:
        required: false
      ZK_BOOT_INDEX:
        required: false
      ZK_BOOT_SECRET_X:
        required: false
      ZK_BOOT_SECRET_R:
        required: false
      ZK_BOOT_NONCE_SEED:
        required: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ci-benchmark-${{ github.ref }}
  cancel-in-progress: false

jobs:
  benchmark:
    name: benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          submodules: recursive
          persist-credentials: false
      - name: Reclaim runner disk space
        # The benchmark builds the full zerostate ship image: every capsule and
        # driver, each into its own target tree. That overruns the ~14 GB free
        # on a stock ubuntu-latest runner (No space left on device, error 28).
        # Drop the preinstalled toolchains this build never uses to free ~25 GB.
        run: |
          set -eux
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
            /usr/local/share/boost /usr/share/swift /usr/local/share/powershell \
            /usr/local/lib/node_modules "${AGENT_TOOLSDIRECTORY:-}" || true
          sudo docker image prune --all --force || true
          df -h /
      - uses: ./.github/actions/nonos-setup
        with:
          targets: x86_64-nonos,x86_64-unknown-uefi
          qemu: "true"
          module: benchmark
      - name: Prepare benchmark artifact root
        run: mkdir -p "${{ inputs['output-root'] }}/${{ github.run_id }}-${{ github.run_attempt }}"
      - name: Provision benchmark trust material
        # The benchmark builds the full zerostate ship image (every capsule and
        # driver), not the lighter desktop cut, so provisioning it takes longer
        # than the old profile did.
        timeout-minutes: 75
        env:
          NONOS_CI_TRUST_MODE: ${{ inputs['trust-mode'] }}
          SIGNING_KEY_BASE64: ${{ secrets.SIGNING_KEY_BASE64 }}
          ZK_BOOT_INDEX: ${{ secrets.ZK_BOOT_INDEX }}
          ZK_BOOT_SECRET_X: ${{ secrets.ZK_BOOT_SECRET_X }}
          ZK_BOOT_SECRET_R: ${{ secrets.ZK_BOOT_SECRET_R }}
          ZK_BOOT_NONCE_SEED: ${{ secrets.ZK_BOOT_NONCE_SEED }}
        run: |
          set -euo pipefail
          case "${NONOS_CI_TRUST_MODE}" in
            scratch)
              bash nonos-ci/setup-signing-key.sh
              echo "NONOS_DEV=1" >> "$GITHUB_ENV"
              bash -x nonos-ci/scratch-trust-bootstrap.sh
              ;;
            production)
              bash nonos-ci/setup-signing-key.sh
              # The kernel self-attestation is transparent and needs no
              # secrets. The ZK_BOOT values are the device binding's prover
              # material: the opening of an enrolled device slot, which
              # belongs to the machine's owner at install time and never to a
              # vendor pipeline. A release therefore ships without a binding
              # sidecar, and their absence here is the correct state, not a
              # missing provisioning step.
              make nonos-mk-check-trust-manifest
              ;;
            *)
              echo "::error::unknown trust-mode '${NONOS_CI_TRUST_MODE}'"
              exit 1
              ;;
          esac
      - name: Run benchmark suite
        timeout-minutes: 30
        env:
          NONOS_BENCH_OUT: ${{ inputs['output-root'] }}/${{ github.run_id }}-${{ github.run_attempt }}
          NONOS_BENCH_BUILD_CMD: cargo run --release --manifest-path nonos-verify/Cargo.toml -- build
          NONOS_BENCH_BOOT_TIMEOUT: "420"
          NONOS_BENCH_BOOT_RUNS: ${{ inputs['boot-runs'] }}
        run: |
          set -euo pipefail
          if [ "${{ inputs['strict'] }}" = "true" ]; then
            export NONOS_BENCH_STRICT=1
          else
            export NONOS_BENCH_STRICT=0
          fi
          if [ "${{ inputs['boot-evidence'] }}" != "true" ]; then
            export NONOS_BENCH_SKIP_BOOT=1
          fi
          boot_args="PLAN_A_SERIAL=${NONOS_BENCH_OUT}/boot/qemu-serial.log PLAN_A_RESULT=${NONOS_BENCH_OUT}/boot/plan-a-result.log"
          if [ "${{ inputs['trust-mode'] }}" = "scratch" ]; then
            boot_args="ZK_BOOT_LABELS=target/ci/zk/device_labels.txt ZK_BOOT_ROOT=target/ci/zk/device_root.bin ZK_BOOT_COMMITMENTS=target/ci/zk/device_commitments.bin ZK_BOOT_SECRETS=target/ci/zk/device_secrets.txt ${boot_args}"
          fi
          export NONOS_BENCH_BOOT_CMD="make ${boot_args} nonos-mk-plan-a-runtime"
          make nonos-mk-bench
      - name: Upload benchmark artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nonos-benchmarks-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ inputs['output-root'] }}/${{ github.run_id }}-${{ github.run_attempt }}/
          retention-days: 30
          if-no-files-found: error
