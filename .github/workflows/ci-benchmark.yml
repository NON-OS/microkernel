# Guards performance evidence: host, build and QEMU boot benchmarks with parsed boot phases, uploaded as one run directory (benchmarks/README.md).
# Runs when called by pr, main, nightly (three boots) and release, or by hand with its inputs.
name: ci-benchmark

on:
  workflow_call:
    inputs:
      trust-mode:
        description: "scratch, or production for the committed trust set"
        required: false
        type: string
        default: scratch
      boot-evidence:
        description: "Run the QEMU boot evidence benchmark"
        required: false
        type: boolean
        default: true
      strict:
        description: "Fail when an enabled benchmark record fails"
        required: false
        type: boolean
        default: true
      boot-runs:
        description: "Number of QEMU boot evidence runs"
        required: false
        type: string
        default: "1"
    secrets:
      SIGNING_KEY_BASE64:
        required: false
      CACHIX_AUTH_TOKEN:
        required: false
  workflow_dispatch:
    inputs:
      trust-mode:
        description: "scratch, or production for the committed trust set"
        required: true
        type: choice
        options: [scratch, production]
        default: scratch
      boot-evidence:
        description: "Run the QEMU boot evidence benchmark"
        required: true
        type: boolean
        default: true
      strict:
        description: "Fail when an enabled benchmark record fails"
        required: true
        type: boolean
        default: true
      boot-runs:
        description: "Number of QEMU boot evidence runs"
        required: true
        type: string
        default: "3"

permissions:
  contents: read

jobs:
  benchmark:
    name: benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 150
    defaults:
      run:
        shell: nix develop --command bash --noprofile --norc -eo pipefail {0}
    env:
      NONOS_BENCH_OUT: benchmarks/runs/${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      # The full ship image overruns the free disk of a stock runner.
      - name: Reclaim runner disk space
        shell: bash
        run: bash nonos-ci/reclaim-disk.sh
      - uses: ./.github/actions/nix-setup
        with:
          cache: ${{ vars.NONOS_CACHIX }}
          cachix-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Provision ${{ inputs.trust-mode }} trust material
        timeout-minutes: 110
        env:
          SIGNING_KEY_BASE64: ${{ secrets.SIGNING_KEY_BASE64 }}
        run: bash nonos-ci/provision-trust.sh "${{ inputs.trust-mode }}"
      - name: Run the benchmark suite
        timeout-minutes: 30
        env:
          NONOS_BENCH_BOOT_RUNS: ${{ inputs.boot-runs }}
          BENCH_STRICT: ${{ inputs.strict }}
          BENCH_BOOT: ${{ inputs.boot-evidence }}
        run: bash nonos-ci/bench-run.sh
      - name: Keep the run directory
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nonos-benchmarks-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.NONOS_BENCH_OUT }}/
          retention-days: 90
          if-no-files-found: error
