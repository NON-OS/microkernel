# Guards the Windows host path no QEMU job covers: the shipped ISO under VirtualBox with an Intel e1000 card, its serial log, a screenshot and VBox.log kept.
# Runs by hand for a release tag (a draft works), and on a push to browser-engine that changes this file.
name: windows-virtualbox

on:
  push:
    branches: [browser-engine]
    paths: [".github/workflows/ci-windows-virtualbox.yml"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag of the release carrying the ISO. A draft works, so an image can be tested before it is published."
        required: true
      asset:
        description: "Name of the ISO asset on that release"
        required: false
        default: "nonos.iso"
      boot_seconds:
        description: "How long to let it run before capturing"
        required: false
        default: "180"

permissions:
  contents: read

concurrency:
  group: windows-virtualbox-${{ github.ref }}
  cancel-in-progress: true

jobs:
  boot:
    name: boot (virtualbox)
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: nonos-ci
      - name: Install VirtualBox
        run: choco install virtualbox --no-progress --yes
      - name: Fetch the image
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || 'windows-boot-test' }}
          ASSET: ${{ inputs.asset || 'nonos.iso' }}
        run: ./nonos-ci/windows-virtualbox.ps1 fetch
      - name: Create the machine
        run: ./nonos-ci/windows-virtualbox.ps1 create
      - name: Boot it
        continue-on-error: true
        env:
          BOOT_SECONDS: ${{ inputs.boot_seconds || '180' }}
        run: ./nonos-ci/windows-virtualbox.ps1 boot
      - name: Say what happened
        if: always()
        run: ./nonos-ci/windows-virtualbox.ps1 report
      - name: Keep the evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-virtualbox-boot
          path: |
            artifacts/serial.log
            artifacts/screen.png
            artifacts/VBox.log
          if-no-files-found: warn
