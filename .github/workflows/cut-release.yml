# Guards the one deliberate act of a release: a version tag pointed only at a commit whose own completed checks are all green, then the release pipeline started on it.
# Runs by hand.
name: cut-release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Tag to create or move, e.g. v0.9.2"
        required: true
        type: string
      ref:
        description: "Commit or branch to tag (default: main)"
        required: false
        default: "main"
        type: string

permissions:
  contents: read

concurrency:
  group: cut-release
  cancel-in-progress: false

jobs:
  tag:
    name: tag ${{ inputs.version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: write
      checks: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - name: Require the commit's checks to be green
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash nonos-ci/require-green.sh "$(git rev-parse HEAD)"
      - name: Point the tag
        env:
          VERSION: ${{ inputs.version }}
        run: |
          sha="$(git rev-parse HEAD)"
          git config user.name "nonos-release"
          git config user.email "release@nonos.systems"
          git tag -f "${VERSION}" "${sha}"
          git push origin "refs/tags/${VERSION}" --force
          echo "tag ${VERSION} -> ${sha}"
      # A tag pushed with the workflow's own token fires no push event, so the
      # release pipeline is started on the tag explicitly.
      - name: Start the release pipeline on the tag
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: gh workflow run release.yml --repo "${GITHUB_REPOSITORY}" --ref "refs/tags/${VERSION}"
