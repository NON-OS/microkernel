# Guards the parsers of untrusted input: every fuzz target fuzz/targets.json runs in CI, over a corpus kept per target between runs; a crash fails the run with its reproducer.
# Runs when called by pr and main (minutes per target) and nightly (half an hour each), or by hand for a chosen length.
name: ci-fuzz

on:
  workflow_call:
    inputs:
      minutes:
        description: "Run length per target, in minutes"
        required: false
        type: number
        default: 2
      save-corpus:
        description: "Save each grown corpus for the next run"
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      minutes:
        description: "Run length per target, in minutes (at most 320)"
        required: true
        type: number
        default: 30
      save-corpus:
        description: "Save each grown corpus for the next run"
        required: true
        type: boolean
        default: true

permissions:
  contents: read

env:
  CARGO_FUZZ_VERSION: 0.13.2

jobs:
  plan:
    name: fuzz targets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        shell: bash
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      timeout: ${{ steps.timeout.outputs.minutes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The targets, held to the tree
        id: plan
        run: python3 nonos-ci/fuzz_targets.py
      - name: A job deadline with room for the build
        id: timeout
        env:
          MINUTES: ${{ inputs.minutes }}
        run: echo "minutes=$(( MINUTES + 30 ))" >> "$GITHUB_OUTPUT"

  fuzz:
    name: fuzz ${{ matrix.target }} (${{ matrix.crate }})
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJSON(needs.plan.outputs.timeout) }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust-setup
      - name: Restore cargo-fuzz
        id: cargo-fuzz
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-fuzz
          key: cargo-fuzz-${{ env.CARGO_FUZZ_VERSION }}-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}
      - name: Install cargo-fuzz
        if: steps.cargo-fuzz.outputs.cache-hit != 'true'
        run: cargo install --locked cargo-fuzz --version "${CARGO_FUZZ_VERSION}"
      - name: Restore the corpus
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ matrix.crate }}/fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.slug }}-${{ github.run_id }}
          restore-keys: |
            fuzz-corpus-${{ matrix.slug }}-
            fuzz-corpus-${{ matrix.target }}-
      - name: Fuzz for ${{ inputs.minutes }} minutes
        run: bash nonos-ci/fuzz-run.sh "${{ matrix.crate }}" "${{ matrix.target }}" "${{ inputs.minutes }}" "${{ matrix.seed }}"
      - name: Save the corpus
        if: always() && inputs.save-corpus
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ matrix.crate }}/fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.slug }}-${{ github.run_id }}
      - name: Keep the summary
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-summary-${{ matrix.slug }}
          path: fuzz-out/${{ matrix.slug }}.json
          retention-days: 90
          if-no-files-found: warn
      - name: Keep the log and any crash input
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-${{ matrix.slug }}
          path: |
            fuzz-out/${{ matrix.slug }}.log
            ${{ matrix.crate }}/fuzz/artifacts/
          retention-days: 90
          if-no-files-found: warn

  summary:
    name: fuzz summary
    needs: fuzz
    if: always() && needs.fuzz.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: fuzz-summary-*
          path: fuzz-summaries
          merge-multiple: true
      - name: The run's record and table
        run: python3 nonos-ci/fuzz_record.py run fuzz-summaries "${RUNNER_TEMP}/record"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-results
          path: ${{ runner.temp }}/record/
          retention-days: 90
          if-no-files-found: error
