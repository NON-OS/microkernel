# Guards every pull request with the full gate (ci.yml); a docs-only change runs the checks that read docs and skips the build jobs, by name, in the summary.
# Runs on each pull request push; a newer push cancels the older run.
name: pr

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      pull-requests: read
    secrets: inherit
