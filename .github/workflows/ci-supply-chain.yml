# Guards the supply chain: the flake's bill of materials, then cargo-audit, cargo-deny, the duplicate surface and the cargo SBOM, all with flake-pinned tools.
# Runs when called by pr, main, nightly and release.
name: ci-supply-chain

on:
  workflow_call:
    secrets:
      CACHIX_AUTH_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  supply-chain:
    name: supply-chain
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/nix-setup
        with:
          cache: ${{ vars.NONOS_CACHIX }}
          cachix-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: The flake's bill of materials
        run: |
          mkdir -p ci-reports/supply-chain
          cp "$(nix build .#sbom --no-link --print-out-paths)" ci-reports/supply-chain/nonos.cdx.json
          jq -e '.bomFormat == "CycloneDX" and (.components | length) > 0' ci-reports/supply-chain/nonos.cdx.json
          jq -r '"SBOM: \(.components | length) components, \([.components[] | select(.hashes)] | length) of them by hash"' \
            ci-reports/supply-chain/nonos.cdx.json >> "$GITHUB_STEP_SUMMARY"
      - uses: ./.github/actions/nonos-verify
        with:
          module: supply-chain
