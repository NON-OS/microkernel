name: ci-supply-chain

# Reusable supply-chain proof. `nonos-verify supply-chain` runs cargo-audit and
# cargo-deny, captures the duplicate dependency surface, verifies submodule pin
# integrity, generates an SBOM where tooling allows, and records the
# reproducibility inputs (the full double-build compare runs nightly).

on:
  workflow_call:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ci-supply-chain-${{ github.ref }}
  cancel-in-progress: false

jobs:
  supply-chain:
    name: supply-chain
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          submodules: recursive
          persist-credentials: false
      - uses: ./.github/actions/nonos-setup
        with:
          tools: audit,deny,cyclonedx
          module: supply-chain
      - name: nonos-verify supply-chain
        run: cargo run --release --manifest-path nonos-verify/Cargo.toml -- supply-chain
      - name: Upload supply-chain artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ci-reports-supply-chain
          path: ci-reports/
          retention-days: 14
          if-no-files-found: error
