name: ci-release-artifacts

# The release bundle a tag publishes: the flake's reproducible build, unsigned,
# with its bill of materials, the public trust roots and checksums over all of
# it (nonos-verify release). CI holds no key and signs nothing. The sealed
# image is ek's (nix run .#seal --release), uploaded to the same release, and
# anyone can rebuild this bundle and check the sealed kernel and loader are
# the same bytes.

on:
  workflow_call:
    secrets:
      CACHIX_AUTH_TOKEN:
        required: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ci-release-artifacts-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-artifacts:
    name: release-artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 240
    defaults:
      run:
        shell: nix develop --command bash --noprofile --norc -eo pipefail {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/nix-setup
        with:
          cache: ${{ vars.NONOS_CACHIX }}
          cachix-token: ${{ github.event_name == 'push' && secrets.CACHIX_AUTH_TOKEN || '' }}
      - name: nix build, the standard profile and its bill of materials
        run: nix build .#standard -L
      - name: The attestation surface's verifier
        run: |
          # The verify page checks proofs in the browser with the verifier the
          # gates link: nox_verify_wasm from NON-OS/STARKs at the commit
          # flake.lock pins, built by the flake.
          mkdir -p release
          cp "$(nix build .#verifier-wasm --no-link --print-out-paths)/verifier.wasm" release/verifier.wasm
      - name: nonos-verify release
        run: cargo run --release --manifest-path nonos-verify/Cargo.toml -- release
      - name: The release assets, and sums over exactly them
        run: |
          # The bundle's own sums name the files inside the tarball; the
          # release's sums name the files a person downloads.
          mv release/SHA256SUMS release/BUNDLE-SHA256SUMS
          mv release/BLAKE3SUMS release/BUNDLE-BLAKE3SUMS
          cp result/nonos.cdx.json result/nonos-build.json release/
          cd release
          assets="nonos-release-bundle.tar.gz BUNDLE-SHA256SUMS BUNDLE-BLAKE3SUMS provenance.json nonos.cdx.json nonos-build.json verifier.wasm"
          sha256sum $assets > SHA256SUMS
          b3sum $assets > BLAKE3SUMS
      - name: Upload the release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: nonos-image
          path: |
            release/nonos-release-bundle.tar.gz
            release/SHA256SUMS
            release/BLAKE3SUMS
            release/BUNDLE-SHA256SUMS
            release/BUNDLE-BLAKE3SUMS
            release/provenance.json
            release/nonos.cdx.json
            release/nonos-build.json
            release/verifier.wasm
          retention-days: 30
          if-no-files-found: error
      - name: Upload release reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ci-reports-release
          path: ci-reports/
          retention-days: 30
          if-no-files-found: error
