# Guards the release bundle: the flake's reproducible build, unsigned, with its bill of materials, the public trust roots and checksums over all of it.
# Runs when called by release; CI holds no key and signs nothing, the sealed image is uploaded beside it from the machine with the keys.
name: ci-release-artifacts

on:
  workflow_call:
    secrets:
      CACHIX_AUTH_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  release-artifacts:
    name: release-artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 240
    defaults:
      run:
        shell: nix develop --command bash --noprofile --norc -eo pipefail {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/nix-setup
        with:
          cache: ${{ vars.NONOS_CACHIX }}
          cachix-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: nix build, the standard profile and its bill of materials
        run: nix build .#standard -L
      - name: The attestation surface's verifier and the proof verifier's page
        run: bash nonos-ci/release-assets.sh web
      - uses: ./.github/actions/nonos-verify
        with:
          module: release
          retention-days: "30"
      - name: The release assets, and sums over exactly them
        run: bash nonos-ci/release-assets.sh sums
      - name: Upload the release bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nonos-image
          path: |
            release/nonos-release-bundle.tar.gz
            release/SHA256SUMS
            release/BLAKE3SUMS
            release/BUNDLE-SHA256SUMS
            release/BUNDLE-BLAKE3SUMS
            release/provenance.json
            release/nonos.cdx.json
            release/nonos-build.json
            release/verifier.wasm
            release/proof-verify-web.tar.gz
          retention-days: 30
          if-no-files-found: error
