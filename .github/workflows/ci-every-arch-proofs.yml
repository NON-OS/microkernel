# Guards the proof crates on every port: each type-checked with tests for aarch64 and riscv64 Linux, and the thread, Context and cache-walk proofs run there under qemu-user.
# Runs when called by pr and main; arch_reach_proofs in the flake checks holds the x86_64-only ledgers.
name: ci-every-arch-proofs

on:
  workflow_call:

permissions:
  contents: read

jobs:
  proofs:
    name: proofs (${{ matrix.triple }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - triple: aarch64-unknown-linux-gnu
            packages: gcc-aarch64-linux-gnu libc6-dev-arm64-cross qemu-user
            linker: aarch64-linux-gnu-gcc
            runner: qemu-aarch64 -L /usr/aarch64-linux-gnu
            crates: userland/std_pal_proofs userland/loader_arm_proofs
          - triple: riscv64gc-unknown-linux-gnu
            packages: gcc-riscv64-linux-gnu libc6-dev-riscv64-cross qemu-user
            linker: riscv64-linux-gnu-gcc
            runner: qemu-riscv64 -L /usr/riscv64-linux-gnu
            crates: userland/std_pal_proofs userland/riscv_kernel_proofs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust-setup
        with:
          targets: ${{ matrix.triple }}
      - name: The target's C compiler and qemu-user
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ${{ matrix.packages }}
      - name: Type-check every proof crate
        run: bash nonos-ci/check-proofs-every-arch.sh ${{ matrix.triple }}
      - name: Run the architecture's proofs under qemu-user
        env:
          TRIPLE: ${{ matrix.triple }}
          LINKER: ${{ matrix.linker }}
          RUNNER: ${{ matrix.runner }}
          CRATES: ${{ matrix.crates }}
        run: bash nonos-ci/run-proofs-on-arch.sh
