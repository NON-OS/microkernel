# Guards the record of benchmark and fuzz results: this run's records committed with their history to the bench-results branch (benchmarks/README.md, fuzz/README.md).
# Runs when called by main, nightly and release, after the jobs that made the records; it never fails the run.
name: ci-publish-results

on:
  workflow_call:

permissions:
  contents: read

jobs:
  publish:
    name: publish results
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download the benchmark run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: nonos-benchmarks-${{ github.run_id }}-*
          path: ${{ runner.temp }}/bench
          merge-multiple: true
      - name: Download the fuzz summaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: fuzz-summary-*
          path: ${{ runner.temp }}/fuzz
          merge-multiple: true
      - name: Commit the records to bench-results
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash nonos-ci/publish-results.sh bench-results "${RUNNER_TEMP}/bench" "${RUNNER_TEMP}/fuzz"
