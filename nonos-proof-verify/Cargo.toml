#
# The proof verifier anyone can run: a kernel, bootloader or capsule's v4
# trailer checked against a policy root exactly as the gates check it, with
# the gates' own path crate and STARK verifier, and nothing proven here.

[package]
name = "nonos-proof-verify"
version = "1.0.0"
edition = "2021"
license = "AGPL-3.0-or-later"
publish = false
description = "Check a NONOS v4 attestation trailer against a policy root, as the boot and spawn gates check it"

[lib]
path = "src/lib.rs"

[[bin]]
name = "nonos-proof-verify"
path = "src/main.rs"

[dependencies]
nonos-attest-path = { path = "../nonos-attest-path", features = ["alloc"] }
nonos-boot-measure = { path = "../nonos-boot-measure" }
# The gates' verifier, from the same STARK project the enroll tool pins.
nox_verify = { git = "https://github.com/NON-OS/STARKs.git", branch = "main" }
blake3 = "1"

[dev-dependencies]
serde_json = "1"

[package.metadata.nonos]
test-lane = true
