#
# The proof verifier as a WebAssembly module a page instantiates with nothing
# but `WebAssembly.instantiate`: no bindings, no imports. It runs the command
# line's own `cli` over files the page hands it, so the page and the command
# agree byte for byte.

[package]
name = "nonos-proof-verify-wasm"
version = "1.0.0"
edition = "2021"
license = "AGPL-3.0-or-later"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
nonos-proof-verify = { path = ".." }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"

[workspace]

[package.metadata.nonos]
test-lane = true
