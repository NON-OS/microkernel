# Fuzz targets for the proof verifier's two readers of untrusted input: the
# trailer (with the full check behind it, STARK included) and the policy
# transcript. Run one with: cargo +nightly-2026-01-16 fuzz run <target>

[package]
name = "nonos-proof-verify-fuzz"
version = "0.0.0"
edition = "2021"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
nonos-proof-verify = { path = ".." }
nonos-attest-path = { path = "../../nonos-attest-path" }

[[bin]]
name = "trailer"
path = "fuzz_targets/trailer.rs"
test = false
doc = false
bench = false

[[bin]]
name = "transcript"
path = "fuzz_targets/transcript.rs"
test = false
doc = false
bench = false

[workspace]
