version = 1
endian = "little"
ptr_width = 64
align = 8

[user_copy]
smap = true
stac = true
clac = true
max_copy_bytes = 1048576

[abi]
gateway_default = "int80"
gateway_alt     = "syscall"
reg_order = ["rax","rdi","rsi","rdx","r10","r8","r9"]
ret_reg  = "rax"
error_convention = "neg_errno"

[graphics]
pixel_format = "argb8888"
display_count_max = 1
surface_backing = "process_mmap"
present_modes = ["full", "rect"]

[graphics.display_info_v1]
id = "u32"
width = "u32"
height = "u32"
pitch = "u32"
fmt = "u32"
flags = "u32"

# Plan B substrate.
# Owner passes this struct to MSRG (MkSurfaceRegister) and receivers
# get it written back by MSAT (MkSurfaceAttach). Byte-identical
# across every supported triple; little-endian; 8-byte aligned.
[graphics.surface_descriptor_v1]
size_bytes = 48
align = 8
width      = {offset = 0,  type = "u32"}
height     = {offset = 4,  type = "u32"}
stride     = {offset = 8,  type = "u32"}
format     = {offset = 12, type = "u32"}
byte_len   = {offset = 16, type = "u64"}
base_va    = {offset = 24, type = "u64"}
flags      = {offset = 32, type = "u64"}
owner_pid  = {offset = 40, type = "u32"}
writable   = {offset = 44, type = "u32"}

# Driver capsules post these via MIEP, input_router drains via MIED.
# Kind values:
#   0 KeyDown   1 KeyUp   2 PointerRel   3 PointerAbs
#   4 Wheel     5 ButtonDown 6 ButtonUp   7 Touch
[input.event_v1]
size_bytes = 32
align = 8
kind         = {offset = 0,  type = "u16"}
# flags: bits 0-7 the poster's modifiers; bits 8-13 the source index the kernel
# writes over the poster's; bits 14-15 the Bluetooth capsule's bond marks. The
# input_router clears bits 8-15 before any app sees it.
flags        = {offset = 2,  type = "u16"}
code         = {offset = 4,  type = "u32"}
x            = {offset = 8,  type = "i32"}
y            = {offset = 12, type = "i32"}
delta_x      = {offset = 16, type = "i32"}
delta_y      = {offset = 20, type = "i32"}
timestamp_ns = {offset = 24, type = "u64"}

# MkIpcRecvReq (MIRQ) writes this beside a request's bytes; meta_len must be
# size_bytes or the call is EINVAL. request is the id MkIpcReplyTo (MIRT)
# answers, per server, from 1, never reused while the server lives; 0 when
# no reply is owed (a kernel sender). sender is 0 for a kernel sender too.
# Kernel: src/syscall/microkernel/ipc/recv_meta.rs.
[ipc.recv_meta_v1]
size_bytes = 24
align = 8
version      = {offset = 0,  type = "u16", value = 1}
reserved     = {offset = 2,  type = "u16", value = 0}
sender       = {offset = 4,  type = "u32"}
enqueued_ms  = {offset = 8,  type = "u64"}
request      = {offset = 16, type = "u64"}

# The window manager's notification (userland/capsule_wm/src/protocol/notify.rs):
# magic "NWMV" (0x4E574D56 read little-endian), version 1, flags 0. Kinds 0 to
# 3 go to lifecycle subscribers: opened, closed, full screen (x 1 or 0), and
# focused (the focused window, both 0 when none). Kind 4 goes to a window's
# owner alone, when that window takes the keyboard (x 1) or loses it (x 0).
[wm.notify_v1]
size_bytes = 28
magic      = {offset = 0,  type = "u32"}
version    = {offset = 4,  type = "u16"}
flags      = {offset = 6,  type = "u16"}
event_kind = {offset = 8,  type = "u32"}
owner_pid  = {offset = 12, type = "u32"}
window_id  = {offset = 16, type = "u32"}
x          = {offset = 20, type = "u32"}
y          = {offset = 24, type = "u32"}

[wm.notify_v1.kinds]
opened      = 0
closed      = 1
full_screen = 2
focused     = 3
keys        = 4
