version = 1

# Generated by scripts/gen_caps_abi.py from
# src/capabilities/types/bit.rs. Do not edit [bits] by hand.
[bits]
CORE_EXEC               = 0x0000_0000_0000_0001
IO                      = 0x0000_0000_0000_0002
NETWORK                 = 0x0000_0000_0000_0004
IPC                     = 0x0000_0000_0000_0008
MEMORY                  = 0x0000_0000_0000_0010
CRYPTO                  = 0x0000_0000_0000_0020
FILE_SYSTEM             = 0x0000_0000_0000_0040
HARDWARE                = 0x0000_0000_0000_0080
DEBUG                   = 0x0000_0000_0000_0100
ADMIN                   = 0x0000_0000_0000_0200
REGISTER_SERVICE        = 0x0000_0000_0000_0400
GRAPHICS_DISPLAY_QUERY  = 0x0000_0000_0000_0800
GRAPHICS_SURFACE_CREATE = 0x0000_0000_0000_1000
GRAPHICS_SURFACE_MAP    = 0x0000_0000_0000_2000
GRAPHICS_PRESENT        = 0x0000_0000_0000_4000
DEVICE_ENUM             = 0x0000_0000_0000_8000
DRIVER                  = 0x0000_0000_0001_0000
MMIO                    = 0x0000_0000_0002_0000
IRQ                     = 0x0000_0000_0004_0000
DMA                     = 0x0000_0000_0008_0000
PIO                     = 0x0000_0000_0010_0000
INPUT_SOURCE            = 0x0000_0000_0020_0000
TIME_SET                = 0x0000_0000_0040_0000
SPAWN_BROKER            = 0x0000_0000_0080_0000
SPAWN_WINDOW            = 0x0000_0000_0100_0000
PROCESS_CONTROL         = 0x0000_0000_0200_0000
STORE_WRITE             = 0x0000_0000_0400_0000
ENROL_DEV_ROOT          = 0x0000_0000_0800_0000
KEYRING                 = 0x0000_0000_1000_0000
ENTROPY                 = 0x0000_0000_2000_0000
APP_INSTALL             = 0x0000_0000_4000_0000

# Named bundles, each the set a class of capsule is actually spawned with in
# this tree. They named LOG, YIELD, TIME and KSTAT until now, which are not
# capabilities: logging, yielding, reading the clock and reading the process
# table are ungated, so those four rights had no bits and the groups described
# a model the kernel had stopped enforcing.
#
# A group is policy rather than something derivable from the enum, so these
# stay hand written. What keeps them honest is that each is the mask of a real
# capsule: SERVICE is the keyring's, GRAPHICS_SERVICE is the wallet's without
# its network and crypto, OPER is the process manager's.
[groups]
BASIC   = ["CORE_EXEC","MEMORY"]
SERVICE = ["CORE_EXEC","MEMORY","IPC"]
OPER    = ["CORE_EXEC","MEMORY","IPC","PROCESS_CONTROL"]
GRAPHICS_SERVICE = ["CORE_EXEC","MEMORY","IPC","GRAPHICS_DISPLAY_QUERY","GRAPHICS_SURFACE_CREATE"]

[token]
id_bytes        = 32
subject_bytes   = 32
rights_bits     = 64
not_before_ns   = true
not_after_ns    = true
mac_bytes       = 32
issuer_bytes    = 32   # kernel-boot attestation id

[mac]
algo = "sha3-256"
const_time = true
context = "NONOS_CAP_V1"

# FROM -> TO allowed rights. Every line is a subset of the FROM group, since a
# holder cannot hand on a right it does not have, and of the TO group, since
# the point of delegating to a narrower class is that it stays narrower.
[delegation]
BASIC_to_BASIC     = ["CORE_EXEC","MEMORY"]
OPER_to_SERVICE    = ["CORE_EXEC","MEMORY","IPC"]
OPER_to_BASIC      = ["CORE_EXEC","MEMORY"]
SERVICE_to_BASIC   = ["CORE_EXEC","MEMORY"]
