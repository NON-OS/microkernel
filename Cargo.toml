# prove a keystroke reaching a focused capsule: PS/2 + virtio-gpu
# drivers, input_router, compositor, and the input_probe surface.
# NO window manager, shell, or other GUI apps — the probe is the sole
# focusable window, so input never starves behind the full fleet.
microkernel-input-probe = [
  "microkernel-core",
  "nonos-production",
  "nonos-user-entry-proof",
  "nonos-capsule-proof-io",
  "nonos-capsule-driver-ps2-input",
  "nonos-capsule-input-router",
