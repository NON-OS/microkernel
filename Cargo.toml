# Layout-stable debug ring. Allocation-free, formatter-free fixed-VA
# byte ring at the `.nonos.dbg_ring` section. Triggered by adding
# `dbg_emit(tag, &payload)` call sites; drained from the panic path
# and diagnostic paths. Off by default — production builds are
# byte-identical to before when this feature is absent.
dbg-ring = []

# Live-allocation tracking in the kernel heap. Records every allocated
# pointer in a fixed 8192-entry `FnvIndexSet` so `verify_heap_integrity`
# can sweep every live block's header, redzone and timestamp. Costs a
# spin-lock plus a hash insert/remove on every kernel alloc and free, so
# it is off by default; the always-compiled per-free header and redzone
# checks in `dealloc_impl` are unaffected either way.
heap-track = []

# Production posture. Excludes the legacy unverified spawn path:
# `runner::legacy`, the `CapsuleSpec` legacy struct, and every
# capsule still wired through them are cfg-gated off. Only capsules
# that go through `spawn_verified` (proof_io today) compile under
# this feature. Mutex with `nonos-dev-unverified-capsules` is
# enforced by the `compile_error!` in `lib.rs`.
# Production posture: verified-only spawn path. Capsule attestation is enforced
# unconditionally by the always-compiled transparent verifier; a missing or failed
# proof is fatal unless `nonos-zk-rollout` is set.
nonos-production = []
# Staged-rollout escape hatch: when set, a missing or failing attestation is logged
# but the spawn proceeds. Mutually exclusive with `nonos-production` (enforced by
# the `compile_error!` in lib.rs). Opt-in only, never part of any profile.
nonos-zk-rollout = []

# Escape hatch for development that still needs the legacy
# unverified spawn path. Mutually exclusive with `nonos-production`
# (see the `compile_error!` in `lib.rs`). Never part of any default
# production profile; opt-in only.
nonos-dev-unverified-capsules = []

# Pre-iretq audit. The scheduler walks the target CR3 through the
# directmap and proves the kernel halves, the user RIP leaf, the
# user RSP leaf, TSS.RSP0 and the PF/GP IST stacks before iretq. On
# any failure the kernel prints `[USER-PROOF] FAIL ...` and halts
# instead of triple-faulting blindly.
nonos-user-entry-proof = []

# Arms the kernel-side synthetic scancode injector. Off by default.
input-probe-inject = []

nonos-terminal-smoketest = ["nonos-capsule-terminal", "nonos-user-entry-proof"]

nonos-image-viewer-smoketest = ["nonos-capsule-image-viewer", "nonos-user-entry-proof"]
nonos-video-player-smoketest = ["nonos-capsule-video-player", "nonos-user-entry-proof"]

nonos-ntp-smoketest = ["microkernel-net-ntp", "nonos-user-entry-proof"]

# Brutal-minimum kernel profile. Each entry closes a real boundary:
#   kernel, standalone   no-std bootstrap and panic handler routing
#   arch-x86_64          target arch
#   sched                src/entry/kernel_main.rs enters the scheduler
#   sha3                 KASLR entropy path imports `sha3` unconditionally
#   crypto-ed25519-int   in-tree manifest verifier (Ed25519)
microkernel-core = [
  "kernel",
  "standalone",
  "arch-x86_64",
  "sched",
  "sha3",
  "crypto-ed25519-int",
  "nonos-arch-iommu",
]

# Runtime baseline: core + the three live capsule embeds.
microkernel-capsules = [
  "microkernel-core",
  "nonos-capsule-proof-io",
  "nonos-capsule-ramfs",
  "nonos-capsule-keyring",
]

# Per-capsule production profiles. Each builds a kernel under the
