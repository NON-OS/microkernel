[package]
name = "nonos-stark"
version = "0.2.0"
edition = "2021"
license = "AGPL-3.0"
description = "Transparent post-quantum STARK primitives shared by the kernel and the bootloader"

[lib]
name = "nonos_stark"

[dependencies]
blake3 = { version = "1.0", default-features = false }
rayon = { version = "1", optional = true }

[features]
# Host emit tooling only. Parallelizes the prover across all cores; never
# enabled for the kernel or bootloader build, which stay no_std and serial.
parallel = ["dep:rayon"]
