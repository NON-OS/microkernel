# NONOS userland: capsule_browser
# eK@nonos.systems
#
# Minimal real graphical web browser capsule. Owned state, no globals.
# Built on `nonos_app_skeleton`.

[package]
name = "nonos_browser"
version = "0.3.0"
edition = "2021"
publish = false
license = "AGPL-3.0"
authors = ["eK@nonos.systems"]
description = "NONOS browser capsule"

[[bin]]
name = "browser"
path = "src/main.rs"

[features]
# `harness` compiles only the pure render modules (dom, css, layout, fonts,
# image decode/blit) so a host tool can render pages to an image off-device.
# The capsule build never enables it; declaring it keeps cfg checks quiet.
harness = []

[dependencies]
nonos_libc = { package = "nonos_userland_libc", path = "../libc" }
nonos_tls = { path = "../nonos_tls" }
nonos_app_skeleton = { path = "../app_skeleton" }
nonos_toolkit = { path = "../toolkit" }
nonos_inflate = { path = "../inflate" }
nonos_base64 = { path = "../base64" }
nonos_qjs = { path = "../nonos_qjs" }
spin = { version = "0.9", default-features = false, features = ["mutex", "spin_mutex"] }

[profile.release]
panic = "abort"
opt-level = 2
lto = false
debug = false
strip = true

[profile.dev]
panic = "abort"
opt-level = 0
debug = true
