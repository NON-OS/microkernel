# Host-runnable proofs for nsh_wire, the nsh/1 wire format: every refusal
# the parsers make is a test here, every body round-trips through the
# builders, and the size caps are checked against the largest bodies the
# format allows. The fuzz targets are in fuzz/.

[package]
name = "nsh_wire_proofs"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
nsh_wire = { path = "../nsh_wire" }
