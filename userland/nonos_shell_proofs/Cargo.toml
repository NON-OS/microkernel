#
# Host proofs for nonos_shell's shared builtins and its headless dispatch:
# what each prints and the status it returns, through a recording ShellOut and
# a scripted Host, so what the GUI terminal and an nsh session share is
# proven where it lives.

[package]
name = "nonos_shell_proofs"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
nonos_hash = { path = "../nonos_hash" }
nonos_shell = { path = "../nonos_shell" }
