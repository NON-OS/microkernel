# NONOS userland: capsule_hello
#
# Minimal real GUI capsule and the reference for the docs quickstart guide: opens
# a window through the wm, paints a greeting, closes on Esc. Start
# here when building your first capsule.

[package]
name = "nonos_hello"
version = "0.3.0"
edition = "2021"
publish = false
license = "AGPL-3.0"
description = "NONOS hello capsule"

[[bin]]
name = "hello"
path = "src/main.rs"

[dependencies]
nonos_libc = { package = "nonos_userland_libc", path = "../libc" }
nonos_app_skeleton = { path = "../app_skeleton" }

[profile.release]
panic = "abort"
opt-level = 2
lto = false
debug = false
strip = true

[profile.dev]
panic = "abort"
opt-level = 0
debug = true
