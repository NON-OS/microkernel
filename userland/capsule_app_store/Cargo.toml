# NONOS userland: capsule_app_store
# eK@nonos.systems
#
# The marketplace window. Reads the catalogue the market capsule serves
# over `market.index`, groups it by the three namespaces the operator
# signs (NONOS capsules, Linux packages, community submissions), and for
# the selected listing shows every install gate with its own verdict so a
# refusal names what refused rather than greying out a button.
#
# Holds no install logic and no payment logic: this displays the index
# authority's answers and does not form its own.

[package]
name = "nonos_app_store"
version = "0.1.0"
edition = "2021"
publish = false
license = "AGPL-3.0"
authors = ["eK@nonos.systems"]
description = "NONOS marketplace window"

build = "build.rs"

[[bin]]
name = "app_store"
path = "src/main.rs"

[dependencies]
nonos_libc = { package = "nonos_userland_libc", path = "../libc" }
nonos_app_skeleton = { path = "../app_skeleton" }
nonos_toolkit = { path = "../toolkit", default-features = false }
nonos_market_proto = { path = "../market_proto" }
# A listing's commerce block, decoded for its price line (B9).
nonos_marketplace_abi = { path = "../marketplace_abi" }
# The chain INSTALL_READY reads a sold listing's bond on (v1.4.23).
nonos_nox_config = { path = "../nonos_nox_config" }
nonos_payment_proto = { path = "../payment_proto" }
# NPRV frames to app.prove.job, for the proof of an app's run (I-B9a).
nonos_proof_abi = { path = "../nonos_proof_abi" }
# Whether this boot is live, for which Qwen tiers fit (Persistent).
nonos_policy_client = { path = "../policy_client" }
nonos_policy_proto = { path = "../policy_proto" }
# The network a tier's download would leave by, said on its card.
nonos_route_link = { path = "../nonos_route_link" }
# keccak for a payee's EIP-55 line, in process: public bytes need no Crypto.
sha3 = { version = "=0.10.9", default-features = false }
# A held proof is wiped through zeroize's volatile writes, as the wallet's secrets.
zeroize = { version = "=1.9.0", default-features = false, features = ["alloc"] }

[profile.release]
panic = "abort"
opt-level = 2
lto = false
debug = false
strip = true

[profile.dev]
panic = "abort"
opt-level = 0
debug = true
