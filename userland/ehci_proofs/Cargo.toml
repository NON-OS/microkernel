# NONOS Operating System
# Copyright (C) 2026 NONOS Contributors
#
# Host-runnable proofs for the EHCI host capsule: its schedule, transfers
# and wire handlers run here from the shipped source through #[path],
# against a model controller that walks its async ring and periodic list
# frame by frame, routing full- and low-speed devices to the companion.
[package]
name = "ehci_proofs"
version = "0.1.0"
edition = "2021"

[lib]
path = "src/lib.rs"

[dependencies]
nonos_usb_hub = { path = "../nonos_usb_hub" }
nonos_usb_virt = { path = "../nonos_usb_virt" }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }
