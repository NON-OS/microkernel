# NONOS userland: capsule_driver_ehci
# eK@nonos.systems
#
# EHCI host controller capsule: the USB 2.0 high-speed host of the chipsets
# before xHCI and of QEMU, VirtualBox and VMware. It serves the host wire of
# driver.xhci0 on driver.ehci0, so the class drivers use it unchanged.

[package]
name = "nonos_capsule_driver_ehci"
version = "0.1.0"
edition = "2021"
publish = false
license = "AGPL-3.0"
authors = ["eK@nonos.systems"]
description = "NONOS userland EHCI USB host controller capsule"

[[bin]]
name = "driver_ehci"
path = "src/main.rs"

[dependencies]
nonos_libc = { package = "nonos_userland_libc", path = "../libc" }

[profile.release]
panic = "abort"
opt-level = 2
lto = false
debug = false
strip = true
