# Fuzz target for the Linux personality's readers of guest and package input,
# mounted by capsule_linux_proofs. Run with:
# cargo +nightly-2026-01-16 fuzz run linux_inputs

[package]
name = "capsule_linux_proofs-fuzz"
version = "0.0.0"
edition = "2021"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
nonos_capsule_linux_proofs = { path = ".." }

[[bin]]
name = "linux_inputs"
path = "fuzz_targets/linux_inputs.rs"
test = false
doc = false
bench = false

[workspace]
