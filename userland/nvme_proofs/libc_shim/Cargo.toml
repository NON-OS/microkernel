# NONOS Operating System
# Copyright (C) 2026 NONOS Contributors
#
# Stands in for nonos_libc under the NVMe driver files the proofs include.
# DMA memory is host memory at the address the driver is told, the clock
# moves only when read, and every grant handed back is recorded, so the
# tests play the controller and check the order the driver lets go in.
[package]
name = "nvme_proofs_libc_shim"
version = "0.1.0"
edition = "2021"
publish = false
license = "AGPL-3.0-or-later"

[lib]
name = "nonos_libc"
path = "src/lib.rs"
