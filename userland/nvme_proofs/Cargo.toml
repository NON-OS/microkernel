# NONOS Operating System
# Copyright (C) 2026 NONOS Contributors
#
# Host-runnable proofs for the NVMe driver's untrusted-input parsers. Builds
# for the host so `cargo test` runs the real driver source (included via
# #[path]) against adversarial requests and device-controlled pages, without a
# boot.
[package]
name = "nvme_proofs"
version = "0.3.0"
edition = "2021"

[lib]
path = "src/lib.rs"

[dependencies]
# The included driver files name nonos_libc; on the host it is the shim
# beside this crate, where DMA is host memory and the clock is scripted.
nonos_libc = { package = "nvme_proofs_libc_shim", path = "libc_shim" }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }
