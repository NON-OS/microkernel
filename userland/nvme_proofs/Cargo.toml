#
# Host-runnable proofs for the NVMe driver's untrusted-input parsers. Builds
# for the host so `cargo test` runs the real driver source (included via
# #[path]) against adversarial requests and device-controlled pages, without a
# boot.
[package]
name = "nvme_proofs"
version = "0.3.0"
edition = "2021"

[lib]
path = "src/lib.rs"

[dependencies]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }
