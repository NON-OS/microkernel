# NONOS Operating System
# Copyright (C) 2026 NONOS Contributors
#
# Host-runnable proofs for the input decoders. Builds for the host so
# `cargo test` exercises the real PS/2 and i2c-hid decode source (included via
# #[path]) against hostile and edge-case hardware bytes, with no device present.
[package]
name = "input_proofs"
version = "0.3.0"
edition = "2021"

[lib]
path = "src/lib.rs"

[dependencies]
nonos_keymap = { path = "../nonos_keymap" }
# The included input router files name nonos_libc; on the host that is the
# shim beside this crate.
nonos_libc = { package = "input_proofs_libc_shim", path = "libc_shim" }
