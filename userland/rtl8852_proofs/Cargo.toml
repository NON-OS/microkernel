# NONOS Operating System
# Copyright (C) 2026 NONOS Contributors
#
# Host-runnable proofs for the RTL8852BE driver. Builds for the host so
# `cargo test` runs the real driver source (included via #[path]) against a
# modelled chip: its registers, its firmware CPU's download and mailbox, its
# DMA rings, and the air to a simulated access point, with no card present.
[package]
name = "rtl8852_proofs"
version = "0.1.0"
edition = "2021"
publish = false
license = "AGPL-3.0-or-later"

[lib]
path = "src/lib.rs"

[dependencies]
nonos_libc = { package = "rtl8852_proofs_libc_shim", path = "libc_shim" }
nonos_mac = { path = "../nonos_mac" }
nonos_wifi_core = { path = "../nonos_wifi_core" }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }
