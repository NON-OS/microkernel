# NONOS userland: capsule_driver_virtio_scsi
#
# Userland virtio-scsi (1af4:1048, 1af4:1004 with the modern transport)
# driver capsule: QEMU's virtio-scsi-pci and every host that offers it.
# The modern transport through nonos_virtio, one request queue, one
# coherent DMA grant for the ring, the request and the 64 KiB buffer,
# polled. The disks and CD drives on its targets are served on the block
# wire (NBW1) through nonos_scsi and nonos_scsi_serve.

[package]
name = "nonos_capsule_driver_virtio_scsi"
version = "0.3.0"
edition = "2021"
publish = false
license = "AGPL-3.0"
authors = ["eK@nonos.systems"]
description = "NONOS userland virtio-scsi driver capsule"

[[bin]]
name = "driver_virtio_scsi"
path = "src/main.rs"

[dependencies]
nonos_libc = { package = "nonos_userland_libc", path = "../libc" }
nonos_virtio = { path = "../nonos_virtio" }
nonos_scsi = { path = "../nonos_scsi" }
nonos_scsi_serve = { path = "../nonos_scsi_serve" }

[profile.release]
panic = "abort"
opt-level = 2
lto = false
debug = false
strip = true
