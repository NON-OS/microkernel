# What an anonymity transport reports about its route, and what may be
# concluded from it. Pure and dependency free: net.anon and net.nym encode a
# report, the attest service checks who sent it and keeps it, and About decides
# from it, with every rule proven on the host by route_proof_proofs.
[package]
name = "nonos_route_proof"
version = "0.1.0"
edition = "2021"
publish = false
license = "AGPL-3.0"
authors = ["eK@nonos.systems"]
description = "NONOS anonymity route reports and their verdicts"

[lib]
path = "src/lib.rs"

