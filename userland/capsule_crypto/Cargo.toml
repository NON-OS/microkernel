# NONOS userland: capsule_crypto
# eK@nonos.systems
#
# Shared crypto-service capsule. Owns hashing today (BLAKE3, SHA3-256);
# symmetric/AEAD and asymmetric/PQC ops fold in as later slices. Each
# op is cap-gated at the kernel-side client; the capsule itself never
# sees a caller-supplied authority.

[package]
name = "nonos_capsule_crypto"
version = "0.3.0"
edition = "2021"
publish = false
license = "AGPL-3.0"
authors = ["eK@nonos.systems"]
description = "NONOS crypto-service capsule (hashing first)"

[[bin]]
name = "crypto"
path = "src/main.rs"

[dependencies]
nonos_libc = { package = "nonos_userland_libc", path = "../libc" }
blake3 = { version = "1.0", default-features = false }
sha2   = { version = "0.10", default-features = false, features = ["force-soft", "oid"] }
sha3   = { version = "0.10", default-features = false }
digest = { version = "0.10", default-features = false }
aead   = { version = "0.5", default-features = false, features = ["alloc"] }
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
aes-gcm          = { version = "0.10", default-features = false, features = ["alloc", "aes"] }
ed25519-dalek    = { version = "2.1.1", default-features = false, features = ["alloc", "zeroize"] }
x25519-dalek     = { version = "2", default-features = false, features = ["static_secrets", "zeroize"] }
p256             = { version = "0.13", default-features = false, features = ["ecdsa"] }
p384             = { version = "0.13", default-features = false, features = ["ecdsa"] }
rsa              = { version = "0.9", default-features = false, features = ["sha2"] }

[profile.release]
panic    = "abort"
opt-level = 2
lto      = false
debug    = false
strip    = true

# blake3 reaches for hand written SIMD outside x86_64 and builds it with cc,
# which wants a C compiler targeting the capsule triple. There is none, so take
# the portable implementation there.
[target.'cfg(not(target_arch = "x86_64"))'.dependencies]
blake3 = { version = "1.0", default-features = false, features = ["pure"] }

[profile.dev]
panic    = "abort"
opt-level = 0
debug    = true
