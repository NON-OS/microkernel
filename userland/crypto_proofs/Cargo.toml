# NONOS Operating System
# Copyright (C) 2026 NONOS Contributors
#
# Host-runnable known-answer proofs for the kernel crypto primitives. Builds for
# the host so `cargo test` checks the real `src/crypto` code (included via
# #[path]) against official RFC/NIST test vectors, without a boot.
[package]
name = "crypto_proofs"
version = "0.3.0"
edition = "2021"

[lib]
path = "src/lib.rs"

[dependencies]
# Ed25519's precomputed-table init uses `spin::Once`; the ZK verifier holds a
# `spin::Mutex`. Same crate/version the kernel and net capsules pin.
spin = { version = "0.9", default-features = false, features = ["once", "mutex", "spin_mutex"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }
