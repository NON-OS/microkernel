# Proofs for agentproof_receipt: receipts made whole by the fixture, signed
# by a P-256 attestation key the proofs hold (nsh_attest_proofs' own
# builders, mounted), and each refusal shown by changing one thing.

[package]
name = "agentproof_receipt_proofs"
version = "0.1.0"
edition = "2021"
publish = false
license = "AGPL-3.0"

[lib]
path = "src/lib.rs"

[dependencies]
agentproof_receipt = { path = "../agentproof_receipt" }
agentproof_policy = { path = "../agentproof_policy" }
nonos_linux_policy = { path = "../nonos_linux_policy" }
nonos_proof_abi = { path = "../nonos_proof_abi" }
nsh_attest = { path = "../nsh_attest", features = ["proofs"] }
nsh_crypto = { path = "../nsh_crypto" }
nsh_wire = { path = "../nsh_wire" }
nonos_hash = { path = "../nonos_hash" }
nonos_ed25519 = { path = "../nonos_ed25519" }
nonos-mldsa65 = { path = "../../nonos-mldsa65" }
blake3 = { version = "1.5", default-features = false, features = ["pure"] }
