#
# Host proofs that the kernel's post-quantum samplers draw only from the
# seeded RNG: SPHINCS+, NTRU and McEliece key generation, signing and
# encapsulation refuse when it cannot answer. The kernel's own files are
# mounted by #[path]; only the RNG stands in.

[package]
name = "pqc_rng_proofs"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
path = "src/lib.rs"

# The samplers do real work; the tests run them optimised.
[profile.test]
opt-level = 2
