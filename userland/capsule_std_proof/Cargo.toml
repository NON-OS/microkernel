[package]
name = "nonos_capsule_std_proof"
version = "0.3.0"
edition = "2021"
publish = false
license = "AGPL-3.0"
authors = ["eK@nonos.systems"]
description = "Proof capsule: an unmodified crates.io crate on NONOS via the std PAL"

[[bin]]
name = "std_proof"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
serde_json = "1"

[profile.release]
panic = "abort"
opt-level = "z"
lto = true
codegen-units = 1
debug = false
strip = true
