#
# Host-runnable proofs for net.l2's request header decode. Builds for the
# host so `cargo test` runs the real decode and reply source (included via
# #[path]) against any bytes a client can send, over the net proofs' stand-in
# nonos_libc, which keeps each reply.
[package]
name = "l2_proofs"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
nonos_libc = { package = "net_proofs_shim", path = "../net_proofs/shim" }
