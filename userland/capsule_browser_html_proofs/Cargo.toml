# Host-runnable proofs for the browser's HTML parser. This crate builds for the
# host so `cargo test` runs the capsule's own tokenizer and tree builder
# (included via #[path]) against hostile input, the tokenizer states, the tree
# construction modes and fragment parsing, with no boot and no renderer.
[package]
name = "capsule_browser_html_proofs"
version = "0.1.0"
edition = "2021"

[lib]
path = "src/lib.rs"

