# NØNOS userland: capsule_linux
# eK@nonos.systems
#
# The Linux personality. Hosts unmodified Linux binaries in processes
# that hold no NONOS capabilities, and answers every syscall they make.
# The kernel holds no Linux knowledge: the numbers, the structs, the
# errnos and the filesystem view all live here, so this capsule can be
# replaced or revoked without touching ring 0.

[package]
name = "nonos_capsule_linux"
version = "0.1.0"
edition = "2021"
publish = false
license = "AGPL-3.0"
authors = ["eK@nonos.systems"]
description = "NONOS Linux personality: hosts Linux binaries outside the trusted computing base"

[[bin]]
name = "linux"
path = "src/main.rs"

[features]
# The self-test's deliberate panic (src/linux/selftest_panic.rs). Never on by
# default: only the selftest development image turns it on, in its own copy
# of the tree (tools/nonos-dev-image), and scripts/check_selftest_panic.py
# fails any committed build that names it.
selftest-panic = []
# A development image's Linux personality (docs/build/dev-mirror.md): a mirror
# on the local network, dialled directly by address, which no release build
# carries. Every other build sends every download over nonos_route_link.
dev-mirror = []

[dependencies]
nonos_libc = { package = "nonos_userland_libc", path = "../libc" }
nonos_app_skeleton = { path = "../app_skeleton", default-features = false }
nonos_inflate = { path = "../inflate" }
nonos_hash = { path = "../nonos_hash" }
nonos_tls = { path = "../nonos_tls" }
nonos_openpgp = { path = "../openpgp" }
nonos_ed25519 = { path = "../nonos_ed25519" }
nonos_zstd = { path = "../zstd" }
nonos_xz = { path = "../xz" }
# The network the person chose, read the way every capsule holding Network
# reads it: a guest's stream follows it (src/linux/net/guest_route.rs).
nonos_route_link = { path = "../nonos_route_link" }
sha1 = { version = "0.10", default-features = false }
blake3 = { version = "1", default-features = false, features = ["pure"] }
# The box each guest runs in, as its publisher signed it (src/linux/app).
nonos_linux_policy = { path = "../nonos_linux_policy" }

[profile.release]
panic = "abort"
opt-level = 2
lto = false
debug = false
strip = true

[profile.dev]
panic = "abort"
