[package]
name = "nonos_app_skeleton"
version = "0.3.0"
edition = "2021"
publish = false
license = "AGPL-3.0"
authors = ["eK@nonos.systems"]
description = "NONOS userland app client framework"

[lib]
name = "nonos_app_skeleton"
path = "src/lib.rs"

[features]
# `runtime` exposes `runner::run`, the no_std entry that owns heap bring-up
# and the CPL=3 frame loop. no_std capsules keep it (default); std capsules
# built through the NONOS PAL disable it and drive `run_loop` themselves.
default = ["runtime"]
runtime = ["nonos_libc/heap", "nonos_libc/panic-handler", "nonos_toolkit/runtime"]

[dependencies]
nonos_libc = { package = "nonos_userland_libc", path = "../libc", default-features = false }
nonos_toolkit = { path = "../toolkit", default-features = false }
