# NONOS userland: capsule_terminal
# eK@nonos.systems
#
# Line buffer with a fixed scrollback ring. Owned state, no globals.
# Keyboard input (printable, Backspace, Enter, Esc). Real production
# capsule built on `nonos_app_skeleton`.

[package]
name = "nonos_terminal"
version = "0.3.0"
edition = "2021"
publish = false
license = "AGPL-3.0"
authors = ["eK@nonos.systems"]
description = "NONOS terminal capsule"

[[bin]]
name = "terminal"
path = "src/main.rs"

[features]
# Self-test build: once vfs answers, auto-run the unproven shell paths
# (echo, vfs round trip, pipe, statement gating) and emit graded
# [TERMINAL-TEST] serial markers for the boot harness.
nonos-autorun-selftest = []

[dependencies]
nonos_libc = { package = "nonos_userland_libc", path = "../libc" }
nonos_app_skeleton = { path = "../app_skeleton" }
nonos_inflate = { path = "../inflate" }
nonos_base64 = { path = "../base64" }
nonos_git = { path = "../nonos_git" }
nonos_http = { path = "../nonos_http" }
nonos_policy_proto = { path = "../policy_proto" }
nonos_socket = { path = "../nonos_socket" }
nonos_tls = { path = "../nonos_tls" }
nonos_toolkit = { path = "../toolkit", default-features = false }

[profile.release]
panic = "abort"
opt-level = 2
lto = false
debug = false
strip = true

[profile.dev]
panic = "abort"
opt-level = 0
debug = true
