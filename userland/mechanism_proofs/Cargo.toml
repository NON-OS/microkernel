# NONOS Operating System
# Copyright (C) 2026 NONOS Contributors
#
# Host-runnable proofs for kernel mechanisms whose Lean models are being bound
# to the code that runs them. Each module includes the real Rust via #[path]
# and checks it against the properties the Lean model states, differentially
# with cargo test and exhaustively with Kani.
[package]
name = "mechanism_proofs"
version = "0.3.0"
edition = "2021"

[lib]
path = "src/lib.rs"

[dependencies]
# The capsule allocators wrap this one, and `heap` includes their real source
# to check that a freed block is left unreadable. Same version the capsules pin.
linked_list_allocator = { version = "0.10", default-features = false, features = [
    "use_spin",
] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }
