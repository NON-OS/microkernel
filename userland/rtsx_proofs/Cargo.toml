# NONOS Operating System
# Copyright (C) 2026 NONOS Contributors
#
# Host-runnable proofs for the Realtek PCIe card reader driver: the shipped
# register, chip, wire and SD modules, and the engine, card, setup and
# block-service flows over a modelled reader, run here through #[path].
[package]
name = "rtsx_proofs"
version = "0.3.0"
edition = "2021"

[lib]
path = "src/lib.rs"

[dependencies]
# The included driver files name nonos_libc; on the host that is the shim.
nonos_libc = { package = "rtsx_proofs_libc_shim", path = "libc_shim" }
