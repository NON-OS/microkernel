# NONOS userland: capsule_driver_bga
# eK@nonos.systems
#
# Bochs/QEMU standard-VGA (BGA) display capsule. Drives a real PCI
# display device through the Mk syscall ABI only: broker device
# discovery/claim, PCI bus mastering, MMIO map of the register BAR
# and the linear framebuffer BAR, and VBE DISPI mode setting. No
# kernel driver imports. Scanout-provider peer to GOP and virtio-gpu.

[package]
name = "nonos_capsule_driver_bga"
version = "0.3.0"
edition = "2021"
publish = false
license = "AGPL-3.0"
authors = ["eK@nonos.systems"]
description = "NONOS userland Bochs/QEMU stdvga (BGA) display driver capsule"

[[bin]]
name = "driver_bga"
path = "src/main.rs"

[dependencies]
nonos_libc = { package = "nonos_userland_libc", path = "../libc" }

[profile.release]
panic = "abort"
opt-level = 2
lto = false
debug = false
strip = true
