# NONOS Operating System
# Copyright (C) 2026 NONOS Contributors
#
# Host-runnable proofs for nonos_bt_hogp: GATT discovery and configuration
# against a simulated HID peripheral's attribute database, every refusal on
# its own input, the boot report decoding, and the lock LEDs.
[package]
name = "nonos_bt_hogp_proofs"
version = "0.3.0"
edition = "2021"
publish = false
license = "AGPL-3.0"

[lib]
path = "src/lib.rs"

[dependencies]
nonos_bt_hogp = { path = "../nonos_bt_hogp" }
nonos_bt_wire = { path = "../nonos_bt_wire" }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }
