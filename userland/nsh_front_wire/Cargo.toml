#
# The IPC wire between nsh.front (Network, no AttestRead) and nsh.attest
# (AttestRead, no Network). nsh.front relays a per-handshake 32-byte
# attestation challenge; nsh.attest answers with the kernel's NONOSATT v5
# document (bound to that challenge) and the registry entries. A sans-IO
# header codec with no dependencies, shared by both capsules so the format
# cannot drift between them.

[package]
name = "nsh_front_wire"
version = "0.1.0"
edition = "2021"
publish = false
license = "AGPL-3.0"
authors = ["eK@nonos.systems"]
description = "NONOS nsh.front <-> nsh.attest IPC wire"

[lib]
crate-type = ["rlib"]
