# NONOS Operating System
# Copyright (C) 2026 NONOS Contributors
#
# Host-runnable proofs for the boot splash: its canvas painted whole over
# whatever was there, the attestation panel's lines from the boot's record,
# the layout, the no-IOMMU warning, the status line and the canvas follow.
# Builds for the host so `cargo test` runs the splash's own source (included
# via #[path]).
[package]
name = "boot_splash_proofs"
version = "0.3.0"
edition = "2021"

[lib]
path = "src/lib.rs"

[dependencies]
# The status line's font, as the splash draws it.
nonos_toolkit = { path = "../toolkit", default-features = false }
