#
# Host-runnable proofs for the boot splash's firmware-logo path. Builds for
# the host so `cargo test` exercises the splash's own logo source (included
# via #[path]): the record and file are read only within their bounds, the
# logo is turned and placed as the firmware showed it, and drawing never
# writes outside the surface.
[package]
name = "boot_splash_proofs"
version = "0.3.0"
edition = "2021"

[lib]
path = "src/lib.rs"

[dependencies]
