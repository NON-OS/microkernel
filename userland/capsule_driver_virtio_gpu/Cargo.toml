# NONOS userland: capsule_driver_virtio_gpu
# eK@nonos.systems
#
# Virtio GPU display-controller capsule. Owns the virtio-gpu PCI
# claim, MMIO register window, IRQ, and control-queue DMA. Compositor
# and window policy stay in separate userland capsules.

[package]
name = "nonos_capsule_driver_virtio_gpu"
version = "0.3.0"
edition = "2021"
publish = false
license = "AGPL-3.0"
authors = ["eK@nonos.systems"]
description = "NONOS userland virtio-gpu driver capsule"

[[bin]]
name = "driver_virtio_gpu"
path = "src/main.rs"

[dependencies]
nonos_libc = { package = "nonos_userland_libc", path = "../libc" }
nonos_virtio = { path = "../nonos_virtio" }
# The display wire: its bodies and errors, the server core with the
# EDID panel, and the primaries' memory.
nonos_gfx_pool = { path = "../nonos_gfx_pool" }
nonos_gfx_serve = { path = "../nonos_gfx_serve" }
nonos_gfx_wire = { path = "../nonos_gfx_wire" }

[profile.release]
panic = "abort"
opt-level = 2
lto = false
debug = false
strip = true
