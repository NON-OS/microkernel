# NONOS Operating System
# Copyright (C) 2026 NONOS Contributors
#
# Host-runnable proofs for the e1000 driver's device-facing descriptor rings
# and untrusted protocol input. Builds for the host so `cargo test` runs the
# real driver source (included via #[path]) against hostile descriptors,
# without a boot.
[package]
name = "e1000_proofs"
version = "0.3.0"
edition = "2021"

[lib]
path = "src/lib.rs"

[dependencies]
nonos_devmodel = { path = "../nonos_devmodel" }
nonos_mac = { path = "../nonos_mac" }
nonos_libc = { package = "e1000_proofs_libc_shim", path = "libc_shim" }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }
