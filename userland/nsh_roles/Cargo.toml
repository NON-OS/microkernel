# The nsh/1 role table and grant checks (docs/design/nsh-v1-roles.md): the
# signed role table and revocation list a host installs, the three roles
# shipped, and every check a host runs on a login and on an escalation.
# Times come from the caller; nothing here reads a clock.

[package]
name = "nsh_roles"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0"

[lib]
crate-type = ["rlib"]

[dependencies]
nonos_ed25519 = { path = "../nonos_ed25519" }
nonos_hash = { path = "../nonos_hash" }
nonos-mldsa65 = { path = "../../nonos-mldsa65" }
nsh_crypto = { path = "../nsh_crypto" }
nsh_wire = { path = "../nsh_wire" }
