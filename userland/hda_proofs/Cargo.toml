# NONOS Operating System
# Copyright (C) 2026 NONOS Contributors
#
# Host-runnable proofs for the Intel HD Audio capsule's controller path: the
# CORB/RIRB ring bring-up, the global reset, the codec command interfaces and
# the output stream descriptor. Builds for the host so `cargo test` runs the
# real driver source (included via #[path]) against a register window in
# memory, with a device model answering it from another thread.
[package]
name = "hda_proofs"
version = "0.1.0"
edition = "2021"

[lib]
path = "src/lib.rs"

[dependencies]
nonos_libc = { package = "hda_proofs_libc_shim", path = "libc_shim" }
nonos_devmodel = { path = "../nonos_devmodel" }

[features]
# The included PCM queue keeps a length accessor for the capsule's smoke-test
# build only. Named here so the cfg on it is a known one; never turned on.
nonos-driver-hda-smoketest = []
