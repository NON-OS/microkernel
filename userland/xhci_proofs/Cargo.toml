# NONOS Operating System
# Copyright (C) 2026 NONOS Contributors
#
# Host-runnable proofs for the xHCI driver's TRB encodings and untrusted
# protocol input. Builds for the host so `cargo test` runs the real driver
# source (included via #[path]) against the xHCI specification layouts,
# without a boot.
[package]
name = "xhci_proofs"
version = "0.3.0"
edition = "2021"

[lib]
path = "src/lib.rs"

[dependencies]
nonos_devmodel = { path = "../nonos_devmodel" }
# The included controller files name nonos_libc; on the host that is the shim.
nonos_libc = { package = "xhci_proofs_libc_shim", path = "libc_shim" }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }
