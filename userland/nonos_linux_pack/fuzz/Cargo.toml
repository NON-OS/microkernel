# Fuzz target for the pack parser, whose input is a store object any
# capsule holding the store could have written. Run with:
# cargo +nightly-2026-01-16 fuzz run pack_parse
# Seeds: python3 tools/nonos-pack-seeds writes them (they are not kept here).

[package]
name = "nonos_linux_pack-fuzz"
version = "0.0.0"
edition = "2021"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
nonos_linux_pack = { path = ".." }

[[bin]]
name = "pack_parse"
path = "fuzz_targets/pack_parse.rs"
test = false
doc = false
bench = false

[workspace]
