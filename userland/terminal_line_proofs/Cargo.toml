# NONOS Operating System
# Copyright (C) 2026 NONOS Contributors
#
# Host-runnable proofs for the terminal and the text editor: line editing,
# history expansion, command suggestion, pipeline filters, grep highlighting,
# tree rendering, the help tables, and the editor's go-to-line arithmetic.
# Builds for the host so `cargo test` drives the real capsule sources, included
# via `#[path]`, through the input a person actually gives them.
[package]
name = "terminal_line_proofs"
version = "0.1.0"
edition = "2021"
publish = false
license = "AGPL-3.0-or-later"

[lib]
path = "src/lib.rs"
