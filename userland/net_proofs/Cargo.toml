# Host-runnable proofs for the network capsules' untrusted-input parsers. Builds
# for the host so `cargo test` runs the real parser source (included via
# #[path]) against adversarial packets, without a boot.
[package]
name = "net_proofs"
version = "0.3.0"
edition = "2021"

[lib]
path = "src/lib.rs"

[dependencies]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }
