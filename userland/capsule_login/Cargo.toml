[package]
name = "nonos_capsule_login"
version = "0.3.0"
edition = "2021"
publish = false

[[bin]]
name = "login"
path = "src/main.rs"

[dependencies]
nonos_libc = { package = "nonos_userland_libc", path = "../libc" }
# The lock screen draws in the theme's roles and follows the theme chosen in
# Settings the way the desktop shell does.
nonos_toolkit = { path = "../toolkit", default-features = false }
nonos_app_skeleton = { path = "../app_skeleton", default-features = false }

[features]
default = []
