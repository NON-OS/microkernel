# NONOS userland: capsule_snake
#
# Arcade snake on a 35x21 grid. Owned state, no globals. Keyboard
# input (arrows/WASD steer, Space/P pause, Enter restarts) plus pointer.
# Real production capsule built on `nonos_app_skeleton`.

[package]
name = "nonos_snake"
version = "0.3.0"
edition = "2021"
publish = false
license = "AGPL-3.0"
description = "NONOS snake game capsule"

[[bin]]
name = "snake"
path = "src/main.rs"

[dependencies]
nonos_libc = { package = "nonos_userland_libc", path = "../libc" }
nonos_app_skeleton = { path = "../app_skeleton" }
nonos_toolkit = { path = "../toolkit", default-features = false }

[profile.release]
panic = "abort"
opt-level = 2
lto = false
debug = false
strip = true

[profile.dev]
panic = "abort"
opt-level = 0
debug = true
