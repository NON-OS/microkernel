# NONOS userland: nonos_disk_map
# eK@nonos.systems
#
# Where a NONOS disk keeps what, in 512-byte sectors on every disk: the
# package store from LBA 256, the disk plan at 245760 with the key header
# after it, the data volume from 262144, and the store's container format.
# The installer that writes a disk and the vfs that reads and appends its
# store both take these from here. The kernel, the bootloader, the AHCI
# driver, fs_proofs and the host tools keep their own copies; the tests in
# this crate read each one's source and fail when a number differs.

[package]
name = "nonos_disk_map"
version = "0.1.0"
edition = "2021"
publish = false
license = "AGPL-3.0"
authors = ["eK@nonos.systems"]
description = "Fixed LBAs and the package store format of a NONOS disk"

[package.metadata.nonos]
test-lane = true

