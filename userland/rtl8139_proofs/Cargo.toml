# NONOS Operating System
# Copyright (C) 2026 NONOS Contributors
#
# Host-runnable proofs for the RTL8139 driver's RX ring primitives and
# untrusted protocol input. Builds for the host so `cargo test` runs the real
# driver source (included via #[path]) against hostile offsets and lengths,
# without a boot.
[package]
name = "rtl8139_proofs"
version = "0.3.0"
edition = "2021"

[lib]
path = "src/lib.rs"

[dependencies]
# The bring-up proofs: the station address is drawn through nonos_mac, and
# the port I/O, entropy and release calls are answered by the shim.
nonos_mac = { path = "../nonos_mac" }
nonos_libc = { package = "rtl8139_proofs_libc_shim", path = "libc_shim" }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }
