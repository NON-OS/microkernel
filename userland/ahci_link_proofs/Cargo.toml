# Host-runnable proofs for the AHCI driver. Builds for the host so `cargo test`
# exercises the real driver source (included via #[path]) that decides when a
# SATA link is established and a device is ready, which disk is served, what
# an IDENTIFY block may say, what a command may name, and when it is done.
[package]
name = "ahci_link_proofs"
version = "0.3.0"
edition = "2021"

[lib]
path = "src/lib.rs"

[dependencies]
