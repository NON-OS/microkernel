#
# Host proofs of the kernel's capsule-load bound: a capsule started on a
# parent's behalf never holds a capability the parent lacks, unless the
# parent is a launcher. The kernel's bound and capability table are
# mounted by #[path]; only the process table, the serial line, the
# manifest and the attested parent stand in.

[package]
name = "spawn_bound_proofs"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
path = "src/lib.rs"
