#
# Host proofs that the kernel's secret-making callers draw only from the
# seeded RNG and refuse when it cannot answer: the sealed sector's nonce,
# ramfs and cryptofs keys, salts and nonces, the data volume's keys, the
# session accounts and tokens, the key store, the stack canary, the ASLR
# slide, the capability engine and the quantum pool. The kernel's own files
# are mounted by #[path]; the RNG, locks' neighbours, the clock, the log and
# the devices stand in.

[package]
name = "rng_callers_proofs"
version = "0.1.0"
edition = "2021"
publish = false
build = "build.rs"

[lib]
path = "src/lib.rs"

[dependencies]
# The kernel's lock primitive, as the mounted files name it.
spin = { version = "0.9", default-features = false, features = ["mutex", "spin_mutex", "rwlock", "once"] }

# Named by the self-test file; never on here, as the unvetted checks are
# not mounted.
[features]
pqc-unvetted = []

# PBKDF2, the password hash and Argon2id do real work; run them optimised.
[profile.test]
opt-level = 2
