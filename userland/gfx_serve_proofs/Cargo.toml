# NONOS Operating System
# Copyright (C) 2026 NONOS Contributors
#
# Host-runnable proofs for nonos_gfx_serve. Builds for the host so `cargo
# test` runs the shipping server core (included via #[path]) against a VRAM
# device model and a model of the surface registry and display pool.
[package]
name = "gfx_serve_proofs"
version = "0.1.0"
edition = "2021"

[lib]
path = "src/lib.rs"

[dependencies]
nonos_gfx_wire = { path = "../nonos_gfx_wire" }
nonos_edid = { path = "../nonos_edid" }
