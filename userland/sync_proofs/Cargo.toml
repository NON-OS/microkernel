# Host-runnable proofs for the kernel synchronisation primitives. Builds for the
# host so `cargo test` runs the real semaphore and seqlock arithmetic (included
# via #[path]) against the properties the Lean models state, without a boot.
[package]
name = "sync_proofs"
version = "0.3.0"
edition = "2021"

[lib]
path = "src/lib.rs"

[dependencies]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }
