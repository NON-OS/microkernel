[package]
name = "nonos_openpgp"
version = "0.1.0"
edition = "2021"
authors = ["NONOS Contributors"]
license = "AGPL-3.0"
description = "OpenPGP v4 detached signature verification for NONOS userland"

[lib]
name = "nonos_openpgp"
path = "src/lib.rs"

[dependencies]
nonos_hash = { path = "../nonos_hash" }
sha1 = { version = "0.10", default-features = false }

[dev-dependencies]
nonos_ed25519 = { path = "../nonos_ed25519" }
