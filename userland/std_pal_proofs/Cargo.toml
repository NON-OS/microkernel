# Host-runnable proofs for the std platform layer's register code
# (toolchain/nonos-std/sys/pal/nonos/thread_regs.rs, mounted via #[path]):
# its thread trampoline entered on a fresh stack the way the kernel enters a
# spawned thread, on x86_64 and, under qemu-user, on aarch64 and riscv64.
[package]
name = "std_pal_proofs"
version = "0.1.0"
edition = "2021"

[lib]
path = "src/lib.rs"

