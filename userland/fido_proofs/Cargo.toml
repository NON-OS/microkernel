#
# Host-runnable proofs for the FIDO2 security key driver: the shipped
# key finding, CTAPHID framing, channel INIT and request job run here through
# #[path].
[package]
name = "fido_proofs"
version = "0.1.0"
edition = "2021"

[lib]
path = "src/lib.rs"

[dependencies]
nonos_usbnet = { package = "usbnet_proofs", path = "../usbnet_proofs" }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }
