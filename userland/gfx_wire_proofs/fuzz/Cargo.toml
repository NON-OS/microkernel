# Fuzz targets for the NVGP wire between the compositor and a display
# driver: gfx_request reads frames as a driver and replies as the
# compositor; gfx_body reads every body either side sends. And
# compositor_requests, every request body a client sends the compositor,
# OP_LAYER_CONTENT's held word for word. Run with:
# cargo +nightly-2026-01-16 fuzz run gfx_request (or gfx_body, compositor_requests)

[package]
name = "gfx_wire_proofs-fuzz"
version = "0.0.0"
edition = "2021"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
compositor_proofs = { path = "../../compositor_proofs" }
gfx_wire_proofs = { path = ".." }
nonos_modes = { path = "../../nonos_modes" }

[[bin]]
name = "gfx_request"
path = "fuzz_targets/gfx_request.rs"
test = false
doc = false
bench = false

[[bin]]
name = "gfx_body"
path = "fuzz_targets/gfx_body.rs"
test = false
doc = false
bench = false

[[bin]]
name = "compositor_requests"
path = "fuzz_targets/compositor_requests.rs"
test = false
doc = false
bench = false

[workspace]
