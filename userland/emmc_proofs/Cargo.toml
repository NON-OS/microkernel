# NONOS Operating System
# Copyright (C) 2026 NONOS Contributors
#
# Host-runnable proofs for the eMMC driver. Builds for the host so `cargo test`
# exercises the real driver source (included via #[path]): the SDHCI command,
# transfer mode, clock, voltage and ADMA2 decisions, the card register
# parsers, and the whole bring-up and block path driven against a register
# level model of an SDHCI host with an eMMC device on it.
[package]
name = "emmc_proofs"
version = "0.1.0"
edition = "2021"

[lib]
path = "src/lib.rs"

[dependencies]
# The capsule side of the block wire, which the mounted protocol module
# re-exports.
nonos_blk_wire = { path = "../nonos_blk_wire" }
# The platform glue's broker calls, logged with the model's state at each one.
nonos_libc = { package = "ahci_proofs_libc_shim", path = "../ahci_link_proofs/libc_shim" }
