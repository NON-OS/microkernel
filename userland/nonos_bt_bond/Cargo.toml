# NONOS Operating System
# Copyright (C) 2026 NONOS Contributors
#
# Bonds for an LE-only host: the record a bonded peer is kept as (LTK, IRK,
# identity address), the record of this host's own IRK, the book that finds
# a bonded peer by its identity or by resolving its private address, and the
# timer that renews this host's private address (Vol 3, Part C, 10.7 and
# Appendix A; Vol 6, Part B, 1.3.2). The records are what the keyring is
# asked to keep; until it can, the book lives for one boot. no_std for the
# capsules; std under `cargo test` for the host proofs in nonos_bt_bond_proofs.
[package]
name = "nonos_bt_bond"
version = "0.1.0"
edition = "2021"
publish = false
license = "AGPL-3.0"

[lib]
path = "src/lib.rs"

[dependencies]
nonos_bt_smp = { path = "../nonos_bt_smp" }
nonos_bt_wire = { path = "../nonos_bt_wire" }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }
