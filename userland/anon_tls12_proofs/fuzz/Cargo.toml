# Fuzz target for net.anon's TLS 1.2 client: a whole handshake driven by
# whatever the "server" sends, and each message reader on its own. Run with:
#   cargo +nightly-2026-01-16 fuzz run anon_tls12 <corpus>
# seeding the corpus with the recorded OpenSSL flights in ../vectors.

[package]
name = "anon_tls12_proofs-fuzz"
version = "0.0.0"
edition = "2021"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
anon_tls12_proofs = { path = ".." }
nonos_libc = { package = "anon_tls12_proofs_shim", path = "../shim" }
nonos_tls = { package = "anon_tls12_proofs_tls", path = "../tls_shim" }

[[bin]]
name = "anon_tls12"
path = "fuzz_targets/anon_tls12.rs"
test = false
doc = false
bench = false

[workspace]
