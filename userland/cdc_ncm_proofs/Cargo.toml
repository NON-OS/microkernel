# NONOS Operating System
# Copyright (C) 2026 NONOS Contributors
#
# Host-runnable proofs for the CDC-NCM driver: the shipped ncm module runs
# here through #[path], binding a scripted device whose descriptors and NTB
# parameters are laid out as USB NCM 1.0 sections 5 and 6 give them, and
# moving NTBs built from section 3's layout through it, hostile ones too.
[package]
name = "cdc_ncm_proofs"
version = "0.3.0"
edition = "2021"

[lib]
path = "src/lib.rs"

[dependencies]
nonos_usbnet = { package = "usbnet_proofs", path = "../usbnet_proofs" }
# start.rs names nonos_libc for its settle pause; on the host that is the shim.
nonos_libc = { package = "xhci_proofs_libc_shim", path = "../xhci_proofs/libc_shim" }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }
