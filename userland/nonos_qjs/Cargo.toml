[package]
name = "nonos_qjs"
version = "0.3.0"
edition = "2021"
description = "QuickJS-ng embedded as a no_std JS engine for the NONOS browser capsule"

[lib]
crate-type = ["rlib"]

[dependencies]
libm = "0.2"

[build-dependencies]
cc = "1"

[features]
# Native host build for the render harness: the system libc supplies what the
# freestanding stub layers provide on the NONOS target.
hosted = []
