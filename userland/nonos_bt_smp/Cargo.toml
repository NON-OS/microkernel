# NONOS Operating System
# Copyright (C) 2026 NONOS Contributors
#
# The Security Manager Protocol for an LE-only host (Decision 21), LE Secure
# Connections only: the PDUs, the choice of pairing method, AES-CMAC and the
# f4, f5, f6 and g2 functions, and P-256 ECDH with the peer's key checked
# on the curve, each from Vol 3, Part H of the Bluetooth Core
# Specification. AES and AES-CMAC are the system's nonos_aes and P-256 is
# nonos_p256, the same two the Wi-Fi core uses. no_std for the capsules;
# std under `cargo test` for the host proofs in nonos_bt_smp_proofs.
[package]
name = "nonos_bt_smp"
version = "0.3.0"
edition = "2021"
publish = false
license = "AGPL-3.0"

[lib]
path = "src/lib.rs"

[dependencies]
nonos_aes = { path = "../nonos_aes" }
nonos_bt_wire = { path = "../nonos_bt_wire" }
nonos_p256 = { path = "../nonos_p256" }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }
