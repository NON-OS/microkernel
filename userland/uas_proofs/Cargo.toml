#
# Host-runnable proofs for nonos_uas: a UAS interface's pipes read from
# its configuration, the IUs' bytes, tags, and a command's exchange.
[package]
name = "uas_proofs"
version = "0.1.0"
edition = "2021"

[lib]
path = "src/lib.rs"

[dependencies]
nonos_uas = { path = "../nonos_uas" }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }
