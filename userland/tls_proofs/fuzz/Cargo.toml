# Fuzz targets for the TLS stack's parsers of server bytes: the DER walker,
# the certificate field readers, the chain check, record framing and the
# server hello. Run one with: cargo +nightly-2026-01-16 fuzz run <target>

[package]
name = "tls_proofs-fuzz"
version = "0.0.0"
edition = "2021"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
tls_proofs = { path = ".." }

[[bin]]
name = "tls_cert"
path = "fuzz_targets/tls_cert.rs"
test = false
doc = false
bench = false

[[bin]]
name = "tls_record"
path = "fuzz_targets/tls_record.rs"
test = false
doc = false
bench = false

[workspace]
