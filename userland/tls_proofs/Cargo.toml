# NONOS Operating System
# Copyright (C) 2026 NONOS Contributors
#
# Host-runnable proofs for the TLS client. Builds for the host so `cargo test`
# runs the real nonos_tls source (included via #[path]) against bytes captured
# from a live Anyone relay, the RFC 8448 handshake trace, and the certificate
# chain a re-signing gateway served. The crate had no tests of any kind before
# this, and five capsules depend on it.
#
# nonos_libc is a host stand-in that answers every crypto call with the crypto
# capsule's own handlers, so signatures are verified by the pool's code.
[package]
name = "tls_proofs"
version = "0.1.0"
edition = "2021"

[lib]
path = "src/lib.rs"

[dependencies]
nonos_libc = { package = "tls_proofs_shim", path = "shim" }
nonos_route_link = { package = "tls_proofs_route_shim", path = "route_shim" }
sha2 = { version = "0.10", default-features = false, features = ["force-soft"] }
hmac = { version = "0.12", default-features = false }
chacha20poly1305 = { version = "0.10", default-features = false }
p256 = { version = "0.13", default-features = false, features = ["arithmetic", "ecdh"] }

# The played TLS server in tests/fake_server.rs signs its CertificateVerify.
[dev-dependencies]
p256 = { version = "0.13", default-features = false, features = ["arithmetic", "ecdsa"] }

# Runs that leave the host, on demand only, never part of the proof run.
[features]
# Dials live Anyone relays over the internet (tests/live_relay.rs).
live-relays = []
# Rewrites fixtures/openssl_tls12_alert.tls from a local openssl s_server.
record-fixtures = []
# The roots as a development build of nonos_tls holds them, the local test
# chain's throwaway root among them (src/tests/dev_root_trust.rs).
devnet = []

# The proofs again with devnet on, so a development build's roots are proved
# too (src/tests/dev_root_trust.rs). cargo test only; it ships nothing.
[package.metadata.nonos]
feature-lanes = ["devnet"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }
