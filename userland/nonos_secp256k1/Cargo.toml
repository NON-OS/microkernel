#
# secp256k1 for userland. The same arithmetic that was in the kernel, moved out
# of ring 0: it had no in-kernel caller and existed only to answer syscalls for
# the wallet. no_std, and dependent only on nonos_hd for SHA-256, which RFC 6979
# needs and which is already proven against the standard vectors.
[package]
name = "nonos_secp256k1"
version = "0.1.0"
edition = "2021"
publish = false
license = "AGPL-3.0-or-later"

[lib]
path = "src/lib.rs"

[dependencies]
nonos_hd = { path = "../nonos_hd" }
