[package]
name = "nonos_capsule_driver_gpio"
version = "0.3.0"
edition = "2021"
license = "AGPL-3.0-or-later"
publish = false
authors = ["eK@nonos.systems"]
description = "NONOS userland x86 GPIO controller capsule"

[[bin]]
name = "driver_gpio"
path = "src/main.rs"

[dependencies]
nonos_libc = { package = "nonos_userland_libc", path = "../libc" }
nonos_gpio = { path = "../nonos_gpio" }

[profile.release]
panic = "abort"
strip = true
codegen-units = 1
lto = true
