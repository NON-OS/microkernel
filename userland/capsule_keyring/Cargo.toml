# NONOS userland: capsule_keyring
# eK@nonos.systems
#
# Real keyring as a userland capsule. Owns per-key storage with owner
# enforcement, type tagging, and lock/unlock semantics. State is
# capsule-bounded; respawn = empty keyring by design.

[package]
name = "nonos_capsule_keyring"
version = "0.3.0"
edition = "2021"
publish = false
license = "AGPL-3.0"
authors = ["eK@nonos.systems"]
description = "NONOS keyring capsule, userland key store"

[[bin]]
name = "keyring"
path = "src/main.rs"

[dependencies]
nonos_libc = { package = "nonos_userland_libc", path = "../libc" }
nonos_hd = { path = "../nonos_hd" }

[profile.release]
panic = "abort"
opt-level = 2
lto = false
debug = false
strip = true

[profile.dev]
panic = "abort"
opt-level = 0
debug = true
