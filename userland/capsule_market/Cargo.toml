# NONOS userland: capsule_market
# eK@nonos.systems
#
# Read-only marketplace index capsule. Parses a signed
# `MarketplaceIndex` blob, refuses unsigned indexes by default,
# serves discovery queries (list_apps / get_app / get_release) and
# the install-readiness verdict over the `market.index` IPC
# endpoint. Holds no install or payment logic; that lives in
# capsule_installer and capsule_payment respectively.

[package]
name = "nonos_capsule_market"
version = "0.3.0"
edition = "2021"
publish = false
license = "AGPL-3.0"
authors = ["eK@nonos.systems"]
description = "NONOS marketplace capsule, userland index authority"

[[bin]]
name = "market"
path = "src/main.rs"

[dependencies]
nonos_ed25519 = { path = "../nonos_ed25519" }
nonos_libc = { package = "nonos_userland_libc", path = "../libc" }
nonos_marketplace_abi = { path = "../marketplace_abi" }

[features]
default = []
# Replaces the default `CryptoVerifier`, which verifies in this
# process with nonos_ed25519, with `RejectAll`. Every signed index
# ends up refused, which keeps install readiness honest in a build
# that is meant to accept nothing.
offline-verify = []
[profile.release]
panic = "abort"
opt-level = 2
lto = false
debug = false
strip = true

# Matches every sibling capsule. Without it `cargo check` on the host fails
# with "unwinding panics are not supported without std", so this crate could
# not be checked outside a target build.
[profile.dev]
panic = "abort"
opt-level = 0
debug = true
