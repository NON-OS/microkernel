#
# Host-runnable proofs for nonos_edid. Builds for the host so `cargo test`
# runs the shipping parser (included via #[path]) over EDIDs built in the
# tests, every hostile length and count, and the loader's own parse.
[package]
name = "edid_proofs"
version = "0.1.0"
edition = "2021"

[lib]
path = "src/lib.rs"
