#
# The nsh/1 client's check of a host's attestation (docs/design/nsh-v1-attest.md
# and docs/design/k1-attest-doc-v4.md): the NONOSATT version 4 document, the
# TPM quote and its P-256 signature, the TCG event log replayed to the PCRs,
# the enrolment certificate, and the client policy. Each step refuses with its
# own name. P-256 is the kernel's own arithmetic, compiled from the kernel
# source; ML-DSA-65, Ed25519 and SHA-2 are the crates the tree already uses.

[package]
name = "nsh_attest"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0"

[lib]
crate-type = ["rlib"]

[dependencies]
blake3 = { version = "1.5", default-features = false, features = ["pure"] }
nonos-mldsa65 = { path = "../../nonos-mldsa65" }
nonos_ed25519 = { path = "../nonos_ed25519" }
nonos_hash = { path = "../nonos_hash" }
nsh_crypto = { path = "../nsh_crypto" }
nsh_wire = { path = "../nsh_wire" }
