# NONOS Operating System
# Copyright (C) 2026 NONOS Contributors
#
# Host-runnable proofs for nonos_gfx_pool, the memory behind every display
# driver's primaries. Builds for the host so `cargo test` runs the shipping
# source (included via #[path]) against a shim of the kernel's mapping and
# surface registry calls, and the shared wire sweep on the real pool.
[package]
name = "gfx_pool_proofs"
version = "0.1.0"
edition = "2021"
publish = false
license = "AGPL-3.0-or-later"

[lib]
path = "src/lib.rs"

[dependencies]
nonos_gfx_serve = { path = "../nonos_gfx_serve" }
nonos_gfx_wire = { path = "../nonos_gfx_wire" }
nonos_libc = { package = "gfx_pool_proofs_libc_shim", path = "libc_shim" }
