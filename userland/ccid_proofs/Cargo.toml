#
# Host-runnable proofs for the CCID smart-card reader driver: the shipped
# reader finding, bulk messages, exchange and slot memory run here through
# #[path].
[package]
name = "ccid_proofs"
version = "0.1.0"
edition = "2021"

[lib]
path = "src/lib.rs"

[dependencies]
nonos_usbnet = { package = "usbnet_proofs", path = "../usbnet_proofs" }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }
