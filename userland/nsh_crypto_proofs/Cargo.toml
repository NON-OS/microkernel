# Host proofs for nsh_crypto: the X-Wing exchange against the X-Wing
# specification's vectors; the transcript chain, the key schedule, the
# labels and the attestation challenge against values computed apart from
# the crate; and the sealed frames' order, direction, tamper and limits.

[package]
name = "nsh_crypto_proofs"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
nsh_crypto = { path = "../nsh_crypto", features = ["proofs"] }
nsh_wire = { path = "../nsh_wire" }
nonos_seal = { path = "../nonos_seal" }
