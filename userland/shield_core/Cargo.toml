# The NOX Shield wallet core, from NON-OS/shield-core at 210adf4, the Rust core
# both phone apps run: keys, notes, the chain mirror, deposits, spends and
# settlement, with its own tests and pinned vectors. What NONOS changes is the
# transport only: `net::tor` reaches the chosen anonymity network (Nym or
# Anyone) through nonos_route_link and speaks TLS through nonos_tls, where the
# phones run an embedded Tor. Everything else is the phones' code, so the
# capsule makes the same bytes the phones make.
[package]
name = "nonos_shield_core"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
publish = false

[lib]
name = "nox_shield_core"
path = "src/lib.rs"

[dependencies]
nonos-stark = { git = "https://github.com/NON-OS/STARKs.git", branch = "main", features = ["fri8", "parallel"] }
stark_proofs = { git = "https://github.com/NON-OS/STARKs.git", branch = "main", features = ["not_before", "parallel"] }
nox_prover = { git = "https://github.com/NON-OS/STARKs.git", branch = "main", features = ["not_before", "parallel"] }
# The prover proves on every core, as on the phones, through std threads.
rayon = "=1.12.0"
nox_verified = { path = "verified" }
nonos_hd = { path = "../nonos_hd" }
nonos_seal = { path = "../nonos_seal" }
blake3 = { version = "=1.8.7", default-features = false, features = ["pure"] }
getrandom = "=0.2.17"
x25519-dalek = { version = "=2.0.1", default-features = false, features = ["static_secrets", "zeroize"] }
x-wing = { version = "=0.1.0", default-features = false, features = ["zeroize"] }
chacha20poly1305 = { version = "=0.11.0", default-features = false }
sha3 = { version = "=0.12.0", default-features = false }
k256 = { version = "=0.13.4", default-features = false, features = ["arithmetic", "ecdsa"] }
zeroize = { version = "=1.8.2", default-features = false, features = ["derive"] }

[target.'cfg(target_vendor = "nonos")'.dependencies]
nonos_libc = { package = "nonos_userland_libc", path = "../libc", default-features = false }
nonos_tls = { path = "../nonos_tls" }
nonos_route_link = { path = "../nonos_route_link" }

[features]
default = []
fuzzing = []
view-key-export = []

[lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = ["cfg(kani)"] }
