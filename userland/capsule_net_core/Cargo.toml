[package]
name = "nonos_capsule_net_core"
version = "0.3.0"
edition = "2021"
publish = false
license = "AGPL-3.0"

[[bin]]
name = "net_core"
path = "src/main.rs"

[dependencies]
nonos_libc = { package = "nonos_userland_libc", path = "../libc" }
spin = { version = "0.9", default-features = false, features = ["mutex", "spin_mutex"] }
smoltcp = { version = "0.11", default-features = false, features = [
  "alloc", "medium-ethernet", "proto-ipv4", "proto-dhcpv4", "proto-dns",
  "socket-tcp", "socket-udp", "socket-dhcpv4", "socket-dns", "socket-icmp",
] }

[profile.release]
panic = "abort"
opt-level = 2
lto = false
strip = true
