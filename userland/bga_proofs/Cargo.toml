# NONOS Operating System
# Copyright (C) 2026 NONOS Contributors
#
# Host-runnable proofs for the BGA display capsule: its DISPI mode set and
# read-back, its EDID read, and its half of the display wire. Builds for the
# host so `cargo test` runs the real driver source (included via #[path])
# against a register window and video memory in memory, without a boot and
# without a display adapter.
[package]
name = "bga_proofs"
version = "0.1.0"
edition = "2021"

[lib]
path = "src/lib.rs"

[dependencies]
nonos_devmodel = { path = "../nonos_devmodel" }
nonos_edid = { path = "../nonos_edid" }
nonos_gfx_serve = { path = "../nonos_gfx_serve" }
nonos_gfx_wire = { path = "../nonos_gfx_wire" }
