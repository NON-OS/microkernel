# Fuzz target for the AgentProof policy file reader, held to check_file.
# Run with: cargo +nightly-2026-01-16 fuzz run policy_file

[package]
name = "agentproof_proofs-fuzz"
version = "0.0.0"
edition = "2021"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
agentproof_proofs = { path = ".." }

[[bin]]
name = "policy_file"
path = "fuzz_targets/policy_file.rs"
test = false
doc = false
bench = false

[workspace]
