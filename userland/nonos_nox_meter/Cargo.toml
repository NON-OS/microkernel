[package]
name = "nonos_nox_meter"
version = "0.1.0"
edition = "2021"
description = "The meter's accounting: channels, budget, vouchers and their signing request, no_std"
license = "AGPL-3.0"

[package.metadata.nonos]
test-lane = true

[lib]
crate-type = ["rlib"]

[dependencies]
nonos_marketplace_abi = { path = "../marketplace_abi" }
nonos_nox_config = { path = "../nonos_nox_config" }
nonos_nox_chunks = { path = "../nonos_nox_chunks" }
# The Equi-X solution an escrow request carries.
nonos_equix = { path = "../nonos_equix" }
nonos_payment_proto = { path = "../payment_proto" }
nonos_settle_proto = { path = "../settle_proto" }

# keccak-256 on the host, so the tests check every hash against an
# independent implementation.
[dev-dependencies]
sha3 = { version = "=0.10.9", default-features = false }
# X25519 on the host, as shield_core pins it.
x25519-dalek = { version = "=2.0.1", default-features = false, features = ["static_secrets"] }
