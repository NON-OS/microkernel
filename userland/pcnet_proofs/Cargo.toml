# NONOS Operating System
# Copyright (C) 2026 NONOS Contributors
#
# Host-runnable proofs for the AMD PCnet driver. Builds for the host so
# `cargo test` runs the real driver source (included via #[path]) against a
# register-level model of the Am79C970A: the RAP/RDP indexed registers, the
# init block, and descriptor DMA confined to the driver's grants.
[package]
name = "pcnet_proofs"
version = "0.3.0"
edition = "2021"

[lib]
path = "src/lib.rs"

[dependencies]
nonos_mac = { path = "../nonos_mac" }
nonos_libc = { package = "pcnet_proofs_libc_shim", path = "libc_shim" }
