#
# Host-runnable proofs for the CDC ACM driver: the shipped function
# finding, line coding, notifications, holder and read buffer, and the
# NACM framing run here through #[path].
[package]
name = "cdc_acm_proofs"
version = "0.1.0"
edition = "2021"

[lib]
path = "src/lib.rs"

[dependencies]
nonos_usbnet = { package = "usbnet_proofs", path = "../usbnet_proofs" }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }
