#
# The user-files broker's reader of client requests, and its manifest and
# slot decoders, mounted by user_files_proofs. Run with:
# cargo +nightly-2026-01-16 fuzz run user_files_wire

[package]
name = "user_files_proofs-fuzz"
version = "0.0.0"
edition = "2021"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
user_files_proofs = { path = ".." }
nonos_user_files = { path = "../../nonos_user_files" }

[[bin]]
name = "user_files_wire"
path = "fuzz_targets/user_files_wire.rs"
test = false
doc = false
bench = false

[workspace]
