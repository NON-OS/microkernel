# NONOS userland: capsule_settings
# eK@nonos.systems
#
# The Settings window: the policy store's editor, the Wi-Fi panel and what
# this image and machine report, on `nonos_app_skeleton`. README.md has
# each section and the keys.

[package]
name = "nonos_settings"
version = "0.3.0"
edition = "2021"
publish = false
license = "AGPL-3.0"
authors = ["eK@nonos.systems"]
build = "build.rs"
description = "NONOS settings capsule"

[[bin]]
name = "settings"
path = "src/main.rs"

[dependencies]
nonos_libc = { package = "nonos_userland_libc", path = "../libc" }
nonos_app_skeleton = { path = "../app_skeleton" }
# The audio service's wire format, for the Sound page's output device row.
nonos_audio_proto = { path = "../audio_proto" }
nonos_policy_proto = { path = "../policy_proto" }
nonos_toolkit = { path = "../toolkit", default-features = false }
nonos_wifi_client = { path = "../nonos_wifi_client" }

[profile.release]
panic = "abort"
opt-level = 2
lto = false
debug = false
strip = true

[profile.dev]
panic = "abort"
opt-level = 0
debug = true
