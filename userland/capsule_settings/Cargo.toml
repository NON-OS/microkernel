# NONOS userland: capsule_settings
# eK@nonos.systems
#
# Toggle list with cursor navigation and per-row boolean state. Owned
# state, no globals. Keyboard input (j/k, Space/Enter, Esc). Real
# production capsule built on `nonos_app_skeleton`.

[package]
name = "nonos_settings"
version = "0.3.0"
edition = "2021"
publish = false
license = "AGPL-3.0"
authors = ["eK@nonos.systems"]
build = "build.rs"
description = "NONOS settings capsule"

[[bin]]
name = "settings"
path = "src/main.rs"

[dependencies]
nonos_libc = { package = "nonos_userland_libc", path = "../libc" }
nonos_app_skeleton = { path = "../app_skeleton" }
nonos_policy_proto = { path = "../policy_proto" }
nonos_toolkit = { path = "../toolkit", default-features = false }

[profile.release]
panic = "abort"
opt-level = 2
lto = false
debug = false
strip = true

[profile.dev]
panic = "abort"
opt-level = 0
debug = true
