#
# Host-runnable proofs for nonos_uvc: a camera read from its configuration,
# the probe and commit controls, the alternate setting a stream takes, and
# frames put back together from payloads.
[package]
name = "uvc_proofs"
version = "0.3.0"
edition = "2021"

[lib]
path = "src/lib.rs"

[dependencies]
nonos_uvc = { path = "../nonos_uvc" }
# The bus alt.rs names; on the host, the USB network core's proofs crate.
nonos_usbnet = { package = "usbnet_proofs", path = "../usbnet_proofs" }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }
