# NONOS userland: model_fetch_proofs
#
# Host proofs for the model fetcher's catalogue reader. The shipped sources
# (the reader and the pins it checks against) are included through #[path],
# and the catalogue they read is written by the host tool that builds the
# real one, tools/nonos-qwen-tier.py, so a proof here holds the two sides of
# the format to each other and not to a copy of either. Also the fetcher's
# choice of network, for every answer the policy store could give.
#
# And the install of a Qwen tier from the store, end to end in the pure
# parts: the listing as the kernel names it, the personality's choice of a
# shipped tier over a package index, the model dependency's rules, the
# fetcher's exit statuses, and the store's words.

[package]
name = "nonos_model_fetch_proofs"
version = "0.1.0"
edition = "2021"
publish = false
license = "AGPL-3.0"

[lib]
path = "src/lib.rs"

[dependencies]
nonos_ed25519 = { path = "../nonos_ed25519" }
# The route values the fetcher's network choice reads from the policy store.
nonos_policy_proto = { path = "../policy_proto" }
# The reasons and install stages the store reads, shared with the Terminal.
nonos_market_proto = { path = "../market_proto" }
