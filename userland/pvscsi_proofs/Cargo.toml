# NONOS Operating System
# Copyright (C) 2026 NONOS Contributors
#
# Host-runnable proofs for the PVSCSI driver. Builds for the host so
# `cargo test` runs the real driver source and nonos_scsi_serve (included
# via #[path]) against a PVSCSI model: the command register and its data
# words, the rings state, and the request ring walked on each doorbell and
# answered on the completion ring from nonos_scsi's simulated logical units.
[package]
name = "pvscsi_proofs"
version = "0.3.0"
edition = "2021"

[lib]
path = "src/lib.rs"

[dependencies]
nonos_scsi = { path = "../nonos_scsi" }
nonos_libc = { package = "pvscsi_proofs_libc_shim", path = "libc_shim" }
