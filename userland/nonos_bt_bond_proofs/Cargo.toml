# NONOS Operating System
# Copyright (C) 2026 NONOS Contributors
#
# Host-runnable proofs for nonos_bt_bond: the bond and local key records
# octet by octet and every refusal on reading one back, the record a
# pairing leaves, the book's lookups by identity and by resolving a private
# address, and the address rotation timer.
[package]
name = "nonos_bt_bond_proofs"
version = "0.1.0"
edition = "2021"
publish = false
license = "AGPL-3.0"

[lib]
path = "src/lib.rs"

[dependencies]
nonos_bt_bond = { path = "../nonos_bt_bond" }
nonos_bt_smp = { path = "../nonos_bt_smp" }
nonos_bt_wire = { path = "../nonos_bt_wire" }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }
