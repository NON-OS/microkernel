#
# Any bytes as a NAPR receipt: the reader and the verifier never panic, and
# nothing verifies against a trust no doc can meet.

[package]
name = "agentproof_receipt-fuzz"
version = "0.0.0"
edition = "2021"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
agentproof_receipt = { path = ".." }

[[bin]]
name = "napr"
path = "fuzz_targets/napr.rs"
test = false
doc = false
bench = false

[workspace]
