# AgentProof receipt v0 (NAPR), offline: the format, its writer, and the
# verifier a host runs over a receipt a NONOS machine handed it. It restates
# nothing: the record is nonos_proof_abi's, the box and its hash
# capsule_linux's (through agentproof_policy), the slot-0 note capsule_linux's
# own file, and the attestation document nsh_attest's.

[package]
name = "agentproof_receipt"
version = "0.1.0"
edition = "2021"
publish = false
license = "AGPL-3.0"

[lib]
path = "src/lib.rs"

[[bin]]
name = "agentproof-receipt"
path = "src/bin/agentproof_receipt.rs"
required-features = ["verify"]

[dependencies]
blake3 = { version = "1", default-features = false, features = ["pure"] }
agentproof_policy = { path = "../agentproof_policy" }
nonos_linux_policy = { path = "../nonos_linux_policy" }
nonos_proof_abi = { path = "../nonos_proof_abi" }
nsh_attest = { path = "../nsh_attest", optional = true }

[features]
# The writer alone is what a capsule builds (capsule_prove's receipt job);
# the verifier, its trust file and its CLI need nsh_attest.
default = ["verify"]
verify = ["dep:nsh_attest"]
