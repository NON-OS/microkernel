# Fuzz targets for the market's reply readers. linux_policy: OP_GET_LINUX_POLICY's
# two readers, market_proto's and the kernel's own copy. catalogue: every
# other reader the app store runs over a reply. Run with:
# cargo +nightly-2026-01-16 fuzz run <target>

[package]
name = "nonos_market_proto-fuzz"
version = "0.0.0"
edition = "2021"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
nonos_market_proto = { path = ".." }

[[bin]]
name = "linux_policy"
path = "fuzz_targets/linux_policy.rs"
test = false
doc = false
bench = false

[[bin]]
name = "catalogue"
path = "fuzz_targets/catalogue.rs"
test = false
doc = false
bench = false

[workspace]
