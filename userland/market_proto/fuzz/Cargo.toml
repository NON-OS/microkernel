# Fuzz target for OP_GET_LINUX_POLICY's two readers of the market's reply:
# market_proto's and the kernel's own copy. Run with:
# cargo +nightly-2026-01-16 fuzz run linux_policy

[package]
name = "nonos_market_proto-fuzz"
version = "0.0.0"
edition = "2021"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
nonos_market_proto = { path = ".." }

[[bin]]
name = "linux_policy"
path = "fuzz_targets/linux_policy.rs"
test = false
doc = false
bench = false

[workspace]
