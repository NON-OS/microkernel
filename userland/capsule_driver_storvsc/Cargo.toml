# NONOS userland: capsule_driver_storvsc
#
# Userland Hyper-V synthetic SCSI (storvsc) driver capsule. It runs on the
# SCSI controller's VMBus channel, which the VMBus core gives it, with one
# coherent DMA grant for the channel's two rings and the 64 KiB buffer,
# polled. The disks and CD drives on its targets are served on the block
# wire (NBW1) through nonos_scsi and nonos_scsi_serve.

[package]
name = "nonos_capsule_driver_storvsc"
version = "0.1.0"
edition = "2021"
publish = false
license = "AGPL-3.0"
authors = ["eK@nonos.systems"]
description = "NONOS userland Hyper-V storvsc driver capsule"

[[bin]]
name = "driver_storvsc"
path = "src/main.rs"

[dependencies]
nonos_libc = { package = "nonos_userland_libc", path = "../libc" }
nonos_scsi = { path = "../nonos_scsi" }
nonos_scsi_serve = { path = "../nonos_scsi_serve" }
nonos_vmbus = { path = "../nonos_vmbus" }

[profile.release]
panic = "abort"
opt-level = 2
lto = false
debug = false
strip = true
