# NONOS Operating System
# Copyright (C) 2026 NONOS Contributors
#
# Host-runnable proofs for the browser engine. Builds for the host so
# `cargo test` runs the real engine source (included via #[path]) against
# known-answer inputs, checking rendering-correctness pieces with no GUI.
[package]
name = "capsule_browser_proofs"
version = "0.3.0"
edition = "2021"

[lib]
path = "src/lib.rs"

[features]
# The engine gates its direct-cascade entry behind `harness`; this crate is
# that harness, so `compute` is reachable here and `compute_cached` stays the
# capsule path.
default = ["harness"]
harness = []

[dependencies]
nonos_toolkit = { path = "../toolkit", default-features = false }
nonos_app_skeleton = { path = "../app_skeleton", default-features = false }
nonos_inflate = { path = "../inflate" }
# The route link's own rule for short .anyone names, through short_name.
nonos_route_link = { path = "../nonos_route_link" }
nonos_brotli = { path = "../nonos_brotli" }
spin = { version = "0.9", default-features = false, features = ["mutex", "spin_mutex"] }
# The TLS client, from its real source, with the crypto pool's own handlers
# answering its calls: the fetch machine is proven against real handshakes.
tls_proofs = { path = "../tls_proofs" }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }

[dev-dependencies]
# The keyboard layout tables the drivers resolve through, so the address bar's
# text input is checked against the exact characters a keyboard delivers.
nonos_keymap = { path = "../nonos_keymap" }
