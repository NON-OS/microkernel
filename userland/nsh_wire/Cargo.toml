# The nsh/1 wire format (docs/design/nsh-v1-wire.md): frame lengths, the
# order frames may arrive in, and the parse and encode of every body. It
# has no dependencies and no allocation, so the server capsules and the
# host client build the same source.

[package]
name = "nsh_wire"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0"

[lib]
crate-type = ["rlib"]
