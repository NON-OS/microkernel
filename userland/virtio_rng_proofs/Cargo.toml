# NONOS Operating System
# Copyright (C) 2026 NONOS Contributors
#
# Host-runnable proofs for the virtio-rng driver: its bring-up handshake,
# its request queue and the fill that waits on it. Builds for the host so
# `cargo test` runs the real driver source (included via #[path]) against a
# register window and DMA memory in host memory, without a boot and without a
# device.
[package]
name = "virtio_rng_proofs"
version = "0.1.0"
edition = "2021"

[lib]
path = "src/lib.rs"

[dependencies]
nonos_libc = { package = "virtio_rng_proofs_libc_shim", path = "libc_shim" }
nonos_devmodel = { path = "../nonos_devmodel" }
# The register window, the queue's DMA views and the modern reset.
nonos_virtio = { path = "../nonos_virtio" }
