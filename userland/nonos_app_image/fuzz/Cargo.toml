# Fuzz targets for the app image's head and its chunk list, whose input is
# whatever a mirror or a network path hands the installer. Run with:
# cargo +nightly-2026-01-16 fuzz run image_head
# cargo +nightly-2026-01-16 fuzz run chunk_list

[package]
name = "nonos_app_image-fuzz"
version = "0.0.0"
edition = "2021"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
nonos_app_image = { path = ".." }
blake3 = { version = "1", default-features = false, features = ["pure"] }

[[bin]]
name = "image_head"
path = "fuzz_targets/image_head.rs"
test = false
doc = false
bench = false

[[bin]]
name = "chunk_list"
path = "fuzz_targets/chunk_list.rs"
test = false
doc = false
bench = false

[workspace]
