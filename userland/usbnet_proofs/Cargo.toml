# NONOS Operating System
# Copyright (C) 2026 NONOS Contributors
#
# Host-runnable proofs for the USB network core (nonos_usbnet): the whole
# shipped core runs here through #[path], against descriptors QEMU's usb-net
# device presents and a driver.xhci0 the proofs play through the libc shim.
# The driver proofs crates depend on this one under the name nonos_usbnet,
# so their bindings run against a scripted device.
[package]
name = "usbnet_proofs"
version = "0.3.0"
edition = "2021"

[lib]
path = "src/lib.rs"

[dependencies]
# The included core files name nonos_libc; on the host that is the shim.
nonos_libc = { package = "usbnet_proofs_libc_shim", path = "libc_shim" }
nonos_mac = { path = "../nonos_mac" }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }
