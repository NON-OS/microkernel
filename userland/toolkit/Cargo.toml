# NONOS userland: toolkit

[package]
name = "nonos_toolkit"
version = "0.3.0"
edition = "2021"
authors = ["NONOS Contributors"]
license = "AGPL-3.0"
description = "NONOS toolkit library and migration runtime"

[lib]
name = "nonos_toolkit"
path = "src/lib.rs"

[[bin]]
name = "toolkit"
path = "src/main.rs"

[features]
# `runtime` pulls the libc no_std heap and panic handler for the
# standalone toolkit bin. std capsules disable it and keep the lib only.
default = ["runtime"]
runtime = ["nonos_libc/heap", "nonos_libc/panic-handler"]

[dependencies]
nonos_libc = { package = "nonos_userland_libc", path = "../libc", default-features = false }
spin = "0.9"
ab_glyph = { version = "0.2", default-features = false, features = ["libm"] }
