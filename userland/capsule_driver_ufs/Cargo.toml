# NONOS userland: capsule_driver_ufs
# eK@nonos.systems
#
# Userland UFS host controller (UFSHCI) driver capsule. Drives the host
# through the kernel hardware broker (MkDeviceList / MkDeviceClaim /
# MkPciConfigWrite / MkMmioMap / MkDmaMap), polled, and serves each UFS
# logical unit as a unit on the block wire (NBW1), as driver.sdhci0 serves
# its card.

[package]
name = "nonos_capsule_driver_ufs"
version = "0.1.0"
edition = "2021"
publish = false
license = "AGPL-3.0"
authors = ["eK@nonos.systems"]
description = "NONOS userland UFS host controller driver capsule"

[[bin]]
name = "driver_ufs"
path = "src/main.rs"

[dependencies]
nonos_libc = { package = "nonos_userland_libc", path = "../libc" }
nonos_blk_wire = { path = "../nonos_blk_wire" }

[profile.release]
panic = "abort"
opt-level = 2
lto = false
debug = false
strip = true
