# NONOS userland: capsule_audio_player
#
# Windowed audio player capsule ("Resonare") built on
# `nonos_app_skeleton`: the WAV and MP3 files under /audio, decoded here
# and played through audio.server. README.md has the rest.

[package]
name = "nonos_audio_player"
version = "0.3.0"
edition = "2021"
publish = false
license = "AGPL-3.0"
description = "NONOS audio player capsule"

[[bin]]
name = "audio_player"
path = "src/main.rs"

[dependencies]
# The wire format both ends of the audio service read, instead of a copy each.
nonos_audio_proto = { path = "../audio_proto" }
nonos_libc = { package = "nonos_userland_libc", path = "../libc" }
nonos_app_skeleton = { path = "../app_skeleton" }
# The playing track's cover, decoded here from its tags (src/library/cover_art.rs).
nonos_toolkit = { path = "../toolkit", default-features = false }
# Downloading an MP3 from an address over the chosen route (src/fetch/):
# the route, TLS with the chain checked, and what a download decides.
nonos_route_link = { path = "../nonos_route_link" }
nonos_tls = { path = "../nonos_tls" }
nonos_download = { path = "../nonos_download" }
spin = { version = "0.9", default-features = false, features = ["mutex", "spin_mutex"] }

[build-dependencies]
cc = "1"

[features]
nonos-audio-player-smoketest = []

[profile.release]
panic = "abort"
opt-level = 2
lto = false
debug = false
strip = true

[profile.dev]
panic = "abort"
opt-level = 0
debug = true
