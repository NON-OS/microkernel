# Mode setting for Intel's Gen11 and Gen12 (Xe-LP) display engines, written
# from Intel's public Programmer's Reference Manuals. The Intel display
# capsule calls it through nonos_intel_display_hw's ModeSet.
[package]
name = "nonos_intel_xelp_display"
version = "0.1.0"
edition = "2021"
publish = false
license = "AGPL-3.0"

[lib]
path = "src/lib.rs"

[dependencies]
nonos_edid = { path = "../nonos_edid" }
nonos_intel_display_hw = { path = "../nonos_intel_display_hw" }
