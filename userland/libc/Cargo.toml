# NØNOS userland libc
# eK@nonos.systems
#
# Userspace libc for NØNOS capsules. Exposes only the Mk syscall ABI:
# Mk{IpcSend,IpcRecv,IpcCall}, MkMmap, MkMunmap, MkExit, MkYield, the
# broker family (device/mmio/irq/dma/pio), and MkDebug. There is no fd
# channel and no `read`/`write` helper. Built outside the kernel
# crate. The SYSCALL-instruction trampoline in this crate is the only
# path between CPL=3 capsules and the kernel syscall contract.

[package]
name = "nonos_userland_libc"
version = "0.3.0"
edition = "2021"
publish = false
license = "AGPL-3.0"
authors = ["eK@nonos.systems"]
description = "NØNOS userspace libc — Mk syscall ABI for CPL=3 capsules"

[lib]
name = "nonos_libc"
# `rlib` lets Rust user programs in the workspace depend on this crate
# directly via Cargo. The .a for C-ABI consumers (the real userspace
# distribution shape) is produced by the Makefile through
# `cargo rustc --crate-type staticlib`; declaring staticlib here would
# force a panic handler into every dependent build, which breaks std
# capsules that carry their own.
crate-type = ["rlib"]

[features]
# `heap` registers the crate's linked-list #[global_allocator] and
# `panic-handler` the CPL=3 panic hook. no_std capsules keep both
# (default). std capsules built through the NONOS PAL disable both so
# the std allocator and std panic runtime stay the single program truth.
default = ["heap", "panic-handler"]
heap = ["dep:linked_list_allocator"]
panic-handler = []

[dependencies]
linked_list_allocator = { version = "0.10", default-features = false, features = ["use_spin"], optional = true }

[profile.release]
panic = "abort"
opt-level = 2
lto = false
debug = false
strip = true

[profile.dev]
panic = "abort"
opt-level = 0
debug = true
