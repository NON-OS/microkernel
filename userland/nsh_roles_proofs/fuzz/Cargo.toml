# Fuzz targets for nsh_roles' parsers: the role table, `nsh-policy/1`, and
# the revocation list, `nsh-revoke/1`. A host reads both from storage it
# does not fully trust before their signatures are checked. Each target
# checks what a parse that succeeds must mean, not only that it does not
# panic. Seed the corpus with seed.py, then run one with:
#   cargo +nightly-2026-01-16 fuzz run <target>

[package]
name = "nsh_roles_proofs-fuzz"
version = "0.0.0"
edition = "2021"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
nsh_roles = { path = "../../nsh_roles" }
nsh_wire = { path = "../../nsh_wire" }

[[bin]]
name = "nsh_policy"
path = "fuzz_targets/nsh_policy.rs"
test = false
doc = false
bench = false

[[bin]]
name = "nsh_revoke"
path = "fuzz_targets/nsh_revoke.rs"
test = false
doc = false
bench = false

[workspace]
