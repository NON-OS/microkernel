# Host proofs for nsh_roles: every check in docs/design/nsh-v1-roles.md is a
# test, and every refusal is reached by a table, a list or a grant that
# differs from a good one in exactly that respect. Grants, tables, lists and
# approvals carry real hybrid signatures, made with keys the tests derive
# from fixed seeds.

[package]
name = "nsh_roles_proofs"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
nonos_ed25519 = { path = "../nonos_ed25519" }
nonos_hash = { path = "../nonos_hash" }
nonos-mldsa65 = { path = "../../nonos-mldsa65" }
nsh_crypto = { path = "../nsh_crypto" }
nsh_roles = { path = "../nsh_roles" }
nsh_wire = { path = "../nsh_wire" }

# The signatures are made in the C and in Rust; unoptimised, the tests take
# minutes rather than seconds.
[profile.dev]
opt-level = 2
