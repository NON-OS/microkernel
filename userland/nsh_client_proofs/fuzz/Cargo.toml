# Fuzz targets for nsh_client: the client state machine fed arbitrary
# server bytes at each stage of the handshake and the session, sealed with
# the right keys where a stage needs them, and the record checker fed
# arbitrary records and edits of a good one. Each target checks what must
# hold, not only that nothing panics. Seed the corpus with seed.py, then
# run one with:
#   cargo +nightly-2026-01-16 fuzz run <target>

[package]
name = "nsh_client_proofs-fuzz"
version = "0.0.0"
edition = "2021"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
nsh_client = { path = "../../nsh_client" }
nsh_client_proofs = { path = ".." }
nsh_wire = { path = "../../nsh_wire" }

[[bin]]
name = "nsh_client_feed"
path = "fuzz_targets/nsh_client_feed.rs"
test = false
doc = false
bench = false

[[bin]]
name = "nsh_record_verify"
path = "fuzz_targets/nsh_record_verify.rs"
test = false
doc = false
bench = false

[workspace]
