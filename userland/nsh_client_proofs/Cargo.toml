# Host proofs for nsh_client: the whole handshake against a test server
# built here from nsh_wire and nsh_crypto; every refusal reached by a run
# that differs from a good one in that one respect; the session frames and
# their order; and the record checker on good, tampered, cut-short and
# checkpointed records. The kit (keys, server, builders) is a library so
# the fuzz targets in fuzz/ drive the same server.

[package]
name = "nsh_client_proofs"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
nonos_ed25519 = { path = "../nonos_ed25519" }
nonos_hash = { path = "../nonos_hash" }
nonos-mldsa65 = { path = "../../nonos-mldsa65" }
nsh_client = { path = "../nsh_client", features = ["cli"] }
nsh_crypto = { path = "../nsh_crypto" }
nsh_wire = { path = "../nsh_wire" }
