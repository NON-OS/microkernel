# NONOS Operating System
# Copyright (C) 2026 NONOS Contributors
#
# Host-runnable proofs for the VMware absolute pointer driver. Builds for
# the host so `cargo test` runs the real driver source (included via #[path])
# against a model of QEMU's vmmouse behind the backdoor, reached through the
# kernel's own allowlist of backdoor calls (also included by path).
[package]
name = "vmmouse_proofs"
version = "0.3.0"
edition = "2021"

[lib]
path = "src/lib.rs"

[dependencies]
nonos_libc = { package = "vmmouse_proofs_libc_shim", path = "libc_shim" }
