# NONOS Operating System
# Copyright (C) 2026 NONOS Contributors
#
# Host-runnable proofs for the Intel LPSS I2C capsule's bring-up: the LPSS
# reset deassert, the dead-MMIO guard, the SCL count arithmetic and the target
# address change. Builds for the host so `cargo test` runs the real driver
# source (included via #[path]) against a register window in memory, without a
# boot and without a controller.
[package]
name = "i2c_pci_proofs"
version = "0.1.0"
edition = "2021"

[lib]
path = "src/lib.rs"

[dependencies]
nonos_devmodel = { path = "../nonos_devmodel" }
