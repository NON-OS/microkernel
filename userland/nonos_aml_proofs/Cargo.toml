#
# Host proofs for nonos_aml. The interpreter's sources are mounted by #[path]
# so the tests run the shipping code itself; every fixture is built by the
# small AML encoder in src/enc, written here from the ACPI 6.5 grammar, so no
# table enters the tree as an opaque blob.
[package]
name = "nonos_aml_proofs"
version = "0.1.0"
edition = "2021"

[lib]
path = "src/lib.rs"

[dependencies]

# The stack-depth proofs (tests/idioms/deep_tests.rs) measure what a call
# costs on the capsule's stack, and the capsule is built optimized; an
# unoptimized test build costs several times that per call and stops at the
# stack share early. Optimized in every profile, the suite measures the
# capsule's frames whether it is run with --release or without.
[profile.dev]
opt-level = 3
