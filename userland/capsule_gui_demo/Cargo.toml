# NONOS userland: capsule_gui_demo
#
# Minimal GUI capsule shipped only through the on-disk package store: opens a
# window through the wm, paints, and counts pointer clicks. Never embedded in
# the kernel image.

[package]
name = "nonos_gui_demo"
version = "0.1.0"
edition = "2021"
publish = false
license = "AGPL-3.0"
description = "NONOS gui_demo capsule"

[[bin]]
name = "gui_demo"
path = "src/main.rs"

[dependencies]
nonos_libc = { package = "nonos_userland_libc", path = "../libc" }
nonos_app_skeleton = { path = "../app_skeleton" }

[profile.release]
panic = "abort"
opt-level = 2
lto = false
debug = false
strip = true

[profile.dev]
panic = "abort"
opt-level = 0
debug = true
