# The client side of nsh/1 (docs/design/nsh-v1*.md) as a library: a
# state machine that takes the server's bytes and gives the bytes to send,
# with no sockets, no clock and no entropy of its own. It accepts a host
# only through its signature, its enrolment and an attestation check the
# caller supplies, and only then sends the user's credential. Beside it is
# the offline checker of session records and checkpoints, and the
# nsh-verify-record tool built over it.

[package]
name = "nsh_client"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0"

[lib]
crate-type = ["rlib"]

[[bin]]
name = "nsh-verify-record"
path = "src/bin/nsh_verify_record.rs"
required-features = ["cli"]

[dependencies]
nonos_ed25519 = { path = "../nonos_ed25519" }
nonos_hash = { path = "../nonos_hash" }
nonos-mldsa65 = { path = "../../nonos-mldsa65" }
nsh_crypto = { path = "../nsh_crypto" }
nsh_wire = { path = "../nsh_wire" }

[features]
# The host tool nsh-verify-record, which needs std to read its files.
cli = []
