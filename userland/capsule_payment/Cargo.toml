# NONOS userland: capsule_payment
# eK@nonos.systems
#
# The meter (plan/20): cumulative NOX vouchers on prefunded channels, under
# the owner's budget. The keyring signs with the meter's own key; the
# accounting is nonos_nox_meter's, and the state file is tagged so a file
# the meter did not write is refused.

[package]
name = "nonos_capsule_payment"
version = "0.4.0"
edition = "2021"
publish = false
license = "AGPL-3.0"
authors = ["eK@nonos.systems"]
description = "NONOS meter: NOX vouchers on prefunded channels"

[[bin]]
name = "payment"
path = "src/main.rs"

[features]
# An offer on the local test chain (P5) passes the chain check, as settle
# reads it. Only the development capsule set turns it on.
devnet = ["nonos_nox_config/devnet"]

[dependencies]
nonos_libc = { package = "nonos_userland_libc", path = "../libc" }
nonos_market_proto = { path = "../market_proto" }
nonos_marketplace_abi = { path = "../marketplace_abi" }
nonos_nox_config = { path = "../nonos_nox_config" }
nonos_nox_meter = { path = "../nonos_nox_meter" }
# ORDER_OFFER (plan/29): the answer's seal, the proof of work, the buyer key.
nonos_nox_chunks = { path = "../nonos_nox_chunks" }
nonos_equix = { path = "../nonos_equix" }
x25519-dalek = { version = "=2.0.1", default-features = false, features = ["static_secrets", "zeroize"] }
nonos_payment_proto = { path = "../payment_proto" }
nonos_policy_client = { path = "../policy_client" }
nonos_policy_proto = { path = "../policy_proto" }
nonos_seal = { path = "../nonos_seal" }
nonos_settle_proto = { path = "../settle_proto" }
nonos_vault = { path = "../nonos_vault" }
sha3 = { version = "=0.10.9", default-features = false }

[profile.release]
panic = "abort"
opt-level = 2
lto = false
debug = false
strip = true
