#
# Host proofs for nonos_pinctrl: the controller each _HID picks (and every
# Intel one refused while no published layout exists), pin resolution over a
# synthetic layout, and the Intel and AMD register arithmetic at its edges.
[package]
name = "pinctrl_proofs"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
nonos_pinctrl = { path = "../nonos_pinctrl" }
