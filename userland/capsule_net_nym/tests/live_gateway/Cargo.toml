[package]
name = "nym-live-gateway"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
blake3 = "1"
x25519-dalek = { version = "2", features = ["static_secrets"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
bs58 = "0.5"
tungstenite = "0.24"
hkdf = "0.12"
hmac = "0.12"
sha2 = "0.10"
serde_json = "1"
nonos_libc = { path = "shim" }

# Nym's own implementation, used as an oracle: a packet this capsule builds
# is unwrapped by the real code hop by hop, so a fault is named at the layer it
# happens on rather than inferred from a mixnet that answers nothing.
sphinx-packet = { git = "https://github.com/nymtech/sphinx", branch = "develop" }

[[bin]]
name = "nym-live-gateway"
path = "src/main.rs"
