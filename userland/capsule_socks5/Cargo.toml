# NONOS userland: capsule_socks5
# eK@nonos.systems
#
# SOCKS5 front end for the mixnet. Speaks RFC 1928 to local clients and
# carries their streams to a Nym network requester over `net.nym`, so an
# application reaches the network through the mixnet without knowing the
# mixnet exists.

[package]
name = "nonos_capsule_socks5"
version = "0.3.0"
edition = "2021"
publish = false
license = "AGPL-3.0"
authors = ["eK@nonos.systems"]
description = "NONOS userland SOCKS5 to mixnet bridge capsule"

[[bin]]
name = "socks5"
path = "src/main.rs"

[dependencies]
nonos_libc = { package = "nonos_userland_libc", path = "../libc" }
spin = { version = "0.9", default-features = false, features = ["mutex", "spin_mutex"] }
