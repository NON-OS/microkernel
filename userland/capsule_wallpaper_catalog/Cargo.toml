# NONOS capsule_wallpaper_catalog
# Bundles the 63 Full-HD wallpaper JPEGs and serves them over IPC.
# Read-only, no policy decisions, no decoding — pure asset vendor.
# Consumer is capsule_wallpaper, which decodes & paints.

[package]
name = "nonos_capsule_wallpaper_catalog"
version = "0.3.0"
edition = "2021"
publish = false
license = "AGPL-3.0"
authors = ["eK@nonos.systems"]
description = "NONOS wallpaper asset catalog"

[[bin]]
name = "wallpaper_catalog"
path = "src/main.rs"

[dependencies]
nonos_libc = { package = "nonos_userland_libc", path = "../libc" }
spin = { version = "0.9", default-features = false, features = ["mutex", "spin_mutex"] }

[profile.release]
panic = "abort"
opt-level = 2
lto = false
debug = false
strip = true

[profile.dev]
panic = "abort"
opt-level = 0
debug = true
