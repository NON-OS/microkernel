# NONOS Operating System
# Copyright (C) 2026 NONOS Contributors
#
# Host-runnable proofs for the ixgbe (82599, X540, X550) driver capsule.
# Builds for the host so `cargo test` runs the real driver source (included
# via #[path]) against hostile descriptors and a modelled register file,
# without a boot and without the part. QEMU has no ixgbe device.
[package]
name = "ixgbe_proofs"
version = "0.1.0"
edition = "2021"

[lib]
path = "src/lib.rs"

[dependencies]
nonos_devmodel = { path = "../nonos_devmodel" }
nonos_mac = { path = "../nonos_mac" }
nonos_libc = { package = "ixgbe_proofs_libc_shim", path = "libc_shim" }
