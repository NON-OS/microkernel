# Fuzz target for the AML capsule_acpi runs over firmware tables: the
# definition block, the parser, the loader and the interpreter, with region
# reads answered from the fuzz input. Run with:
# cargo +nightly-2026-01-16 fuzz run aml -- -timeout=10 -rss_limit_mb=2048

[package]
name = "nonos_aml-fuzz"
version = "0.0.0"
edition = "2021"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
nonos_aml = { path = ".." }

[[bin]]
name = "aml"
path = "fuzz_targets/aml.rs"
test = false
doc = false
bench = false

[workspace]
