# Fuzz target for the link's proof of who a relay is: the CERTS cell split,
# the Ed25519 certificate reader, the chain check that binds the TLS
# certificate to the relay's identity, and VERSIONS. Run with:
#   cargo +nightly-2026-01-16 fuzz run anon_link_certs <corpus>

[package]
name = "anon_link_proofs-fuzz"
version = "0.0.0"
edition = "2021"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
anon_link_proofs = { path = ".." }

[[bin]]
name = "anon_link_certs"
path = "fuzz_targets/anon_link_certs.rs"
test = false
doc = false
bench = false

[workspace]
