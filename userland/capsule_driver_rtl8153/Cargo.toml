# NONOS userland: capsule_driver_rtl8153
# eK@nonos.systems
#
# Realtek RTL8153 and RTL8153B USB 3.0 gigabit Ethernet in their vendor
# configuration. It sits above driver.xhci0 through nonos_usbnet and serves
# Ethernet frames to net.core over NNET. It has no controller, MMIO, IRQ or
# DMA authority: the chip's registers are reached by vendor control
# transfers on endpoint 0.

[package]
name = "nonos_capsule_driver_rtl8153"
version = "0.1.0"
edition = "2021"
publish = false
license = "AGPL-3.0"
authors = ["eK@nonos.systems"]
description = "NONOS userland Realtek RTL8153/RTL8153B USB Ethernet driver capsule"

[[bin]]
name = "driver_rtl8153"
path = "src/main.rs"

[dependencies]
nonos_libc = { package = "nonos_userland_libc", path = "../libc" }
nonos_usbnet = { path = "../nonos_usbnet" }

[profile.release]
panic = "abort"
opt-level = 2
lto = false
debug = false
strip = true
