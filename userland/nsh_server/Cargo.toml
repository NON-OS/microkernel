#
# The host side of nsh/1 (docs/nsh/nsh-v1*.md) as a library: a sans-IO
# state machine that answers CLIENT_HELLO, proves the host with its hybrid
# keys, its enrolment and the kernel's attestation document, admits a user
# only on a signed role grant the host's role table allows, carries the
# session, and writes and signs the session record. The caller supplies
# the clock, the entropy, the host keys and the attestation source.

[package]
name = "nsh_server"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0"

[lib]
crate-type = ["rlib"]

[dependencies]
nonos_ed25519 = { path = "../nonos_ed25519" }
nonos_hash = { path = "../nonos_hash" }
nonos-mldsa65 = { path = "../../nonos-mldsa65" }
nsh_crypto = { path = "../nsh_crypto" }
nsh_roles = { path = "../nsh_roles" }
nsh_wire = { path = "../nsh_wire" }
