#
# Host proofs that the kernel's randomness callers fail closed: ASLR, the
# capability token nonces, the secure byte API and the misc helpers, and
# the pre-seed line. The kernel's own files are mounted by #[path]; only the
# seeded RNG, the CPU's random instruction and the serial line stand in.

[package]
name = "rng_fail_closed_proofs"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
path = "src/lib.rs"
