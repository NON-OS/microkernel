#
# Host-runnable proofs for the SOCKS5 wire codec. Builds for the host so
# `cargo test` runs the real codec source (included via #[path]) against
# hand-built request and greeting bytes, checking the exact parse and reply.
[package]
name = "socks5_proofs"
version = "0.3.0"
edition = "2021"

[lib]
path = "src/lib.rs"
