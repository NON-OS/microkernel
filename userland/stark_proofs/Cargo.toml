#
# Host-runnable proofs for the STARK field arithmetic. Includes the real
# src/crypto/stark source and checks it against the field axioms.
[package]
name = "stark_proofs"
version = "0.3.0"
edition = "2021"

[lib]
path = "src/lib.rs"

[dependencies]
nonos-stark = { path = "../../stark-attest/crates/stark-core" }

[dev-dependencies]
rayon = "1"

[features]
# Forwards to the prover's all-cores path. The emit-hash gate builds the crate
# both ways and diffs the proof bytes; they must be identical.
parallel = ["nonos-stark/parallel"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }
