# NONOS Operating System
# Copyright (C) 2026 NONOS Contributors
#
# Host-runnable proofs for the stark-attest engine (the v3-era nonos-stark
# crate in stark-attest/crates/stark-core), plus the kernel's BLAKE3, SHA-3
# and constant-time files included by #[path]. Not the v4 gates' nox_verify.
[package]
name = "stark_proofs"
version = "0.3.0"
edition = "2021"

[lib]
path = "src/lib.rs"

[dependencies]
nonos-stark = { path = "../../stark-attest/crates/stark-core" }

[dev-dependencies]
blake3 = { version = "1.0", default-features = false }
rayon = "1"

[features]
# Forwards to the prover's all-cores path. The emit-hash gate builds the crate
# both ways and diffs the proof bytes; they must be identical.
parallel = ["nonos-stark/parallel"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }
