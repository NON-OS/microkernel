#
# The fuzz target for the Linux personality's Wayland server, mounted whole by
# capsule_wayland_proofs: every global bound, then requests to any object the
# client holds or never made, raw wire bytes, descriptors and input between.
# Run with:
# cargo +nightly-2026-01-16 fuzz run wayland_session

[package]
name = "capsule_wayland_proofs-fuzz"
version = "0.0.0"
edition = "2021"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
libc = "0.2"
nonos_capsule_wayland_proofs = { path = ".." }
nonos_libc = { package = "capsule_wayland_proofs_libc_shim", path = "../libc_shim" }
nonos_app_skeleton = { package = "capsule_wayland_proofs_skeleton_shim", path = "../skeleton_shim" }

[[bin]]
name = "wayland_session"
path = "fuzz_targets/wayland_session.rs"
test = false
doc = false
bench = false

[workspace]
