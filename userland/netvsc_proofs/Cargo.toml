# NONOS Operating System
# Copyright (C) 2026 NONOS Contributors
#
# Host-runnable proofs for the netvsc driver. Builds for the host so
# `cargo test` runs the real driver source (included via #[path]) against a
# Hyper-V network host model: nonos_vmbus's model of the host's side for the
# GPADLs, the open and the close, and a network VSP on the channel's rings
# written from OpenVMM's netvsp (the host side Microsoft publishes, cited
# line by line), with a switch that drops a spoofed source address unless
# MAC spoofing is on, and a DHCP server on the wire.
[package]
name = "netvsc_proofs"
version = "0.1.0"
edition = "2021"
publish = false
license = "AGPL-3.0-or-later"

[lib]
path = "src/lib.rs"

[dependencies]
nonos_vmbus = { path = "../nonos_vmbus", features = ["model"] }
nonos_libc = { package = "netvsc_proofs_libc_shim", path = "libc_shim" }
