# NONOS userland: nonos_avi
# eK@nonos.systems
#
# `no_std` RIFF/AVI demuxer. Pure logic over borrowed byte slices, no
# allocation in the parse path and no I/O, so it is testable on the host
# and linkable into a CPL=3 capsule unchanged.

