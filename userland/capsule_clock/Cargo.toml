# NONOS userland: capsule_clock
# eK@nonos.systems
#
# Windowed clock app: digital + analog clock, stopwatch, timer. Reads the
# NTP-corrected system time. Real production capsule on `nonos_app_skeleton`.

[package]
name = "nonos_clock"
version = "0.3.0"
edition = "2021"
publish = false
license = "AGPL-3.0"
authors = ["eK@nonos.systems"]
description = "NONOS clock capsule"

[[bin]]
name = "clock"
path = "src/main.rs"

[dependencies]
nonos_libc = { package = "nonos_userland_libc", path = "../libc" }
nonos_app_skeleton = { path = "../app_skeleton" }

[profile.release]
panic = "abort"
opt-level = 2
lto = false
debug = false
strip = true

[profile.dev]
panic = "abort"
opt-level = 0
debug = true
