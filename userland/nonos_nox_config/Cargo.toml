[package]
name = "nonos_nox_config"
version = "0.1.0"
edition = "2021"
description = "Every NOX chain constant the OS builds against, in one place, no_std"
license = "AGPL-3.0"

[package.metadata.nonos]
test-lane = true
# tests/devnet.rs again with the local test chain on: cargo test only, which
# ships nothing (scripts/check_devnet_feature.py, the lane rule).
feature-lanes = ["devnet"]

[lib]
crate-type = ["rlib"]

[features]
# A local test chain, for development images only (P5): never in a release
# profile, which nonos-ci's devnet check holds to.
devnet = []

[dependencies]

# keccak-256 on the host only, so the tests derive every pinned hash
# independently of the constants they check.
[dev-dependencies]
sha3 = { version = "=0.10.9", default-features = false }
