# NONOS Operating System
# Copyright (C) 2026 NONOS Contributors
#
# Host-runnable proofs for the RTL8153 driver: the shipped r8153 module
# runs here through #[path], binding a register model of the chip behind
# usbnet_proofs's scripted bus, and its RX and TX framing is checked on
# transfers built from r8152's struct rx_desc and struct tx_desc.
[package]
name = "rtl8153_proofs"
version = "0.3.0"
edition = "2021"

[lib]
path = "src/lib.rs"

[dependencies]
nonos_usbnet = { package = "usbnet_proofs", path = "../usbnet_proofs" }
nonos_libc = { package = "xhci_proofs_libc_shim", path = "../xhci_proofs/libc_shim" }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }
