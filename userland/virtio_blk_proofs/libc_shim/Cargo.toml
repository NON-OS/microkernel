#
# Stands in for nonos_libc under the included virtio-blk driver files: an
# interrupt line and a clock a test scripts, the device list it presents,
# kept debug lines. Named nonos_libc on the library side so the driver's
# `use` lines resolve unchanged.
[package]
name = "virtio_blk_proofs_libc_shim"
version = "0.1.0"
edition = "2021"
publish = false
license = "AGPL-3.0-or-later"

[lib]
name = "nonos_libc"
path = "src/lib.rs"
