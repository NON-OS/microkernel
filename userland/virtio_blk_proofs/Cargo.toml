# NONOS Operating System
# Copyright (C) 2026 NONOS Contributors
#
# Host-runnable proofs for the virtio-blk driver's untrusted-input parsers.
# Builds for the host so `cargo test` runs the real driver source (included
# via #[path]) against adversarial requests, without a boot.
[package]
name = "virtio_blk_proofs"
version = "0.3.0"
edition = "2021"

[lib]
path = "src/lib.rs"

[dependencies]
# Register windows and DMA memory in host memory, for the driver to run on.
nonos_devmodel = { path = "../nonos_devmodel" }
# The interrupt line, the clock and the device list the driver calls, scripted.
nonos_libc = { package = "virtio_blk_proofs_libc_shim", path = "libc_shim" }
# The driver state holds the modern transport's register regions.
nonos_virtio = { path = "../nonos_virtio" }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }
