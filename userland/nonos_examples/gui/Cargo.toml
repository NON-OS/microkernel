# NØNOS runtime example: GUI surface
# eK@nonos.systems
#
# A GUI capsule: create a surface, map it, paint a solid frame, and
# present it. Declares CoreExec, Memory, and the Graphics caps for
# display query, surface create/map, and present.

[package]
name = "nonos-example-gui"
version = "0.2.0"
edition = "2021"
publish = false
license = "AGPL-3.0"
authors = ["eK@nonos.systems"]
description = "NØNOS runtime example: GUI surface capsule"

[[bin]]
name = "gui_surface"
path = "src/main.rs"

[dependencies]
nonos-runtime = { path = "../../nonos_runtime" }

[profile.release]
panic = "abort"
opt-level = 2
lto = false
debug = false
strip = true
