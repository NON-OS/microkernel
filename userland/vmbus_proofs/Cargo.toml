# NONOS Operating System
# Copyright (C) 2026 NONOS Contributors
#
# Host-runnable proofs for the VMBus core. Builds for the host so `cargo
# test` runs the real driver source (included via #[path]) against a model
# of a VMBus host (QEMU's hw/hyperv/vmbus.c), reached through the kernel's
# own check of what the core may post (also included by path), with the
# broker's claim and grant on host memory and a virtual clock.
[package]
name = "vmbus_proofs"
version = "0.3.0"
edition = "2021"

[lib]
path = "src/lib.rs"

[dependencies]
nonos_libc = { package = "vmbus_proofs_libc_shim", path = "libc_shim" }
