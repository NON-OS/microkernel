#
# Fuzz targets for net.anon's readers of what the network sends: onion
# service descriptors and the layers inside them, the signed names list,
# cells, consensus and microdescriptor documents, and the replies an
# introduction and a rendezvous bring back. Run one with:
#   cargo +nightly-2026-01-16 fuzz run <target> <corpus>
# where seed.py writes <corpus> from the proofs' own vectors.

[package]
name = "anon_onion_proofs-fuzz"
version = "0.0.0"
edition = "2021"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
anon_onion_proofs = { path = ".." }

[[bin]]
name = "anon_descriptor"
path = "fuzz_targets/anon_descriptor.rs"
test = false
doc = false
bench = false

[[bin]]
name = "anon_names"
path = "fuzz_targets/anon_names.rs"
test = false
doc = false
bench = false

[[bin]]
name = "anon_network"
path = "fuzz_targets/anon_network.rs"
test = false
doc = false
bench = false

[workspace]
