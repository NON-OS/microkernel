# NONOS Operating System
# Copyright (C) 2026 NONOS Contributors
#
# Shared WiFi core: the chip-independent 802.11/WPA2/WPA3 brains and the
# net_core link adapter both the Intel (iwlwifi) and Realtek (rtl8821ce)
# drivers depend on. no_std for the drivers; std under `cargo test` for the
# host proofs.
[package]
name = "nonos_wifi_core"
version = "0.3.0"
edition = "2021"

[lib]
path = "src/lib.rs"

# The SHA-256 AKMs (SAE, PSK-SHA256) key their PTK expansion with HMAC-SHA256,
# the same RustCrypto crates, versions and features the TLS client and
# capsule_crypto already build for the capsule target. AES, AES-CMAC and the
# NIST P-256 group SAE runs over (IEEE 802.11 group 19) are the system's one
# each, in nonos_aes and nonos_p256, which the Bluetooth Security Manager
# uses too.
[dependencies]
nonos_aes = { path = "../nonos_aes" }
nonos_p256 = { path = "../nonos_p256" }
sha2 = { version = "0.10", default-features = false, features = ["force-soft"] }
hmac = { version = "0.12", default-features = false }
# The local, unicast address bits, shared with every network driver.
nonos_mac = { path = "../nonos_mac" }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }

[package.metadata.nonos]
test-lane = true
