# Durable keeping of nsh/1 session records on a host with a filesystem.
# The sans-IO server hands its host each record's bytes as they grow and a
# signed checkpoint every few entries; this crate writes both to owner-only
# files, one pair per session, never overwriting one, and syncs the record
# bytes a checkpoint covers before the checkpoint itself, so a crash leaves
# a record that checks as far as its last checkpoint.

[package]
name = "nsh_record_store"
version = "0.1.0"
edition = "2021"
publish = false
license = "AGPL-3.0"

[lib]
path = "src/lib.rs"

[dependencies]
nsh_server = { path = "../nsh_server" }
nsh_wire = { path = "../nsh_wire" }
