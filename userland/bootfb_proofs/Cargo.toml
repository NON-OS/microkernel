# NONOS Operating System
# Copyright (C) 2026 NONOS Contributors
#
# Host-runnable proofs for the boot framebuffer capsule's display half.
# Builds for the host so `cargo test` runs the shipping source (included
# via #[path]) through the shared wire server, against a framebuffer in
# host memory laid out blue first or red first.
[package]
name = "bootfb_proofs"
version = "0.1.0"
edition = "2021"

[lib]
path = "src/lib.rs"

[dependencies]
nonos_gfx_serve = { path = "../nonos_gfx_serve" }
nonos_gfx_wire = { path = "../nonos_gfx_wire" }
