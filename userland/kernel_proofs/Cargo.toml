# NONOS Operating System
# Copyright (C) 2026 NONOS Contributors
#
# Host-runnable proofs for kernel isolation and authorization logic. Builds for
# the host so `cargo test` runs the real kernel source (included via #[path])
# against its security invariants, without a boot.
[package]
name = "kernel_proofs"
version = "0.3.0"
edition = "2021"

[lib]
path = "src/lib.rs"

[dependencies]
# The attestation registry is real kernel code: its table is a spin mutex and
# its root is a blake3 fold.
spin = { version = "0.9", default-features = false, features = ["mutex", "spin_mutex"] }
blake3 = { version = "1.5", default-features = false }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }
