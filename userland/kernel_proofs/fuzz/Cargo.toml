# Fuzz target for the kernel's capsule ELF header reader, mounted from src/elf
# by kernel_proofs. Run with: cargo +nightly-2026-01-16 fuzz run elf_header

[package]
name = "kernel_proofs-fuzz"
version = "0.0.0"
edition = "2021"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
kernel_proofs = { path = ".." }

[[bin]]
name = "elf_header"
path = "fuzz_targets/elf_header.rs"
test = false
doc = false
bench = false

[workspace]
