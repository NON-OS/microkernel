# Fuzz targets for image_codec: image_decode runs any bytes through its
# whole decode step under every op, image_request reads its request frames
# and holds and lets go of its outputs in any order. Run with:
# cargo +nightly-2026-01-16 fuzz run image_decode (or image_request)

[package]
name = "image_codec_proofs-fuzz"
version = "0.0.0"
edition = "2021"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
image_codec_proofs = { path = ".." }

[[bin]]
name = "image_decode"
path = "fuzz_targets/image_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "image_request"
path = "fuzz_targets/image_request.rs"
test = false
doc = false
bench = false

[workspace]
