# NONOS userland: capsule_driver_tg3
# eK@nonos.systems
#
# Userland Broadcom 57765-class ("tg3") GbE driver capsule: the BCM57761,
# 57762, 57765, 57766, 57781, 57782, 57785, 57786, 57791 and 57795 in client
# laptops and desktops. Drives the port through the kernel hardware broker
# (MkDeviceList / MkDeviceClaim / MkPciConfigWrite / MkMmioMap / MkDmaMap),
# polled, with no interrupt line bound. Frames only, on the NNET wire every
# NIC capsule speaks, so net.core and net.l2 drive it as they drive e1000.

[package]
name = "nonos_capsule_driver_tg3"
version = "0.1.0"
edition = "2021"
publish = false
license = "AGPL-3.0"
authors = ["eK@nonos.systems"]
description = "NONOS userland Broadcom tg3 (57765 class) driver capsule"

[[bin]]
name = "driver_tg3"
path = "src/main.rs"

[dependencies]
nonos_libc = { package = "nonos_userland_libc", path = "../libc" }
nonos_mac = { path = "../nonos_mac" }

[profile.release]
panic = "abort"
opt-level = 2
lto = false
debug = false
strip = true
