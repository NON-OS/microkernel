# NONOS userland: capsule_net_tcp_smoke
# eK@nonos.systems
#
# TCP lifecycle smoketest driver. Emits deterministic serial markers
# consumed by tests/boot/tcp_lifecycle.sh. Scaffold only — markers
# go green once Tasks 2–10 wire the full TCP state machine.

[package]
name = "nonos_capsule_net_tcp_smoke"
version = "0.1.0"
edition = "2021"
publish = false
license = "AGPL-3.0"
authors = ["eK@nonos.systems"]
description = "NONOS userland TCP lifecycle smoketest capsule"

[[bin]]
name = "net_tcp_smoke"
path = "src/main.rs"

[dependencies]
nonos_libc = { package = "nonos_userland_libc", path = "../libc" }

[profile.release]
panic = "abort"
opt-level = 2
lto = false
debug = false
strip = true
