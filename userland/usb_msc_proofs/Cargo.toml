# NONOS Operating System
# Copyright (C) 2026 NONOS Contributors
#
# Host-runnable proofs for the USB mass-storage driver's untrusted-input
# parsers. Builds for the host so `cargo test` runs the real driver source
# (included via #[path]) against adversarial descriptors, status wrappers, and
# requests, without a boot.
[package]
name = "usb_msc_proofs"
version = "0.3.0"
edition = "2021"

[lib]
path = "src/lib.rs"

[dependencies]
# The UAS transport's IU codec and exchange, which disk/uas.rs runs on.
nonos_uas = { path = "../nonos_uas" }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }
