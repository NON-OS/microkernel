#
# Host-runnable proofs for the services that speak the seq | op wire and
# answer through their reply endpoint: keyring, installer, payment and ramfs.
# The kernel brokers calls to them, and apps call them directly too. Builds
# for the host so `cargo test` runs each one's real request decode and reply
# encoder (included via #[path]) against any bytes a caller can send.
[package]
name = "seq_wire_proofs"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
