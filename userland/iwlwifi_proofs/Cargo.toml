#
# Host-runnable proofs for the iwlwifi driver's firmware-load register
# sequence. Builds for the host so `cargo test` runs the real load code
# (included via #[path]) against a modeled device that records every MMIO
# write and simulates the FH completion, validating the exact FH transfer
# sequence with no hardware.
[package]
name = "iwlwifi_proofs"
version = "0.3.0"
edition = "2021"

[lib]
path = "src/lib.rs"

[dependencies]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }
