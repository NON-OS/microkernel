# NONOS Operating System
# Copyright (C) 2026 NONOS Contributors
#
# Host-runnable proofs for the iwlwifi driver's firmware-load register
# sequence. Builds for the host so `cargo test` runs the real load code
# (included via #[path]) against a modeled device that records every MMIO
# write and simulates the FH completion, validating the exact FH transfer
# sequence with no hardware.
[package]
name = "iwlwifi_proofs"
version = "0.3.0"
edition = "2021"

[lib]
path = "src/lib.rs"

[dependencies]
# The bring-up's release path: its four release calls, recorded by the shim.
nonos_libc = { package = "iwlwifi_proofs_libc_shim", path = "libc_shim" }
# The scan list and beacon parsing the gen3 scan feeds, as the capsule links them.
nonos_wifi_core = { path = "../nonos_wifi_core" }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }
