# NONOS Operating System
# Copyright (C) 2026 NONOS Contributors
#
# Host-runnable proofs for the SVGA II display driver. Builds for the host so
# `cargo test` runs the real driver source (included via #[path]) against a
# model of the adapter's registers and FIFO, with the broker's maps standing
# on host memory, from the version handshake to the host redrawing a frame.
[package]
name = "vmware_svga_proofs"
version = "0.3.0"
edition = "2021"

[lib]
path = "src/lib.rs"

[dependencies]
nonos_libc = { package = "vmware_svga_proofs_libc_shim", path = "libc_shim" }
# The wire server the driver now serves through, and its bodies.
nonos_gfx_serve = { path = "../nonos_gfx_serve" }
nonos_gfx_wire = { path = "../nonos_gfx_wire" }
