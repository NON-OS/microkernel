#
# Host-runnable proofs for the virtio-net driver's device-facing RX path and
# untrusted protocol input. Builds for the host so `cargo test` runs the real
# driver source (included via #[path]) against hostile used-ring values,
# without a boot.
[package]
name = "virtio_net_proofs"
version = "0.3.0"
edition = "2021"

[lib]
path = "src/lib.rs"

[dependencies]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }
