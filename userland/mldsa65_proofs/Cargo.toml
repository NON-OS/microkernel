# Host proofs for nonos-mldsa65: the published known-answer digest for
# ML-DSA-65, reproduced through the crate with the NIST test generator's
# AES-256 CTR DRBG; byte-for-byte agreement with nonos-sign, the host build
# of the source the kernel and the loader compile; and the crate's own
# refusals of failed randomness.

[package]
name = "mldsa65_proofs"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
nonos-mldsa65 = { path = "../../nonos-mldsa65" }
nonos_aes = { path = "../nonos_aes" }
nonos_hash = { path = "../nonos_hash" }
