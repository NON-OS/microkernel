<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="676" viewBox="0 0 1200 676" role="img" aria-label="the-box"><defs><marker id="a66FFFF" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#66FFFF"/></marker><marker id="aFF7A7A" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#FF7A7A"/></marker><marker id="a98A0AB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#98A0AB"/></marker><marker id="a007C85" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#007C85"/></marker></defs><rect x="1" y="1" width="1198" height="674" rx="18" fill="#0A0B0D" stroke="#2A2F37"/><text x="48" y="54" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" font-weight="600" fill="#66FFFF" text-anchor="start" letter-spacing="2.4">EVERY APP IN ITS OWN BOX</text><text x="48" y="94" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#F2F4F7" text-anchor="start">What the kernel lets a program reach</text><text x="48" y="124" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#98A0AB" text-anchor="start">A Marketplace listing names the box. The kernel checks it on every call.</text><rect x="48" y="170" width="300" height="400" rx="12" fill="#11141A" stroke="#2A2F37" stroke-width="1.2"/><text x="198" y="206" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#F2F4F7" text-anchor="middle">A Linux program</text><text x="198" y="232" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#98A0AB" text-anchor="middle">Telegram Desktop</text><text x="198" y="280" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="400" fill="#98A0AB" text-anchor="middle" letter-spacing="2">ITS LISTING'S BOX</text><rect x="98" y="296" width="200" height="38" rx="12" fill="#0E2A2E" stroke="#66FFFF" stroke-width="1.6"/><text x="198.0" y="318.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="16" font-weight="400" fill="#98A0AB" text-anchor="middle">WAYLAND</text><rect x="98" y="348" width="200" height="38" rx="12" fill="#0E2A2E" stroke="#66FFFF" stroke-width="1.6"/><text x="198.0" y="370.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="16" font-weight="400" fill="#98A0AB" text-anchor="middle">FILES_HOME</text><rect x="98" y="400" width="200" height="38" rx="12" fill="#0E2A2E" stroke="#66FFFF" stroke-width="1.6"/><text x="198.0" y="422.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="16" font-weight="400" fill="#98A0AB" text-anchor="middle">NET_ANON</text><rect x="500" y="150" width="26" height="466" rx="13" fill="#0E2A2E" stroke="#66FFFF" stroke-width="1.6"/><text x="513" y="648" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="400" fill="#66FFFF" text-anchor="middle" letter-spacing="2">THE KERNEL CHECKS THE BOX ON EVERY CALL</text><line x1="348" y1="196" x2="600" y2="196" stroke="#66FFFF" stroke-width="2" marker-end="url(#a66FFFF)"/><rect x="606" y="170" width="546" height="52" rx="12" fill="#0E2A2E" stroke="#66FFFF" stroke-width="1.6"/><text x="879.0" y="189.5" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#F2F4F7" text-anchor="middle">A window of its own</text><text x="879.0" y="213.5" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#98A0AB" text-anchor="middle">drawn on the NØNOS desktop</text><line x1="348" y1="262" x2="600" y2="262" stroke="#66FFFF" stroke-width="2" marker-end="url(#a66FFFF)"/><rect x="606" y="236" width="546" height="52" rx="12" fill="#0E2A2E" stroke="#66FFFF" stroke-width="1.6"/><text x="879.0" y="255.5" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#F2F4F7" text-anchor="middle">Its own home folder</text><text x="879.0" y="279.5" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#98A0AB" text-anchor="middle">and no other files</text><line x1="348" y1="328" x2="600" y2="328" stroke="#66FFFF" stroke-width="2" marker-end="url(#a66FFFF)"/><rect x="606" y="302" width="546" height="52" rx="12" fill="#0E2A2E" stroke="#66FFFF" stroke-width="1.6"/><text x="879.0" y="321.5" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#F2F4F7" text-anchor="middle">The network</text><text x="879.0" y="345.5" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#98A0AB" text-anchor="middle">over Anyone only</text><line x1="348" y1="398" x2="496" y2="398" stroke="#FF7A7A" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#aFF7A7A)"/><path d="M505 390 L521 406 M521 390 L505 406" stroke="#FF7A7A" stroke-width="3" stroke-linecap="round"/><line x1="530" y1="398" x2="600" y2="398" stroke="#FF7A7A" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#aFF7A7A)"/><rect x="606" y="372" width="546" height="52" rx="12" fill="#1E1214" stroke="#FF7A7A" stroke-width="1.6" stroke-dasharray="7 6"/><text x="879.0" y="391.5" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#F2F4F7" text-anchor="middle">Your other files</text><text x="879.0" y="415.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" font-weight="400" fill="#98A0AB" text-anchor="middle">No such file or directory</text><line x1="348" y1="460" x2="496" y2="460" stroke="#FF7A7A" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#aFF7A7A)"/><path d="M505 452 L521 468 M521 452 L505 468" stroke="#FF7A7A" stroke-width="3" stroke-linecap="round"/><line x1="530" y1="460" x2="600" y2="460" stroke="#FF7A7A" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#aFF7A7A)"/><rect x="606" y="434" width="546" height="52" rx="12" fill="#1E1214" stroke="#FF7A7A" stroke-width="1.6" stroke-dasharray="7 6"/><text x="879.0" y="453.5" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#F2F4F7" text-anchor="middle">Another program’s memory</text><text x="879.0" y="477.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" font-weight="400" fill="#98A0AB" text-anchor="middle">refused ptrace: a guest does not inspect or steer another</text><line x1="348" y1="522" x2="496" y2="522" stroke="#FF7A7A" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#aFF7A7A)"/><path d="M505 514 L521 530 M521 514 L505 530" stroke="#FF7A7A" stroke-width="3" stroke-linecap="round"/><line x1="530" y1="522" x2="600" y2="522" stroke="#FF7A7A" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#aFF7A7A)"/><rect x="606" y="496" width="546" height="52" rx="12" fill="#1E1214" stroke="#FF7A7A" stroke-width="1.6" stroke-dasharray="7 6"/><text x="879.0" y="515.5" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#F2F4F7" text-anchor="middle">Another program</text><text x="879.0" y="539.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" font-weight="400" fill="#98A0AB" text-anchor="middle">refused execve: its policy does not grant EXEC</text><line x1="348" y1="584" x2="496" y2="584" stroke="#FF7A7A" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#aFF7A7A)"/><path d="M505 576 L521 592 M521 576 L505 592" stroke="#FF7A7A" stroke-width="3" stroke-linecap="round"/><line x1="530" y1="584" x2="600" y2="584" stroke="#FF7A7A" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#aFF7A7A)"/><rect x="606" y="558" width="546" height="52" rx="12" fill="#1E1214" stroke="#FF7A7A" stroke-width="1.6" stroke-dasharray="7 6"/><text x="879.0" y="577.5" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#F2F4F7" text-anchor="middle">The keyboard</text><text x="879.0" y="601.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" font-weight="400" fill="#98A0AB" text-anchor="middle">not in its world</text></svg>
