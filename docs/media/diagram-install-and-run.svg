<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-label="install-and-run"><defs><marker id="a66FFFF" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#66FFFF"/></marker><marker id="aFF7A7A" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#FF7A7A"/></marker><marker id="a98A0AB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#98A0AB"/></marker><marker id="a007C85" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#007C85"/></marker></defs><rect x="1" y="1" width="1198" height="398" rx="18" fill="#0A0B0D" stroke="#2A2F37"/><text x="48" y="54" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" font-weight="600" fill="#66FFFF" text-anchor="start" letter-spacing="2.4">THE MARKETPLACE</text><text x="48" y="94" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#F2F4F7" text-anchor="start">From a listing to a window</text><text x="48" y="124" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#98A0AB" text-anchor="start">Each step is checked before the next one runs.</text><rect x="48" y="170" width="200" height="150" rx="12" fill="#11141A" stroke="#2A2F37" stroke-width="1.2"/><text x="148.0" y="228.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#F2F4F7" text-anchor="middle">A listing</text><text x="148.0" y="254.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#98A0AB" text-anchor="middle">names the program,</text><text x="148.0" y="276.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#98A0AB" text-anchor="middle">its licence and its box</text><line x1="248" y1="245" x2="272" y2="245" stroke="#66FFFF" stroke-width="2" marker-end="url(#a66FFFF)"/><rect x="272" y="170" width="200" height="150" rx="12" fill="#11141A" stroke="#2A2F37" stroke-width="1.2"/><text x="372.0" y="228.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#F2F4F7" text-anchor="middle">The signed index</text><text x="372.0" y="254.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#98A0AB" text-anchor="middle">every package is</text><text x="372.0" y="276.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#98A0AB" text-anchor="middle">checked against it</text><line x1="472" y1="245" x2="496" y2="245" stroke="#66FFFF" stroke-width="2" marker-end="url(#a66FFFF)"/><rect x="496" y="170" width="200" height="150" rx="12" fill="#11141A" stroke="#2A2F37" stroke-width="1.2"/><text x="596.0" y="228.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#F2F4F7" text-anchor="middle">Fetch</text><text x="596.0" y="254.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#98A0AB" text-anchor="middle">one package at a time,</text><text x="596.0" y="276.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#98A0AB" text-anchor="middle">over the chosen route</text><line x1="696" y1="245" x2="720" y2="245" stroke="#66FFFF" stroke-width="2" marker-end="url(#a66FFFF)"/><rect x="720" y="170" width="200" height="150" rx="12" fill="#0E2A2E" stroke="#66FFFF" stroke-width="1.6"/><text x="820.0" y="228.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#F2F4F7" text-anchor="middle">The box</text><text x="820.0" y="254.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#98A0AB" text-anchor="middle">the listing's grants</text><text x="820.0" y="276.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#98A0AB" text-anchor="middle">become the policy</text><line x1="920" y1="245" x2="944" y2="245" stroke="#66FFFF" stroke-width="2" marker-end="url(#a66FFFF)"/><rect x="944" y="170" width="200" height="150" rx="12" fill="#0E2A2E" stroke="#66FFFF" stroke-width="1.6"/><text x="1044.0" y="228.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#F2F4F7" text-anchor="middle">A window</text><text x="1044.0" y="254.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#98A0AB" text-anchor="middle">the program draws</text><text x="1044.0" y="276.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#98A0AB" text-anchor="middle">on the desktop</text><text x="48" y="362" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#98A0AB" text-anchor="start">A failed install names the package and the check that stopped it.</text></svg>
