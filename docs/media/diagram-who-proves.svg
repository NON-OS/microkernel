<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-label="who-proves"><defs><marker id="a66FFFF" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#66FFFF"/></marker><marker id="aFF7A7A" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#FF7A7A"/></marker><marker id="a98A0AB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#98A0AB"/></marker><marker id="a007C85" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#007C85"/></marker></defs><rect x="1" y="1" width="1198" height="378" rx="18" fill="#0A0B0D" stroke="#2A2F37"/><text x="48" y="54" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" font-weight="600" fill="#66FFFF" text-anchor="start" letter-spacing="2.4">THE STARK GATE</text><text x="48" y="94" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#F2F4F7" text-anchor="start">Who proves and who verifies</text><text x="48" y="124" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#98A0AB" text-anchor="start">Proofs are made where memory is plentiful or the secret lives. The kernel carries only the verifier.</text><rect x="48" y="170" width="240" height="150" rx="12" fill="#11141A" stroke="#2A2F37" stroke-width="1.2"/><text x="168.0" y="228.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#F2F4F7" text-anchor="middle">Build host</text><text x="168.0" y="256.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#98A0AB" text-anchor="middle">makes the proofs</text><text x="168.0" y="279.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#98A0AB" text-anchor="middle">and the policy roots</text><line x1="288" y1="245" x2="336" y2="245" stroke="#66FFFF" stroke-width="2" marker-end="url(#a66FFFF)"/><rect x="336" y="170" width="240" height="150" rx="12" fill="#0E2A2E" stroke="#66FFFF" stroke-width="1.6"/><text x="456.0" y="228.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#F2F4F7" text-anchor="middle">Kernel</text><text x="456.0" y="256.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#98A0AB" text-anchor="middle">verifies only;</text><text x="456.0" y="279.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#98A0AB" text-anchor="middle">no prover inside</text><line x1="576" y1="245" x2="624" y2="245" stroke="#66FFFF" stroke-width="2" marker-end="url(#a66FFFF)"/><rect x="624" y="170" width="240" height="150" rx="12" fill="#11141A" stroke="#2A2F37" stroke-width="1.2"/><text x="744.0" y="228.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#F2F4F7" text-anchor="middle">User space</text><text x="744.0" y="256.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#98A0AB" text-anchor="middle">device and Shield provers,</text><text x="744.0" y="279.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#98A0AB" text-anchor="middle">each sandboxed</text><line x1="864" y1="245" x2="912" y2="245" stroke="#66FFFF" stroke-width="2" marker-end="url(#a66FFFF)"/><rect x="912" y="170" width="240" height="150" rx="12" fill="#11141A" stroke="#2A2F37" stroke-width="1.2"/><text x="1032.0" y="228.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#F2F4F7" text-anchor="middle">Anyone else</text><text x="1032.0" y="256.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#98A0AB" text-anchor="middle">checks proofs in a browser</text><text x="1032.0" y="279.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#98A0AB" text-anchor="middle">or on Ethereum</text></svg>
