<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" role="img" aria-label="capsule-admission"><defs><marker id="a66FFFF" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#66FFFF"/></marker><marker id="aFF7A7A" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#FF7A7A"/></marker><marker id="a98A0AB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#98A0AB"/></marker><marker id="a007C85" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#007C85"/></marker></defs><rect x="1" y="1" width="1198" height="688" rx="18" fill="#0A0B0D" stroke="#2A2F37"/><text x="48" y="54" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" font-weight="600" fill="#66FFFF" text-anchor="start" letter-spacing="2.4">CAPSULE ADMISSION</text><text x="48" y="94" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#F2F4F7" text-anchor="start">Four steps before a program runs</text><text x="48" y="124" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#98A0AB" text-anchor="start">The kernel builds the attested statement from the bytes it is about to run and the rights it is about to grant.</text><rect x="300" y="156" width="138" height="40" rx="12" fill="#11141A" stroke="#2A2F37" stroke-width="1.2"/><text x="369.0" y="179.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#98A0AB" text-anchor="middle">program file</text><rect x="450" y="156" width="138" height="40" rx="12" fill="#11141A" stroke="#2A2F37" stroke-width="1.2"/><text x="519.0" y="179.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#98A0AB" text-anchor="middle">certificate</text><rect x="600" y="156" width="138" height="40" rx="12" fill="#11141A" stroke="#2A2F37" stroke-width="1.2"/><text x="669.0" y="179.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#98A0AB" text-anchor="middle">manifest</text><rect x="750" y="156" width="138" height="40" rx="12" fill="#11141A" stroke="#2A2F37" stroke-width="1.2"/><text x="819.0" y="179.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#98A0AB" text-anchor="middle">STARK trailer</text><rect x="300" y="236" width="600" height="74" rx="12" fill="#11141A" stroke="#2A2F37" stroke-width="1.2"/><text x="600.0" y="267.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#F2F4F7" text-anchor="middle">1  Certificate</text><text x="600.0" y="293.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#98A0AB" text-anchor="middle">signed by the trust anchor, Ed25519 and ML-DSA-65</text><line x1="600" y1="310" x2="600" y2="340" stroke="#66FFFF" stroke-width="2" marker-end="url(#a66FFFF)"/><line x1="900" y1="273" x2="980" y2="273" stroke="#FF7A7A" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#aFF7A7A)"/><rect x="300" y="342" width="600" height="74" rx="12" fill="#11141A" stroke="#2A2F37" stroke-width="1.2"/><text x="600.0" y="373.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#F2F4F7" text-anchor="middle">2  Manifest</text><text x="600.0" y="399.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#98A0AB" text-anchor="middle">signed by the publisher; names the file’s hash and its rights</text><line x1="600" y1="416" x2="600" y2="446" stroke="#66FFFF" stroke-width="2" marker-end="url(#a66FFFF)"/><line x1="900" y1="379" x2="980" y2="379" stroke="#FF7A7A" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#aFF7A7A)"/><rect x="300" y="448" width="600" height="74" rx="12" fill="#11141A" stroke="#2A2F37" stroke-width="1.2"/><text x="600.0" y="479.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#F2F4F7" text-anchor="middle">3  STARK gate</text><text x="600.0" y="505.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#98A0AB" text-anchor="middle">the kernel’s own statement: this file, with these rights, is in the policy tree</text><line x1="600" y1="522" x2="600" y2="552" stroke="#66FFFF" stroke-width="2" marker-end="url(#a66FFFF)"/><line x1="900" y1="485" x2="980" y2="485" stroke="#FF7A7A" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#aFF7A7A)"/><rect x="300" y="554" width="600" height="74" rx="12" fill="#0E2A2E" stroke="#66FFFF" stroke-width="1.6"/><text x="600.0" y="585.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#F2F4F7" text-anchor="middle">4  Start</text><text x="600.0" y="611.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#98A0AB" text-anchor="middle">with exactly the rights the manifest grants</text><line x1="600" y1="196" x2="600" y2="234" stroke="#66FFFF" stroke-width="2" marker-end="url(#a66FFFF)"/><rect x="982" y="256" width="170" height="250" rx="12" fill="#1E1214" stroke="#FF7A7A" stroke-width="1.6" stroke-dasharray="7 6"/><text x="1067.0" y="363.5" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#F2F4F7" text-anchor="middle">Any refusal</text><text x="1067.0" y="388.5" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#98A0AB" text-anchor="middle">the capsule</text><text x="1067.0" y="410.5" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#98A0AB" text-anchor="middle">never runs</text><polyline points="982,273 982,380" fill="none" stroke="#FF7A7A" stroke-width="2" stroke-dasharray="6 5"/><polyline points="982,379 982,485" fill="none" stroke="#FF7A7A" stroke-width="2" stroke-dasharray="6 5"/></svg>
