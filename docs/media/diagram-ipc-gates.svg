<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-label="ipc-gates"><defs><marker id="a66FFFF" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#66FFFF"/></marker><marker id="aFF7A7A" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#FF7A7A"/></marker><marker id="a98A0AB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#98A0AB"/></marker><marker id="a007C85" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#007C85"/></marker></defs><rect x="1" y="1" width="1198" height="468" rx="18" fill="#0A0B0D" stroke="#2A2F37"/><text x="48" y="54" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" font-weight="600" fill="#66FFFF" text-anchor="start" letter-spacing="2.4">MESSAGES BETWEEN CAPSULES</text><text x="48" y="94" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#F2F4F7" text-anchor="start">Four gates on every send</text><text x="48" y="124" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#98A0AB" text-anchor="start">The kernel writes the sender’s name itself, so it cannot be forged.</text><rect x="48.0" y="170" width="150" height="64" rx="12" fill="#0E2A2E" stroke="#66FFFF" stroke-width="1.6"/><text x="123.0" y="206.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#F2F4F7" text-anchor="middle">sender</text><line x1="198.0" y1="202" x2="238.8" y2="202" stroke="#66FFFF" stroke-width="2" marker-end="url(#a66FFFF)"/><rect x="238.8" y="170" width="150" height="64" rx="12" fill="#11141A" stroke="#2A2F37" stroke-width="1.2"/><text x="313.8" y="206.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#F2F4F7" text-anchor="middle">IPC right</text><line x1="388.8" y1="202" x2="429.6" y2="202" stroke="#66FFFF" stroke-width="2" marker-end="url(#a66FFFF)"/><line x1="313.8" y1="234" x2="313.8" y2="262" stroke="#FF7A7A" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#aFF7A7A)"/><text x="313.8" y="284" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" font-weight="400" fill="#FF7A7A" text-anchor="middle">EPERM</text><rect x="429.6" y="170" width="150" height="64" rx="12" fill="#11141A" stroke="#2A2F37" stroke-width="1.2"/><text x="504.6" y="206.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#F2F4F7" text-anchor="middle">Endpoint rights</text><line x1="579.6" y1="202" x2="620.4" y2="202" stroke="#66FFFF" stroke-width="2" marker-end="url(#a66FFFF)"/><line x1="504.6" y1="234" x2="504.6" y2="262" stroke="#FF7A7A" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#aFF7A7A)"/><text x="504.6" y="284" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" font-weight="400" fill="#FF7A7A" text-anchor="middle">EPERM</text><rect x="620.4000000000001" y="170" width="150" height="64" rx="12" fill="#11141A" stroke="#2A2F37" stroke-width="1.2"/><text x="695.4000000000001" y="206.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#F2F4F7" text-anchor="middle">Allowed peers</text><line x1="770.4000000000001" y1="202" x2="811.2" y2="202" stroke="#66FFFF" stroke-width="2" marker-end="url(#a66FFFF)"/><line x1="695.4000000000001" y1="234" x2="695.4000000000001" y2="262" stroke="#FF7A7A" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#aFF7A7A)"/><text x="695.4000000000001" y="284" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" font-weight="400" fill="#FF7A7A" text-anchor="middle">EPERM</text><rect x="811.2" y="170" width="150" height="64" rx="12" fill="#11141A" stroke="#2A2F37" stroke-width="1.2"/><text x="886.2" y="206.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#F2F4F7" text-anchor="middle">Byte budget</text><line x1="961.2" y1="202" x2="1002.0" y2="202" stroke="#66FFFF" stroke-width="2" marker-end="url(#a66FFFF)"/><line x1="886.2" y1="234" x2="886.2" y2="262" stroke="#FF7A7A" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#aFF7A7A)"/><text x="886.2" y="284" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" font-weight="400" fill="#FF7A7A" text-anchor="middle">EAGAIN</text><rect x="1002.0" y="170" width="150" height="64" rx="12" fill="#0E2A2E" stroke="#66FFFF" stroke-width="1.6"/><text x="1077.0" y="206.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#F2F4F7" text-anchor="middle">Inbox</text><rect x="48" y="330" width="540" height="100" rx="12" fill="#0B1F22" stroke="#007C85" stroke-width="1.6"/><text x="318.0" y="362.5" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#F2F4F7" text-anchor="middle">A call and its reply</text><text x="318.0" y="387.5" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#98A0AB" text-anchor="middle">a fresh token pairs each reply with its call;</text><text x="318.0" y="409.5" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#98A0AB" text-anchor="middle">a caller can owe only a few replies at once</text><rect x="612" y="330" width="540" height="100" rx="12" fill="#11141A" stroke="#2A2F37" stroke-width="1.2"/><text x="882.0" y="362.5" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#F2F4F7" text-anchor="middle">What each gate asks</text><text x="882.0" y="387.5" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#98A0AB" text-anchor="middle">the IPC bit in the token, the endpoint’s own required bits,</text><text x="882.0" y="409.5" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#98A0AB" text-anchor="middle">the endpoint and peer lists, then a byte budget</text></svg>
