[target.x86_64-nonos]
rustflags = [
  "-C", "force-frame-pointers=yes",
  # Pin curve25519-dalek's backend for the kernel too. Left to choose it reads
  # the build host's CPU (AVX/SIMD on an x86 host, serial on aarch64), so the
  # kernel ELF came out with different bytes on a Linux host than a macOS one
  # and `reproducible / compare` failed on it. Set here rather than in a
  # RUSTFLAGS env so the frame-pointer flag above is kept (env would replace
  # the whole set). The make and image builds already pin it the same way.
  "--cfg", 'curve25519_dalek_backend="serial"',
]

[target.aarch64-nonos]
rustflags = [
  # Every function that saves its link register signs it with the IA key and
  # authenticates it before returning (pac-ret), and every function reachable
  # by an indirect branch starts on a landing pad (bti). Both are hint-space
  # instructions, no-ops on a core without the feature, so one image still
  # runs on a Cortex-A72. Applied to core and alloc too, through build-std.
  # The kernel checks its own instructions for both before turning either
  # on (security::bti::built), so a build without this line runs unprotected
  # rather than faulting.
  "-Z", "branch-protection=bti,pac-ret",
]

# Platform-specific runners are defined in the Makefile for portability
# Use `make run` instead of `cargo run` for QEMU testing

# Fetch git dependencies through the git CLI, so a private repository is read
# with the credentials git already has.
[net]
git-fetch-with-cli = true
