name = "nonos_extraction"
defaultTargets = ["NonosExtraction"]

# Aeneas support library, pinned to the release that generated Caps.lean.
# Its prebuilt archive is fetched by lake (preferReleaseBuild); mathlib
# oleans come from the mathlib cache.
[[require]]
name = "aeneas"
git = "https://github.com/AeneasVerif/aeneas"
rev = "45061fa1a5b4bad876f17c03d3a5544d818622e6"
subDir = "backends/lean"

# The core-only Nonos specification package, built from source in tree.
[[require]]
name = "nonos"
path = "../../lean"

# Every module under NonosExtraction is a build target in its own right.
# Importing all of them into one root does not work: Aeneas emits the same
# derived instance in every crate that uses a discriminant attribute, and two
# independent definitions of it collide when merged into one environment. A
# glob builds and checks each module without merging them, which is what the
# gate needs.
[[lean_lib]]
name = "NonosExtraction"
globs = ["NonosExtraction.+"]

[[lean_lib]]
name = "Policy"
