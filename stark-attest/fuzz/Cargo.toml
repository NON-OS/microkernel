[package]
name = "stark-attest-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
nonos-stark = { path = "../crates/stark-core" }

[[bin]]
name = "trailer"
path = "fuzz_targets/trailer.rs"
test = false
doc = false
bench = false

[[bin]]
name = "proof_ext"
path = "fuzz_targets/proof_ext.rs"
test = false
doc = false
bench = false

[[bin]]
name = "aggregate"
path = "fuzz_targets/aggregate.rs"
test = false
doc = false
bench = false

[workspace]
