# nsh-enrol: the fleet operator's tool for nsh/1 enrolment certificates
# (nsh-enrol/1). It runs on the operator's own machine and nowhere else:
# no image and no capsule builds it.

[package]
name = "nsh-enrol"
version = "0.1.0"
edition = "2021"
publish = false
license = "AGPL-3.0"

# The command line, run whole. The library is checked against the client
# in userland/nsh_attest_proofs, which builds the documents it reads.
[package.metadata.nonos]
test-lane = true

[lib]
name = "nsh_enrol"
path = "src/lib.rs"

[[bin]]
name = "nsh-enrol"
path = "src/main.rs"

[dependencies]
nsh_attest = { path = "../../userland/nsh_attest" }
nsh_crypto = { path = "../../userland/nsh_crypto" }
nsh_wire = { path = "../../userland/nsh_wire" }
nonos_ed25519 = { path = "../../userland/nonos_ed25519" }
nonos_hash = { path = "../../userland/nonos_hash" }
nonos-mldsa65 = { path = "../../nonos-mldsa65" }

[workspace]
