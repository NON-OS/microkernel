# Fuzz targets for the attestation path crate, the one parser of untrusted
# trailer bytes shared by the bootloader, the spawn gate and the enroll tool.
# Run one with: cargo +nightly-2026-01-16 fuzz run <target>

[package]
name = "nonos-attest-path-fuzz"
version = "0.0.0"
edition = "2021"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
nonos-attest-path = { path = "..", features = ["alloc"] }

[[bin]]
name = "v4_parse"
path = "fuzz_targets/v4_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "v3_path"
path = "fuzz_targets/v3_path.rs"
test = false
doc = false
bench = false

[workspace]
