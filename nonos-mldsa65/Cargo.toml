# ML-DSA-65 (FIPS 204) for userland and the host: one Rust face over the
# pinned C source in third_party/pqclean, so a capsule and the nsh client
# sign and verify with the same code the kernel, the loader and nonos-sign
# compile. Randomness is the caller's: nothing here reads an entropy source
# of its own, so the same crate serves a capsule and a host.

[package]
name = "nonos-mldsa65"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
publish = false
links = "nonos_mldsa65"

[lib]
path = "src/lib.rs"

[build-dependencies]
cc = "1.1"
